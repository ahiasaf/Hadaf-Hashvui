<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הדף השבועי של בני עקיבא</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E2E63">
<meta name="robots" content="noindex">
<meta property="og:title" content="הדף השבועי של בני עקיבא">
<meta property="og:description" content="תוכנית לימוד גמרא לנוער.">
<style>
/* ============================================================
   העמוד שנשלח לבעלי הזכויות.

   כאן היה מסמך: מלבן אדום, ארבעה סעיפים, ורשימת בקשות. אחר כך
   היה מכתב ארוך. שניהם נכשלו באותו דבר — הם ביקשו מהקורא לעבוד.

   מה שמבקשים כאן אינו זכיון אלא טובה, ולטובה עונים בכן או בלא
   תוך חצי דקה. לכן: פסקה וחצי, ומיד הכפתור. מי שיסתכל יבין לבד
   מה זה, וזה עדיף על כל הסבר.

   שני דברים שאסור להחזיר:
   * **טיעון על רכישת ספרים.** החוברות שהתוכנית מזמינה הן של
     הוצאות אחרות. "אנחנו קונים ספרים" נשמע טוב עד שקולטים שזה
     אצל המתחרה, ואז זה הופך את הבקשה לעלבון.
   * **קישור חיצוני לכתב הרשאה של ההוצאה.** מפנה את הקורא החוצה,
     ורומז שיש כבר הסדר — בדיוק מה שאין.
   ============================================================ */
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold:#C08F2B; --gold-l:#E5B854;
  --paper:#F6F1E6; --surface:#FFFDF8; --ink:#1B2A45; --ink-2:#5A6780;
  --ink-3:#5C687E; --rule:#E5DAC3;
}
*{box-sizing:border-box}

/* תמונה שעוד אין לה כתובת — לא מציגים סימן שבור.
   הלוגו מוטמע ב-logo.js, והקובץ הזה שוקל 88KB ומגיע מהרשת.
   עד שהוא נוחת, ל-<img> אין src בכלל — והדפדפן מצייר במקומו
   ריבוע שבור. בקליטה טובה זה מהבהב לרגע; בקליטה חלשה זה מה
   שרואים במשך שניות, ובדיוק במסך הראשון של האפליקציה.

   visibility ולא display: המסגרת שומרת על מקומה, ולכן כשהלוגו
   מגיע שום דבר לא קופץ. */
img:not([src]){visibility:hidden}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.9;
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:34rem;margin:0 auto;padding:0 22px 50px}

header{background:linear-gradient(150deg,var(--blue-d),var(--blue));color:#fff;
  padding:calc(env(safe-area-inset-top) + 26px) 20px 28px;text-align:center}
header img{height:44px;margin-bottom:10px}
header h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}

.say{font-size:1.06rem;color:var(--ink);margin:26px 0 0}
.say b{font-weight:800}
.say + .say{margin-top:14px}

.btn{display:block;text-align:center;text-decoration:none;font-weight:800;
  font-size:1.05rem;border-radius:14px;padding:17px;margin-top:26px;
  background:linear-gradient(140deg,var(--gold-l),var(--gold));color:var(--ink);
  box-shadow:0 6px 18px rgba(192,143,43,.3)}

hr{border:0;border-top:1px solid var(--rule);margin:32px 0 20px}
.cred{font-size:.9rem;color:var(--ink-2);line-height:1.85}
.cred h3{margin:0 0 2px;font-size:.9rem;font-weight:800;color:var(--blue-d)}
.cred div{margin-bottom:14px}
.cred div:last-child{margin-bottom:0}
.cred small{display:block;color:var(--ink-3);font-weight:600;font-size:.82rem}
footer{text-align:center;color:var(--ink-3);font-size:.82rem;font-weight:600;
  margin-top:30px;line-height:1.9}
</style>
</head>
<body>

<header>
  <img id="logo" alt="בני עקיבא">
  <h1>הדף השבועי של בני עקיבא</h1>
</header>

<main class="wrap">

  <p class="say" id="t-hello"></p>
  <p class="say" id="t-body"></p>
  <p class="say" id="t-ask"></p>

  <a class="btn" id="demo" href="learn.html?mas=taanit&daf=%D7%91"></a>

  <hr>

  <div class="cred">
    <div><h3 id="t-gem"></h3><span id="t-gemLine"></span>
      <small id="t-gemNote"></small></div>
    <div><h3 id="t-chav"></h3><span id="t-chavLine"></span>
      <small id="t-chavNote"></small></div>
    <div id="t-end"></div>
  </div>

  <footer id="foot"></footer>
</main>

<script src="a11y.js"></script>
<script src="data.js"></script>
<script src="textedit.js"></script>
<script src="logo.js"></script>
<script>
/* הלוגו והשמות מגיעים מאותם קבצים של האפליקציה, כדי ששינוי
   בפרטי הקשר לא ישכח את העמוד הזה מאחור. */
document.getElementById('logo').src = window.LOGO_FULL || window.LOGO_MARK || '';
document.getElementById('foot').innerHTML =
  'רשת ישיבות בני עקיבא · הדף השבועי · תשפ״ז';

/* ---------- המלל ----------
   שלוש השכבות — קוד, מה שפורסם, וטיוטה מקומית — מגיעות מ-
   textedit.js, שהוא המקור היחיד לכל העמודים.

   קודם היו כאן שתי קריאות `draw` נפרדות: אחת לטיוטה ואחת למה
   שחזר מהגיליון. השנייה גברה, ולכן הטיוטה של הרכז נמחקה מהמסך
   ברגע שהגיליון ענה — כלומר דווקא מה שהוא בדיוק ערך נעלם לו.
   עכשיו יש הרכבה אחת, ותמיד באותו סדר. */
var KEYS = ['hello','body','ask','gem','gemLine','gemNote',
            'chav','chavLine','chavNote','end'];
function draw() {
  var R = window.RIGHTS || {};
  KEYS.forEach(function (k) {
    var el = document.getElementById('t-' + k);
    if (el) el.innerHTML = R[k] || '';
  });
  document.getElementById('demo').textContent = R.btn || 'לצפייה';
}
function relayer() { TX.layer(TX.published(), TX.draft()); draw(); }
relayer();

TX.init({ repaint: draw, onStop: function () { location.href = './#admin'; } });

/* ומה שפורסם בגיליון — לכל מי שאינו הרכז. */
(function () {
  var id = window.SHEET_ID;
  try {
    var c2 = JSON.parse(localStorage.getItem('df:cfg') || '{}');
    if (c2.sheetId) id = c2.sheetId;
  } catch (e) {}
  if (!id || !navigator.onLine) return;
  fetch('https://docs.google.com/spreadsheets/d/' + id +
        '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent('טקסטים') +
        '&t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      var map = {}, rows = [], row = [], f = '', q = false;
      for (var i = 0; i < t.length; i++) {
        var ch = t[i];
        if (q) {
          if (ch === '"' && t[i+1] === '"') { f += '"'; i++; }
          else if (ch === '"') q = false; else f += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { row.push(f); f = ''; }
        else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
        else if (ch !== '\r') f += ch;
      }
      if (f || row.length) { row.push(f); rows.push(row); }
      if (!rows.length || rows[0].join('|').indexOf('מפתח') < 0) return;
      rows.slice(1).forEach(function (r2) {
        var k = (r2[0] || '').trim(), v = (r2[1] || '').trim();
        if (k && v) map[k] = v;
      });
      /* כל המפתחות ולא רק rights.* — המטמון משותף לכל העמודים,
         וסינון כאן היה מייצר עוד גרסה חלקית של אותה אמת. */
      try { localStorage.setItem('df:textCache', JSON.stringify(map)); } catch (e) {}
      relayer();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
