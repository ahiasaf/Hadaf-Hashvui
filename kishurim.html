<!-- ============================================================
     התצוגה המקדימה בוואטסאפ — התמונה, הכותרת והשורה.
     ============================================================
     "כשאני שולח הודעה עם הלוגו של הדף השבועי זה נראה הרבה
     יותר מקצועי ותופס את תשומת הלב."

     וואטסאפ אינו מריץ את הקוד של העמוד — הוא קורא את התגיות
     האלה בלבד. בלעדיהן כל קישור שיצא מהתוכנית הופיע כשורת
     כתובת אפורה. עם `og:image` הוא מופיע ככרטיס עם הסמל,
     בכל הודעה ובכל קבוצה, **בלי שום צעד נוסף למי ששולח.**

     ולכן הנוסח כאן ב-HTML ולא ב-data.js, בניגוד לכל מלל אחר
     בתוכנית: הסורק של וואטסאפ אינו מגיע לשום דבר שנטען אחר
     כך. זה החריג היחיד לכלל, והוא כפוי.

     הכתובת מוחלטת בכוונה — סורק שמקבל נתיב יחסי מדלג עליו.
     `tools/preflight.py` בודק שכל עמוד שנשלח נושא את הבלוק.
     ============================================================ -->

<!-- בלי manifest: זה עמוד שמעבירים הלאה, לא אפליקציה שמתקינים. -->
<style>
/* המסך לא זז לצדדים: לחיצה כפולה אקראית אינה מגדילה, ואלמנט שבורח
   מרוחב המסך אינו יוצר גלילה אופקית. צביטה מכוונת נשארת (נגישות). */
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
/* ============================================================
   הקישורים לישיבה · /kishurim
   ============================================================
   עמוד אחד שהרכז שולח לראש ישיבה "בלי מאמץ", והוא מעביר הלאה.
   שלושה קישורים, ולכל אחד כפתור וואטסאפ עם הודעה מוכנה:
   * ראש החטיבה ורכז התוכנית — המסע (`?masa=1`). שם בוחרים ישיבה
     ותפקיד, מתקינים, והלוח נפתח אחרי אישור הרכז.
   * הר"מים — עמוד הצוות ("רב ומחנך אהוב").
   * התלמידים — קישור ההצטרפות; ההורים — `?for=dad`. ההודעות שלהם הן
     הנוסחים שבניהול ← קישורים להפצה (ui.linkWa, ui.dadWa).

   **כללי, בלי ישיבה.** בחירת הישיבה קורית בתוך כל אחד מהקישורים,
   ולכן אותו עמוד נשלח לכל ראשי הישיבות כמו שהוא.
   המלל — KISHURIM ב-data.js, נערך בניהול ← מלל.
   ============================================================ */
:root{
  --blue:#17468F; --blue-d:#0B2550; --blue-l:#3574CE;
  --green:#6FA83B; --green-d:#467B1A;
  --gold:#C08F2B; --gold-l:#E5B854; --gold-t:#8C681F;
  --paper:#F6F1E6; --surface:#FFFDF8; --sunk:#EFE6D3;
  --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#5C687E;
  --rule:#E5DAC3; --rule-2:#EFE7D7;
  --r:16px;
  --sh-1:0 1px 2px rgba(37,29,12,.05), 0 2px 8px rgba(37,29,12,.05);
  --sh-2:0 2px 4px rgba(37,29,12,.06), 0 10px 26px rgba(37,29,12,.08);
}
*{box-sizing:border-box}
/* `display` שנקבע במחלקה גובר על `hidden` של הדפדפן, וכפתור
   שהוסתר בקוד נשאר על המסך. זה קרה כאן לכפתורי ההצצה. */
[hidden]{display:none !important}
img:not([src]){visibility:hidden}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:34rem;margin:0 auto;padding:0 18px 54px}

/* ---------- הראש ----------
   אותה חתימה שיש בכל מסך: הסמל בעיגול לבן, שם התוכנית והשנה. */
header{background:radial-gradient(120% 100% at 80% 0%,#2C63B6 0%,
    var(--blue) 38%,var(--blue-d) 82%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 26px) 18px 30px;
  text-align:center}
.masthead{display:flex;align-items:center;justify-content:center;gap:13px;
  margin-bottom:20px}
.masthead .m{width:54px;height:54px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.28)}
.masthead .m img{width:35px;height:35px;display:block;object-fit:contain}
.masthead .t{text-align:start}
.masthead b{display:block;font-size:1.14rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:#fff}
.masthead .yr{display:block;font-size:.74rem;font-weight:800;color:var(--gold-l);
  letter-spacing:.05em;margin-top:3px}
header .eyebrow{font-size:.73rem;font-weight:800;letter-spacing:.09em;
  color:var(--gold-l);margin-bottom:13px;min-height:1px}
header h1{margin:0;font-size:1.52rem;font-weight:800;line-height:1.25;
  letter-spacing:-.035em;max-width:22rem;margin-inline:auto}
header .lead{margin:12px auto 0;font-size:.94rem;font-weight:600;
  color:rgba(255,255,255,.82);line-height:1.7;max-width:24rem}

/* ---------- שלושת הכרטיסים ---------- */
.card{background:var(--surface);border:1px solid var(--rule);
  border-radius:var(--r);box-shadow:var(--sh-2);padding:19px 18px;margin-top:16px}
.card:first-child{margin-top:-14px}
.card h2{margin:0;font-size:1.08rem;font-weight:800;letter-spacing:-.03em;color:var(--blue-d)}
.sub{margin:7px 0 0;font-size:.88rem;font-weight:600;color:var(--ink-3);line-height:1.6}
.go{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:13px;
  text-decoration:none;font-size:1rem;font-weight:800;color:#fff;border-radius:13px;padding:14px 12px;
  background:linear-gradient(150deg,#2FB457,#1E8C40);box-shadow:var(--sh-1)}
.go svg{width:22px;height:22px;fill:#fff;flex:none}
.cp{display:block;width:100%;margin-top:8px;font:inherit;font-size:.86rem;font-weight:800;color:var(--blue);
  background:none;border:1px solid var(--rule);border-radius:11px;padding:9px;cursor:pointer}
footer{text-align:center;color:var(--ink-3);font-size:.8rem;font-weight:600;
  margin-top:26px;line-height:1.9}
footer a{color:var(--ink-2)}
</style>
</head>
<body>

<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div class="t"><b>הדף השבועי<br>של ישיבות בני עקיבא</b>
      <span class="yr">שנת תשפ״ז</span></div>
  </div>
  <h1 id="t-h1"></h1>
  <p class="lead" id="t-lead"></p>
</header>

<main class="wrap" id="cards"></main>

<footer class="wrap">
  רשת ישיבות בני עקיבא · הדף השבועי · תשפ״ז<br>
  <a href="accessibility.html">הצהרת נגישות</a>
</footer>

<script src="a11y.js"></script>
<script src="data.js"></script>
<script src="textedit.js"></script>
<script src="logo.js"></script>
<script>
function $(i) { return document.getElementById(i); }
$('hdr-mark').src = window.LOGO_MARK || '';
function fill(t, m) {
  return String(t == null ? '' : t).replace(/\{([^}]+)\}/g, function (_, k) { return m[k] == null ? '' : m[k]; });
}
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
/* הבסיס של האתר — שתי הצורות, עם .html ובלי (cleanUrls בייצור). */
function base() {
  return location.href.split('#')[0].split('?')[0].replace(/kishurim(\.html)?$/, '');
}
var WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.6 2.1 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>';
function draw() {
  var K = window.KISHURIM || {}, b = base();
  var U = window.UI || {};
  /* [מפתח, כתובת, ההודעה]. לתלמידים ולהורים — הנוסחים שבניהול ←
     קישורים להפצה, כמו שהם. */
  var links = [
    ['head', b + '?masa=1', K.headWa],
    ['rm',   b + 'tzevet.html', K.rmWa],
    ['kids', b + 'join.html', fill(U.linkWa, { inst: K.kidsInst || '', url: '{קישור}' })],
    ['par',  b + 'join.html?for=dad', fill(U.dadWa, { url: '{קישור}' })]
  ];
  $('t-h1').textContent = K.h1 || '';
  $('t-lead').textContent = K.lead || '';
  document.title = (K.h1 || '') + ' · הדף השבועי של בני עקיבא';
  $('cards').innerHTML = links.map(function (l) {
    var k = l[0], url = l[1], msg = fill(l[2], { 'קישור': url });
    return '<section class="card"><h2>' + esc(K[k + 'H']) + '</h2>' +
      '<p class="sub">' + esc(K[k + 'Sub']) + '</p>' +
      '<a class="go" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">' +
      WA + esc(K[k + 'Btn']) + '</a>' +
      '<button class="cp" data-url="' + esc(url) + '">' + esc(K.copy) + '</button></section>';
  }).join('');
}
$('cards').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.cp') : null;
  if (!b) return;
  var u = b.getAttribute('data-url'), K = window.KISHURIM || {};
  var ok = function () { b.textContent = K.copied || '✓'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(ok, function () {});
});

function relayer() { TX.layer(TX.published(), TX.draft()); draw(); }
relayer();
TX.init({ repaint: draw, onStop: function () { location.href = './#admin'; } });
/* ---------- ומה שפורסם בגיליון ---------- */
(function () {
  var id = window.SHEET_ID;
  try {
    var c = JSON.parse(localStorage.getItem('df:cfg') || '{}');
    if (c.sheetId) id = c.sheetId;
  } catch (e) {}
  if (!id || !navigator.onLine) return;
  fetch('https://docs.google.com/spreadsheets/d/' + id +
        '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent('טקסטים') +
        '&t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      var map = {}, rows = [], row = [], f = '', q = false;
      for (var i = 0; i < t.length; i++) {
        var ch = t[i];
        if (q) {
          if (ch === '"' && t[i+1] === '"') { f += '"'; i++; }
          else if (ch === '"') q = false; else f += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { row.push(f); f = ''; }
        else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
        else if (ch !== '\r') f += ch;
      }
      if (f || row.length) { row.push(f); rows.push(row); }
      /* כותרת שאינה מוכרת = לא הלשונית שביקשנו. לא נוגעים. */
      if (!rows.length || rows[0].join('|').indexOf('מפתח') < 0) return;
      rows.slice(1).forEach(function (r2) {
        var k = (r2[0] || '').trim(), v = (r2[1] || '').trim();
        if (k && v) map[k] = v;
      });
      try { localStorage.setItem('df:textCache', JSON.stringify(map)); } catch (e) {}
      relayer();
    })
    .catch(function () {});
})();
</script>
</body>
