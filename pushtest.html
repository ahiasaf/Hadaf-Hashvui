<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B2550">
<!-- בלי השורות האלה אין מה לבדוק באייפון: התראות שם עובדות רק
     ממסך הבית, ו"הוספה למסך הבית" בלי `apple-mobile-web-app-capable`
     יוצרת קיצור שנפתח בספארי — כלומר בדיוק המצב שאין בו התראות. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הדף השבועי">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>הדף השבועי — בדיקה קצרה</title>
<!-- ============================================================
     עמוד לאנשים, לא לוח מחוונים.
     ============================================================
     הגרסה הקודמת הייתה כלי אבחון שנכתב עבור מי שבנה אותו:
     טבלת יכולות, הודעות שגיאה באנגלית, וארבעה קטעים במקביל.
     היא נמסרה לאדם אמיתי והוא ענה "אם אתה רוצה שזה יתפוס אתה
     צריך לרשום שם הסברים". הוא צדק, והוא עוד **טרח** — תלמיד
     או ר"ם עסוק פשוט סוגר.

     מה שהשתנה:
       · **שלב אחד על המסך בכל רגע.** מה שנגמר מתכווץ לשורה,
         ומה שעוד לא הגיע אינו מוצג כלל. שלושה קטעים פתוחים
         יחד הם שלוש החלטות, ואדם שלא ביקש להחליט — עוזב.
       · **קודם למה, אחר כך מה.** מי שקיבל קישור בוואטסאפ אינו
         יודע מה זה, ולא ילחץ על "אישור התראות" לפני שיֵדע.
       · **מה שמפחיד נאמר מראש** — מה ייווסף לטלפון, כמה
         התראות יגיעו, ואיך מוחקים. חשד שלא נענה הוא חשד שגדל.
       · האבחון לא נמחק — הוא ירד לתחתית, מקופל, בשביל מי
         שמתחזק. משתמש אינו צריך לדעת מה זה `fcm.googleapis.com`.
     ============================================================ -->
<style>
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold:#C08F2B;
  --paper:#F6F1E6; --surface:#FFFDF8; --ink:#1B2A45; --ink-2:#5A6780;
  --ink-3:#5C687E; --rule:#E5DAC3; --ok:#3A7B56; --sunk:#EFEAdD;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 18px 70px}
.wrap{max-width:520px;margin-inline:auto}

/* ---------- הפתיחה ---------- */
header{margin:0 -18px 0;background:var(--blue-d);color:#fff;
  padding:30px 22px 34px;text-align:center}
header .mark{width:62px;height:62px;border-radius:16px;margin:0 auto 14px;
  display:block;box-shadow:0 6px 18px rgba(0,0,0,.3)}
header h1{margin:0;font-size:1.32rem;font-weight:800;letter-spacing:-.02em}
header p{margin:10px 0 0;font-size:.95rem;opacity:.9;line-height:1.65}

/* ---------- מד ההתקדמות ---------- */
.prog{display:flex;align-items:center;justify-content:center;gap:7px;
  margin:0 -18px 22px;background:var(--blue-d);padding:0 0 22px}
.prog i{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.prog i.on{background:var(--gold)}
.prog i.did{background:#8FC79E}

/* ---------- שלב ---------- */
.step{background:var(--surface);border:1px solid var(--rule);
  border-radius:16px;padding:24px 22px 26px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(11,37,80,.07)}
.step.now{border:2px solid var(--gold);box-shadow:0 8px 26px rgba(11,37,80,.12)}
.step .kick{font-size:.78rem;font-weight:800;color:var(--gold);
  letter-spacing:.04em;margin-bottom:7px}
.step h2{margin:0;font-size:1.16rem;font-weight:800;letter-spacing:-.02em;
  line-height:1.45}
.step p{margin:11px 0 0;font-size:.95rem;color:var(--ink-2);line-height:1.75}
.step .btn{display:block;width:100%;margin-top:20px;padding:16px;
  border:0;border-radius:12px;background:var(--blue);color:#fff;
  font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer}
.step .btn.g{background:var(--ok)}
.step .btn.thin{background:none;color:var(--ink-2);font-size:.9rem;
  padding:12px;margin-top:6px;text-decoration:underline}

/* שלב שנגמר — שורה אחת, לא כרטיס */
.done-row{display:flex;align-items:center;gap:10px;padding:13px 18px;
  margin-bottom:10px;background:rgba(58,123,87,.09);
  border:1px solid rgba(58,123,87,.28);border-radius:12px;
  font-size:.92rem;font-weight:700;color:#2C6446}
.done-row b{font-size:1.05rem}

/* הוראות ההתקנה */
ol.how{margin:20px 0 0;padding-inline-start:0;list-style:none;counter-reset:s}
ol.how li{counter-increment:s;position:relative;padding-inline-start:38px;
  margin-bottom:16px;font-size:.97rem;line-height:1.8}
ol.how li:last-child{margin-bottom:0}
ol.how li::before{content:counter(s);position:absolute;inset-inline-start:0;top:3px;
  width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:.82rem;font-weight:800;display:flex;align-items:center;
  justify-content:center}
.gl{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:8px;background:var(--sunk);
  border:1px solid var(--rule);vertical-align:-9px;margin:0 4px}
.gl svg{width:17px;height:17px;fill:none;stroke:var(--blue);
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* מה ייכנס לטלפון — נאמר מראש */
.calm{margin-top:20px;background:var(--sunk);border-radius:12px;
  padding:15px 17px;font-size:.88rem;line-height:1.8;color:var(--ink-2)}
.calm b{color:var(--ink)}

input[type=text]{width:100%;padding:15px;font:inherit;font-weight:700;
  font-size:1.02rem;border:1.5px solid var(--rule);border-radius:12px;
  background:#fff;margin-top:16px}

.oops{margin-top:16px;background:#F7E4E2;border:1px solid #E2BDB8;
  border-radius:12px;padding:14px 16px;font-size:.9rem;font-weight:700;
  color:#7E2C23;line-height:1.7}

/* ---------- הסיום ---------- */
.fin{text-align:center;padding:34px 22px 30px}
.fin .v{width:64px;height:64px;border-radius:50%;background:var(--ok);
  color:#fff;font-size:2rem;line-height:64px;margin:0 auto 16px;
  font-weight:800}
.fin h2{margin:0;font-size:1.3rem;font-weight:800}
.fin p{margin:12px 0 0;font-size:.98rem;color:var(--ink-2);line-height:1.75}

/* ---------- האבחון, למי שמתחזק ---------- */
details.diag{margin-top:26px;font-size:.8rem;color:var(--ink-3)}
details.diag summary{cursor:pointer;color:var(--ink-2);font-weight:700;
  padding:8px 0}
details.diag .box{background:var(--surface);border:1px solid var(--rule);
  border-radius:10px;padding:12px 14px;margin-top:6px;line-height:1.75;
  direction:ltr;text-align:left;word-break:break-word;font-size:.76rem}
details.diag .box b{direction:rtl;display:block;text-align:right;
  color:var(--ink);margin-bottom:4px}
textarea{width:100%;height:110px;margin-top:10px;font-size:.7rem;
  direction:ltr;border:1px solid var(--rule);border-radius:8px;padding:8px}
</style>
</head>
<body>

<header>
  <img class="mark" src="icon-192.png" alt="">
  <h1>הדף השבועי</h1>
  <!-- מי שקיבל קישור בוואטסאפ אינו יודע מה זה. השורה הזו
       אומרת מה בודקים, כמה זמן, ומה יקרה בסוף — לפני שמבקשים
       ממנו דבר. -->
  <p id="lede">בודקים אם הטלפון שלך יכול לקבל תזכורת מהאפליקציה.
    דקה אחת, ואז תגיע התראה אחת.</p>
</header>
<div class="prog"><i id="p1"></i><i id="p2"></i><i id="p3"></i></div>

<div class="wrap">
  <div id="flow"></div>

  <details class="diag">
    <summary>פרטים טכניים (לא צריך לפתוח)</summary>
    <div class="box" id="diag-box"></div>
  </details>
</div>

<script src="data.js"></script>
<script>
/* ES5 בלבד — כמו כל הפרויקט. */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var VAPID = 'BJ7oHIPuCdvARkdolXpxYXtnm43UNUOgiUNrf2FBA-QD8L_utJaYPKc5hr1NEYnbbdNVYqY5UxdX7lg-i_wIELw';

function b64ToU8(s) {
  var pad = '='.repeat((4 - s.length % 4) % 4);
  var raw = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
  var out = new Uint8Array(raw.length), i;
  for (i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function home() {
  try {
    if (navigator.standalone) return true;
    return !!(window.matchMedia &&
      window.matchMedia('(display-mode: standalone)').matches);
  } catch (e) { return false; }
}
function canNote() { return typeof window.Notification !== 'undefined'; }
function perm()    { return canNote() ? Notification.permission : 'default'; }

/* אנדרואיד מציע התקנה בעצמו; שומרים את ההצעה לכפתור. */
var BIP = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); BIP = e;
  /* ההצעה מגיעה באיחור של רגע אחרי טעינת העמוד. אם אנחנו עוד
     בשלב ההתקנה — מחליפים את ההוראות הידניות בכפתור אמיתי. */
  if (STEP === 1) draw();
});
/* הדפדפן מדווח שהתקין — וזה מה שמקדם את השלב. באנדרואיד אין
   טעם לדרוש שיסגור ויפתח מחדש: המנוי שייך לאתר, לא לחלון. */
window.addEventListener('appinstalled', function () {
  BIP = null;
  try { localStorage.setItem('pt:inst', '1'); } catch (e) {}
  go(2);
});

/* RES — איך נגמר: 'ok' נרשם, 'blocked' דיווח שההתראות חסומות.
   שניהם סיום, ורק אחד מהם הצלחה. */
var STEP = 1, SUB = null, ERR = '', RES = '', RSN = '', DONE = false;
try { RES = localStorage.getItem('pt:done') || ''; } catch (e) {}
if (RES === '1') RES = 'ok';          /* מי שסיים בגרסה הקודמת */
DONE = !!RES;

/* ---------- באיזה שלב אנחנו ----------
   **ההתקנה היא שלב, ואין סביבה דרך.** לרגע ויתרתי עליה
   באנדרואיד — ההוראות שלי לא התאימו לשיאומי, והסקתי שנוריד
   את השלב. זו הייתה המסקנה ההפוכה: ההוראות היו צריכות תיקון,
   לא השלב מחיקה.

   ומעבר לזה, מסלול "בלי התקנה" אינו אפשרות שנייה — הוא
   האפשרות שכולם יבחרו, כי היא הנוחה יותר. התוצאה היא תוכנית
   בלי אפליקציה על אף טלפון.

   יש דלת למי שבאמת נתקע, אבל היא **מסיימת בדיווח** ולא
   ממשיכה בלי התקנה. קיצור דרך שמגיע לאותו מקום הוא קיצור
   דרך שכולם ילכו בו. */
function installed() {
  if (home()) return true;
  /* באייפון אין תחליף: הדפדפן שם פשוט אינו יודע לקבל התראות.
     באנדרואיד הדפדפן מדווח שהתקין, וזה מספיק. */
  if (IOS) return false;
  try { return localStorage.getItem('pt:inst') === '1'; } catch (e) { return false; }
}
function where() {
  if (DONE) return 4;
  if (!installed()) return 1;
  if (perm() !== 'granted') return 2;
  return 3;
}
function total() { return 3; }
function kick(n) {
  return '<div class="kick">שלב ' + n + ' מתוך ' + total() + '</div>';
}
function go(n) { STEP = n; draw(); }

/* ---------- ציור ---------- */
var SHARE = '<span class="gl"><svg viewBox="0 0 24 24">' +
  '<path d="M12 3v12"/><path d="M8 7l4-4 4 4"/>' +
  '<path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></svg></span>';
/* שלוש נקודות שוכבות — התפריט בספארי החדש; ושלוש עומדות —
   התפריט של כרום באנדרואיד. אלה שני כפתורים שונים לגמרי,
   ואדם שמחפש את הלא-נכון לא ימצא כלום. */
var DOTS_H = '<span class="gl"><svg viewBox="0 0 24 24">' +
  '<circle cx="5" cy="12" r="1.6" fill="#17468F" stroke="none"/>' +
  '<circle cx="12" cy="12" r="1.6" fill="#17468F" stroke="none"/>' +
  '<circle cx="19" cy="12" r="1.6" fill="#17468F" stroke="none"/></svg></span>';
var DOTS_V = '<span class="gl"><svg viewBox="0 0 24 24">' +
  '<circle cx="12" cy="5" r="1.6" fill="#17468F" stroke="none"/>' +
  '<circle cx="12" cy="12" r="1.6" fill="#17468F" stroke="none"/>' +
  '<circle cx="12" cy="19" r="1.6" fill="#17468F" stroke="none"/></svg></span>';

/* הסמל שליד הכתובת בראש הדפדפן. אי אפשר לכתוב "לחצו על הסמל"
   ולקוות שיזוהה — מציירים אותו, וכך העין מוצאת אותו על המסך. */
var TUNE = '<span class="gl"><svg viewBox="0 0 24 24">' +
  '<path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/>' +
  '<path d="M4 17h6"/><path d="M14 17h6"/><circle cx="12" cy="17" r="2"/>' +
  '</svg></span>';

function row(txt) {
  return '<div class="done-row"><b>✓</b><span>' + esc(txt) + '</span></div>';
}

function draw() {
  var f = $('flow'), h = '';
  STEP = (STEP === 4 || DONE) ? 4 : Math.max(STEP, where());

  /* המד סופר את השלבים שיש במסלול הזה, ולא שלושה תמיד: נקודה
     שלישית שלעולם לא תידלק אומרת לאנדרואיד שנשאר לו עוד משהו. */
  /* הדיווח יושב על השלב שממנו הגיע — הוא אינו התקדמות. */
  var m = (STEP === 5) ? (RSN === 'התקנה' ? 1 : 2) : STEP;
  ['p1','p2','p3'].forEach(function (id, i) {
    $(id).className = (STEP === 4 && RES === 'ok') ? 'did'
      : (i + 1 < m ? 'did' : (i + 1 === m ? 'on' : ''));
  });
  $('lede').textContent = STEP !== 4
    ? 'בודקים אם הטלפון שלך יכול לקבל תזכורת מהאפליקציה. ' +
      'דקה אחת, ואז תגיע התראה אחת.'
    : (RES === 'blocked' ? 'קיבלנו את הדיווח. תודה רבה.'
                         : 'זהו, סיימת. תודה רבה.');

  /* מה שנגמר מתכווץ לשורה. הוא אינו נעלם, כדי שיהיה ברור
     שהתקדמנו — אבל הוא גם אינו תופס מקום של כרטיס. */
  if (STEP > 1 && STEP !== 5) h += row('האפליקציה על מסך הבית');
  if (STEP === 5 && RSN !== 'התקנה') h += row('האפליקציה על מסך הבית');
  if (STEP === 3 || (STEP === 4 && RES === 'ok')) h += row('ההתראות אושרו');

  if (STEP === 1)      h += stepInstall();
  else if (STEP === 2) h += (perm() === 'denied' ? stepBlocked() : stepPerm());
  else if (STEP === 3) h += stepName();
  else if (STEP === 5) h += stepReport();
  else                 h += stepDone();

  f.innerHTML = h;
  wire();
  diag();
}

/* ---------- שלב 1: ההתקנה ----------
   **קודם למה, אחר כך איך — ושום "ככה זה בנוי".** המשפט הפותח
   הקודם הסביר מגבלה של אפל. לתלמיד לא אכפת מאפל; הוא רוצה
   לדעת למה כדאי לו. ההסבר הטכני ירד לפרטים למטה, ובמקומו
   שורה אחת על מה הוא מקבל.

   **ולכל דפדפן המסלול שלו.** בספארי החדש כפתור השיתוף כבר
   אינו על הסרגל — צריך קודם שלוש נקודות שוכבות. בכרום
   באנדרואיד יש כפתור התקנה אמיתי, וכשאין — תפריט שלוש נקודות
   עומדות. אלה שלושה מסלולים שונים, וכולם בשוק עכשיו. */
function stepInstall() {
  var h = '<div class="step now">' + kick(1) +
    '<h2>להוסיף את הדף השבועי למסך הבית</h2>' +
    '<p>משם נדע להודיע לך כשיש דף חדש — ואם זכית בהגרלה.</p>';

  if (IOS) {
    h += '<ol class="how">' +
      '<li>לחצו על כפתור השיתוף ' + SHARE + ' שבתחתית המסך.<br>' +
        '<b>לא רואים אותו?</b> לחצו קודם על שלוש הנקודות ' + DOTS_H +
        ' שבפינה, ואז על "שיתוף".</li>' +
      '<li>גללו למטה ובחרו <b>"הוספה למסך הבית"</b>, ואז "הוסף".</li>' +
      '<li>סגרו את הדפדפן ו<b>פתחו את האייקון החדש</b> שנוסף למסך ' +
        'הבית. משם נמשיך לבד.</li></ol>';
  } else if (BIP) {
    /* כרום מציע להתקין בעצמו — כפתור אחד, בלי לחפש בתפריט. */
    h += '<button class="btn" id="b-inst">התקנת האפליקציה</button>' +
      '<p style="font-size:.88rem">ייפתח חלון של הטלפון — לוחצים ' +
      '"התקן". לוקח שנייה.</p>';
  } else {
    h += '<ol class="how">' +
      '<li>לחצו על שלוש הנקודות ' + DOTS_V + ' בפינת הדפדפן.</li>' +
      '<li>בחרו <b>"התקנת אפליקציה"</b> — או, אם אין כזה, ' +
        '<b>"הוספה למסך הבית"</b>.<br>' +
        '<span style="font-size:.9rem">בדפדפן של סמסונג זה ' +
        '"הוספת דף אל" ואז "מסך הבית".</span></li>' +
      '<li><b>פתחו את האייקון החדש</b> שנוסף למסך הבית. ' +
        'משם נמשיך לבד.</li></ol>';
  }

  return h + calm() +
    '<button class="btn thin" id="b-nope">' +
      'לא מוצא את זה במכשיר שלי — לדווח ולסיים</button>' +
    (ERR ? '<div class="oops">' + esc(ERR) + '</div>' : '') +
    '</div>';
}

/* מה שמפחיד, נאמר לפני שמבקשים. חשד שלא נענה הוא חשד שגדל. */
function calm() {
  return '<div class="calm"><b>מה זה עושה לטלפון?</b><br>' +
    'מוסיף אייקון למסך הבית — כמו קיצור דרך. לא תופס מקום ולא ' +
    'רואה שום דבר במכשיר, ואפשר למחוק אותו בלחיצה ארוכה.<br>' +
    '<b>כמה הודעות יגיעו?</b> אחת, לבדיקה.' +
    (IOS ? '<br><b>למה דווקא ממסך הבית?</b> באייפון התראות ' +
           'עובדות רק ככה. זו מגבלה של אפל, ואין מה לעשות בקוד.' : '') +
    '</div>';
}

/* ---------- שלב 2 ---------- */
function stepPerm() {
  var h = '<div class="step now">' + kick(2) +
    '<h2>לאשר קבלת התראות</h2>' +
    '<p>הטלפון ישאל אתכם — צריך לאשר. בלי זה אי אפשר לשלוח ' +
    'כלום, וזו כל הבדיקה.</p>' +
    '<button class="btn" id="b-perm">מאשר לקבל התראות</button>';
  if (ERR) h += '<div class="oops">' + esc(ERR) + '</div>';
  return h + '</div>';
}

/* ---------- שלב 2, כשהדלת נעולה ----------
   הגרסה הקודמת הציגה כאן ריבוע אדום ותו לא, והבודקת הראשונה
   כתבה "נתקעתי פה". קיר בלי דלת. אין שום דבר שהקוד יכול
   לעשות — דפדפן שנדחה פעם אחת לא ישאל שוב, וגם לחיצה על
   "מאשר" לא תעשה כלום — ולכן מה שנשאר הוא שני דברים, ושניהם
   חייבים להיות כאן: **דרך אמיתית לפתוח**, ו**דרך לצאת בכבוד**.

   הדיווח אינו כפתור נימוס. תלמיד שהטלפון שלו חוסם הוא בדיוק
   מה שצריך לדעת לפני שמסתמכים על התראות — ושתיקה אינה נתון. */
function stepBlocked() {
  /* **לכל מכשיר המסלול שלו.** הוראות אנדרואיד לאייפון הן בדיוק
     אותה תקלה שהפילה את שיאומי, רק הפוך. */
  var how = IOS
    ? '<li>פתחו את <b>הגדרות</b> במכשיר (גלגל השיניים האפור).</li>' +
      '<li>גללו עד <b>"הדף השבועי"</b> ברשימת האפליקציות, ולחצו.</li>' +
      '<li>בחרו <b>"התראות"</b> והדליקו <b>"אפשר התראות"</b> — ' +
        'ואז חזרו לכאן.</li>'
    : '<li>בראש המסך, <b>ליד כתובת האתר</b>, יש סמל קטן ' + TUNE +
        ' (במכשירים מסוימים זה סמל מנעול). לחצו עליו.</li>' +
      '<li>בחרו <b>"הרשאות"</b> ואז <b>"התראות"</b>.</li>' +
      '<li>העבירו למצב <b>"אפשר"</b> — וחזרו לכאן.</li>';
  var lost = IOS
    ? '<b>לא מוצאים את האפליקציה ברשימה?</b><br>' +
      'אפשר גם דרך <b>הגדרות ← התראות</b>, ולחפש שם את ' +
      '"הדף השבועי".'
    : '<b>לא מוצאים את הסמל?</b><br>' +
      'בשיאומי, בסמסונג ובחלק מהמכשירים ההתראות חסומות לדפדפן ' +
      'עצמו: <b>הגדרות ← אפליקציות ← הדפדפן ← התראות ← אפשר</b>.';
  return '<div class="step now">' + kick(2) +
    '<h2>הטלפון חוסם התראות מהאתר הזה</h2>' +
    '<p>זה לא משהו שנשבר — זו הגדרה שנקבעה פעם אחת במכשיר, ' +
    'ורק מתוך ההגדרות אפשר לבטל אותה. שתי דקות, ואז חוזרים לכאן.</p>' +
    '<ol class="how">' + how + '</ol>' +
    '<button class="btn" id="b-again">שיניתי — בדקו שוב</button>' +
    '<div class="calm">' + lost +
    '<br><b>וגם אם לא הצלחתם — זה בסדר גמור.</b> הכפתור למטה ' +
    'מדווח על זה, וזו תשובה מועילה בדיוק כמו הצלחה.</div>' +
    '<button class="btn thin" id="b-report">' +
      'לא הצלחתי — לדווח על זה ולסיים</button>' +
    (ERR ? '<div class="oops">' + esc(ERR) + '</div>' : '') +
    '</div>';
}

/* ---------- הדיווח ---------- */
function stepReport() {
  return '<div class="step now">' + kick(RSN === 'התקנה' ? 1 : 2) +
    '<h2>תודה שטרחתם</h2>' +
    '<p>' + (RSN === 'התקנה'
      ? 'נרשום שבמכשיר הזה לא הצלחנו להתקין.'
      : 'נרשום שבמכשיר הזה ההתראות חסומות.') +
    ' רק שנדע מי — שם פרטי מספיק.</p>' +
    '<input type="text" id="who" placeholder="לדוגמה: מאיר">' +
    '<button class="btn g" id="b-send">שליחת הדיווח</button>' +
    '<button class="btn thin" id="b-back">רגע, אנסה שוב</button>' +
    (ERR ? '<div class="oops">' + esc(ERR) + '</div>' : '') +
    '</div>';
}

/* ---------- שלב 3 ---------- */
function stepName() {
  return '<div class="step now">' + kick(3) +
    '<h2>איך לקרוא לך?</h2>' +
    '<p>רק כדי שנדע למי הגיעה ההתראה. שם פרטי מספיק.</p>' +
    '<input type="text" id="who" placeholder="לדוגמה: מאיר">' +
    '<button class="btn g" id="b-fin">סיימתי — אפשר לשלוח לי</button>' +
    (ERR ? '<div class="oops">' + esc(ERR) + '</div>' : '') +
    '</div>';
}

/* ---------- הסיום ---------- */
function stepDone() {
  if (RES === 'blocked') {
    return '<div class="step fin"><div class="v">✓</div>' +
      '<h2>הדיווח נשלח</h2>' +
      '<p>לא תגיע התראה למכשיר הזה, וזה בסדר — עכשיו אנחנו ' +
      'יודעים את זה.<br><b>אפשר לסגור את המסך.</b></p>' +
      '<button class="btn thin" id="b-again">' +
        'פתחתי את ההתראות בינתיים — לנסות שוב</button></div>';
  }
  return '<div class="step fin"><div class="v">✓</div>' +
    '<h2>הכול מוכן</h2>' +
    '<p>אין עוד מה לעשות. תוך זמן קצר תגיע התראה אחת — ' +
    'גם כשהטלפון נעול ובכיס.<br><b>אפשר לסגור את המסך.</b></p>' +
    '<button class="btn thin" id="b-raw">משהו לא עבד? לחצו כאן</button>' +
    '<div id="raw"></div></div>';
}

/* ---------- חיווט ---------- */
function wire() {
  var b;
  if ((b = $('b-inst'))) b.onclick = function () {
    var p = BIP; if (!p) return;
    p.prompt();
    /* **מי שביטל אינו מאבד את הכפתור.** איפוס BIP מיד היה מחליף
       את הכפתור בהוראות תפריט ידניות — עונש על היסוס. */
    var back = function (c) {
      if (c && c.outcome === 'accepted') BIP = null;
      draw();
    };
    if (p.userChoice && p.userChoice.then) p.userChoice.then(back)['catch'](back);
    else back();
  };
  if ((b = $('b-perm')))   b.onclick = askPerm;
  if ((b = $('b-fin')))    b.onclick = finish;
  if ((b = $('b-raw')))    b.onclick = showRaw;
  if ((b = $('b-nope')))   b.onclick = function () {
    ERR = ''; RSN = 'התקנה'; go(5);
  };
  if ((b = $('b-report'))) b.onclick = function () {
    ERR = ''; RSN = 'חסימה'; go(5);
  };
  if ((b = $('b-back')))   b.onclick = function () {
    ERR = ''; go(RSN === 'התקנה' ? 1 : 2);
  };
  if ((b = $('b-send')))   b.onclick = report;
  /* "בדקו שוב" — טעינה מחדש ולא ציור מחדש: הרשאה שהשתנתה
     בהגדרות הדפדפן אינה מתעדכנת בעמוד שכבר פתוח. */
  if ((b = $('b-again')))  b.onclick = function () {
    try { localStorage.removeItem('pt:done'); } catch (e) {}
    location.reload();
  };
}

/* ---------- אישור ---------- */
function askPerm() {
  ERR = '';
  var b = $('b-perm'); if (b) { b.disabled = true; b.textContent = 'רגע…'; }
  var after = function (p) {
    if (p === 'granted') { go(3); return; }
    ERR = (p === 'denied')
      ? 'האישור נדחה. בלי אישור אי אפשר לשלוח התראה.'
      : 'לא התקבל אישור. אפשר לנסות שוב.';
    draw();
  };
  try {
    var pr = Notification.requestPermission(after);
    if (pr && pr.then) pr.then(after)['catch'](function () { after('default'); });
  } catch (e) { ERR = 'לא ניתן לבקש אישור כאן.'; draw(); }
}

/* ---------- הרשמה ---------- */
function worker() {
  if (!('serviceWorker' in navigator)) return Promise.reject(new Error('אין מנגנון רקע'));
  return navigator.serviceWorker.register('sw.js')
    .then(function () { return navigator.serviceWorker.ready; });
}
/* מנוי שנוצר עם מפתח ישן נראה תקין אבל דחיפה שלנו לא תגיע
   אליו — הוא נזרק ונוצר מחדש. */
function sameKey(s) {
  try {
    var k = s.options && s.options.applicationServerKey;
    if (!k) return false;
    var a = new Uint8Array(k), b = b64ToU8(VAPID), i;
    if (a.length !== b.length) return false;
    for (i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  } catch (e) { return false; }
}
/* אותה הכרעת כתובת של שאר האפליקציה: מה שנקבע במכשיר גובר. */
function apiUrl() {
  var a = '';
  try { a = localStorage.getItem('dfApi') || ''; } catch (e) {}
  if (!a && typeof APPS_SCRIPT_URL !== 'undefined') a = APPS_SCRIPT_URL;
  return String(a || '').trim();
}

/* שתי התוצאות נכתבות לאותה לשונית ובאותה צורה — מי שנרשם עם
   מנוי, ומי שחסום בלי. השליחה `no-cors` ואטומה, ולכן שום מסך
   כאן אינו אומר "נרשמת": ההתראה עצמה היא האישור היחיד. */
function post(who, sub, res) {
  var url = apiUrl();
  if (!url) return Promise.reject(new Error('אין כתובת שרת'));
  return fetch(url, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'row', tab: 'התראות',
      cols: JSON.stringify([
        ['שם', who], ['מכשיר', IOS ? 'אייפון' : 'אנדרואיד'],
        ['מנוי', sub ? JSON.stringify(sub) : ''],
        ['תוצאה', res], ['מתי', new Date().toISOString()]
      ])
    })
  });
}
function saveRes(r) {
  RES = r; DONE = true;
  try { localStorage.setItem('pt:done', r); } catch (e) {}
  go(4);
}
function whoName() {
  return ($('who') && $('who').value || '').trim() || 'בלי שם';
}

/* הדיווח על חסימה. השורה נכתבת בלי מנוי, והשליחה מדלגת על
   שורות כאלה — אז היא נתון, לא נמען. */
function report() {
  ERR = '';
  var b = $('b-send'); if (b) { b.disabled = true; b.textContent = 'רגע…'; }
  post(whoName(), null,
       RSN === 'התקנה' ? 'לא הצליח להתקין' : 'חסום במכשיר').then(function () {
    saveRes('blocked');
  })['catch'](function (e) {
    ERR = 'לא הצלחתי לשלוח את הדיווח: ' + (e && e.message || e) +
          '. אפשר לנסות שוב, או לומר לאחיאסף.';
    draw();
  });
}

function finish() {
  ERR = '';
  var b = $('b-fin'); if (b) { b.disabled = true; b.textContent = 'רגע…'; }
  var who = whoName();
  worker().then(function (r) {
    var fresh = function () {
      return r.pushManager.subscribe({
        userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID)
      });
    };
    return r.pushManager.getSubscription().then(function (s) {
      if (!s) return fresh();
      if (sameKey(s)) return s;
      return s.unsubscribe().then(fresh, fresh);
    });
  }).then(function (s) {
    SUB = s;
    return post(who, s, 'נרשם');
  }).then(function () {
    saveRes('ok');
  })['catch'](function (e) {
    ERR = 'לא הצלחתי להשלים: ' + (e && e.message || e) +
          '. אפשר לנסות שוב, או לומר לאחיאסף.';
    draw();
  });
}

/* גיבוי, אם ההתראה לא הגיעה */
function showRaw() {
  var r = $('raw'); if (!r) return;
  if (!SUB) {
    r.innerHTML = '<div class="oops">אין מה להציג כאן. נסו לרענן ' +
      'ולעבור שוב על השלבים.</div>';
    return;
  }
  r.innerHTML = '<p style="margin-top:14px">שלחו לאחיאסף את הטקסט הזה:</p>' +
    '<textarea readonly>' + esc(JSON.stringify(SUB)) + '</textarea>';
  var t = r.querySelector('textarea');
  if (t) { t.focus(); t.select(); }
}

/* ---------- האבחון, מקופל ---------- */
function diag() {
  var e = $('diag-box'); if (!e) return;
  e.innerHTML =
    '<b>מכשיר</b>' + esc(IOS ? 'iOS' : 'Android/Desktop') +
    ' · standalone=' + home() +
    '<br>notifications=' + canNote() + ' · permission=' + perm() +
    '<br>push=' + ('PushManager' in window) +
    ' · sw=' + ('serviceWorker' in navigator) +
    '<br>step=' + STEP + ' · res=' + (RES || '-') +
    ' · rsn=' + (RSN || '-') + ' · inst=' + installed() + ' · bip=' + !!BIP +
    (SUB ? '<br>endpoint=' + esc(String(SUB.endpoint).slice(0, 60)) + '…' : '') +
    (ERR ? '<br>err=' + esc(ERR) : '');
}

draw();
</script>
</body>
</html>
