<title>הדף השבועי — הצטרפות</title>
<!-- הכתובת הזו הייתה ההצצה למסע בזמן שהוא נבנה. המסע הוא
     עכשיו הדרך עצמה ב-/join, והקובץ נשאר רק כדי שקישור
     שכבר נשלח לא ייפול. -->
<style>html,body{height:100%;margin:0;background:#0B2550}</style>
<script>
  (function () {
    var q = location.search.replace(/^\?/, '').replace(/(^|&)wiz=\d(&|$)/, '$1');
    location.replace('/join' + (q ? '?' + q : ''));
  })();
</script>
</head>
<body>
<noscript><a href="/join" style="color:#fff;font:16px system-ui;padding:20px;display:block">
  להצטרפות</a></noscript>
</body>
