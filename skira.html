     קוד, ולכן הנוסח כאן ב-HTML. -->

<meta name="robots" content="noindex">
<style>
/* ============================================================
   סקירת הישיבות — הקישור למנהלים (/skira?k=…).
   ============================================================
   אחיאסף מעביר את הקישור למנהלים מורשים, והם יכולים להעביר
   אותו הלאה ביניהם. מי שמחזיק בו רואה את הסקירה בלבד — שם,
   נרשמים, לומדים בפועל, רכז בשטח ומשפט סיכום — ויכול לעדכן
   לומדים בפועל ומשפט סיכום. אנשי קשר, טלפונים והיסטוריה אינם
   נשלחים לכאן בכלל: השרת אינו מחזיר אותם למפתח הזה (ov_).

   הרשימה עצמה — ov.js, אותו רכיב שבניהול ← ישיבות.
   ============================================================ */
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold-l:#E5B854; --gold-t:#8C681F;
  --paper:#F6F1E6; --surface:#FFFDF8; --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#5C687E;
  --rule:#E5DAC3;
}
*{box-sizing:border-box}
img:not([src]){visibility:hidden}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;
  -webkit-text-size-adjust:100%;padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}
header{background:radial-gradient(120% 100% at 80% 0%,#2C63B6 0%,var(--blue) 38%,var(--blue-d) 82%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 16px 26px;text-align:center}
.masthead{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:16px}
.masthead .m{width:54px;height:54px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.masthead .m img{width:35px;height:35px;display:block;object-fit:contain}
.masthead .t{text-align:start}
.masthead b{display:block;font-size:1.1rem;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.masthead .yr{display:block;font-size:.74rem;font-weight:800;color:var(--gold-l);letter-spacing:.05em;margin-top:3px}
header h1{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-.035em}
header .lead{margin:8px auto 0;font-size:.9rem;font-weight:600;color:rgba(255,255,255,.82);max-width:24rem}
.wrap{max-width:34rem;margin:0 auto;padding:16px 16px 0}
.empty{text-align:center;color:var(--ink-3);font-weight:700;font-size:.92rem;padding:30px 12px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;
  font-size:.76rem;font-weight:700;color:var(--ink-3)}
.foot button{font:inherit;font-weight:800;color:var(--blue);background:none;border:1px solid var(--rule);
  border-radius:10px;padding:5px 12px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div class="t"><b>הדף השבועי<br>של ישיבות בני עקיבא</b>
      <span class="yr">שנת תשפ״ז</span></div>
  </div>
  <h1 id="t-h1"></h1>
  <p class="lead" id="t-lead"></p>
</header>

<main class="wrap"><div id="list"></div><div class="foot" id="foot"></div></main>

<script src="a11y.js"></script>
<script src="data.js"></script>
<script src="textedit.js"></script>
<script src="logo.js"></script>
<script src="ov.js"></script>
<script>
function $(i) { return document.getElementById(i); }
$('hdr-mark').src = window.LOGO_MARK || '';
function T(k) { return (window.UI || {})[k] || ''; }
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
function qs(n) {
  var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
var API = window.APPS_SCRIPT_URL || '', KEY = qs('k');
var DATA = null, MSG = '';

function get(p) {
  var q = Object.keys(p).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(p[k]); }).join('&');
  return fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + q + '&t=' + Date.now())
    .then(function (r) { return r.json(); });
}
function rowsOf(d) {
  return (d.rows || []).map(function (r) { r.k = r.code || r.name; return r; });
}
function save(r, f, v) {
  return get({ ov:'set', key:KEY, code:r.code || '', name:r.name, f:f, v:v }).then(function (d) {
    if (!d || !d.ov) throw new Error(T('ovOld'));
    if (d.status !== 'ok') throw new Error(d.message || d.status);
    return d.row;
  });
}
function when(iso) {
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var z = function (x) { return (x < 10 ? '0' : '') + x; };
  return z(d.getHours()) + ':' + z(d.getMinutes());
}
function draw() {
  $('t-h1').textContent = T('ovTitle');
  $('t-lead').textContent = T('ovLead');
  if (!DATA) { $('list').innerHTML = '<div class="empty">' + esc(MSG || T('ovLoading')) + '</div>'; $('foot').innerHTML = ''; return; }
  OV.mount($('list'), { rows:DATA.rows, other:DATA.other, owner:false, save:save });
  $('foot').innerHTML = '<span>' + esc(DATA.at ? T('ovUpd').replace('{t}', when(DATA.at)) : '') + '</span>' +
    '<button onclick="load()">' + esc(T('ovRefresh')) + '</button>';
}
function load() {
  if (!API) { MSG = T('ovNet'); draw(); return; }
  if (!KEY) { MSG = T('ovNoKey'); draw(); return; }
  get({ ov:'get', key:KEY }).then(function (d) {
    if (!d || !d.ov) { MSG = T('ovOld'); DATA = null; }
    else if (d.status === 'denied') { MSG = T('ovBad'); DATA = null; }
    else if (d.status === 'nosheet') { MSG = T('ovNoSheet'); DATA = null; }
    else if (d.status !== 'ok') { MSG = d.message || T('ovNet'); }
    else { DATA = { rows:rowsOf(d), other:d.other || [], at:d.at }; MSG = ''; }
    draw();
  }).catch(function () { if (!DATA) MSG = T('ovNet'); draw(); });
}
function relayer() { TX.layer(TX.published(), TX.draft()); draw(); }
relayer();
load();
/* הנוסח שפורסם בניהול (לשונית "טקסטים") — כמו ב-kishurim.html. */
(function () {
  var id = window.SHEET_ID;
  if (!id || !navigator.onLine) return;
  fetch('https://docs.google.com/spreadsheets/d/' + id + '/gviz/tq?tqx=out:csv&sheet=' +
        encodeURIComponent('טקסטים') + '&t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      var map = {}, rows = [], row = [], f = '', q = false;
      for (var i = 0; i < t.length; i++) {
        var ch = t[i];
        if (q) {
          if (ch === '"' && t[i + 1] === '"') { f += '"'; i++; }
          else if (ch === '"') q = false; else f += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { row.push(f); f = ''; }
        else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
        else if (ch !== '\r') f += ch;
      }
      if (f || row.length) { row.push(f); rows.push(row); }
      if (!rows.length || rows[0].join('|').indexOf('מפתח') < 0) return;
      rows.slice(1).forEach(function (r2) {
        var k = (r2[0] || '').trim(), v = (r2[1] || '').trim();
        if (k && v) map[k] = v;
      });
      try { localStorage.setItem('df:textCache', JSON.stringify(map)); } catch (e) {}
      relayer();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
