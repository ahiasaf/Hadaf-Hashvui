<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>סרטון הדף השבועי</title>
<!--
  סרטון קצר להצגת הדף השבועי — 7 מסכים, 1080x1920, אנכי.
  אינו חלק מהאפליקציה ואינו מקושר ממנה. נבנה לסרטון בלבד.

  פתיחה רגילה בדפדפן: מנגן בלולאה (לתצוגה מקדימה).
  ?t=12.5           — קופא על השנייה הזו.
  render.js         — קורא ל-seek(t) פריים אחר פריים ומקליט ל-mp4.

  כל האנימציה נגזרת מ-t בלבד (בלי CSS transitions), כך שכל
  פריים יוצא זהה בכל הרצה.
-->
<style>
@font-face{font-family:'Heebo';font-weight:100 900;src:url(heebo-hebrew.woff2) format('woff2');
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-weight:100 900;src:url(heebo-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+2000-206F}
:root{--navy:#0B2550;--blue:#17468F;--gold:#c9962f;--gold-l:#E5B854}
html,body{margin:0;background:var(--navy)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  font-family:'Heebo',sans-serif;color:#fff;
  background:radial-gradient(120% 70% at 50% 38%,#163f86 0%,#0d2c5f 55%,#0A2149 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.b1{width:620px;height:620px;right:-260px;top:-240px;background:var(--gold);opacity:.10}
.b2{width:520px;height:520px;left:-240px;bottom:-200px;background:#3574CE;opacity:.16}

/* כותרת קבועה: הסמל העגול בעיגול לבן, השם והשנה */
.mast{position:absolute;top:84px;right:0;left:0;display:flex;align-items:center;
  justify-content:center;gap:26px}
.mast .m{width:132px;height:132px;border-radius:50%;background:#fff;display:flex;
  align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.mast .m img{width:88px;height:88px;object-fit:contain}
.mast .t b{display:block;font-size:56px;font-weight:900;line-height:1.05}
.mast .t span{display:block;font-size:34px;font-weight:500;opacity:.85;line-height:1.25}
.mast .t i{font-style:normal;color:var(--gold-l);font-weight:800;font-size:30px;letter-spacing:.04em}

.scr{position:absolute;inset:0;opacity:0}
.box{position:absolute;left:50%;overflow:hidden;border-radius:34px;background:#fff;
  box-shadow:0 24px 70px rgba(0,0,0,.42),0 0 0 6px rgba(255,255,255,.08)}
.box .lay{position:absolute;left:0;top:0;transform-origin:0 0}
.box img{display:block}
.hl{position:absolute;background:#FFD400;mix-blend-mode:multiply;border-radius:6px}

.say{position:absolute;right:70px;left:70px;top:1440px;height:380px;display:flex;
  align-items:center;justify-content:center;text-align:center;
  font-size:94px;font-weight:900;line-height:1.16;letter-spacing:-.5px;
  text-shadow:0 4px 18px rgba(0,0,0,.35)}
.say g{color:var(--gold)}
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="mast">
    <div class="m"><img id="mk" alt=""></div>
    <div class="t"><b>הדף השבועי</b><span>של בני עקיבא</span><i>תשפ"ז</i></div>
  </div>
</div>

<script src="../../logo.js"></script>
<script>
/* תיבת התמונה: עד 960 רוחב, 1120 גובה, ממורכזת סביב y=830.
   כל צילום מוגדר בחיתוך התחלה וחיתוך סיום (פיקסלים של הקובץ),
   באותו יחס — המעבר ביניהם הוא הזום. */
var BOX_W = 960, BOX_H = 1120, BOX_CY = 830;

function shot(src, w, h, a, b, hls) { return { src: src, w: w, h: h, a: a, b: b, hls: hls || [] }; }
function zoomTo(c, f, ax, ay) {        // חיתוך קטן פי f, מעוגן בנקודה יחסית (ax,ay)
  var w = c[2] * f, h = c[3] * f;
  return [c[0] + (c[2] - w) * ax, c[1] + (c[3] - h) * ay, w, h];
}

var SLIDE = [0, 240, 945, 1400];      // בלי שורת הדפדפן והכתובת
var MARK  = [0, 240, 945, 1400];

var SCREENS = [
  { d: 3.5, say: 'למה בנינו את <g>הדף השבועי</g>?', pop: true,
    shots: [shot('img/1-phone.jpg', 900, 900, [0, 0, 900, 900], [30, 30, 840, 840])] },
  { d: 6, say: 'כדי ש<g>אבות ובנים</g> ישבו יחד בבית וילמדו גמרא!',
    shots: [
      shot('img/2a-sukka.jpg', 1100, 619, [0, 0, 1100, 619], zoomTo([0, 0, 1100, 619], .88, .5, .45)),
      shot('img/2b-sukka.jpg', 1100, 825, [0, 0, 1100, 825], zoomTo([0, 0, 1100, 825], .88, .55, .5)),
      shot('img/2c-sukka.jpg', 825, 1100, [0, 0, 825, 1100], zoomTo([0, 0, 825, 1100], .88, .6, .45))
    ] },
  { d: 3.5, say: 'להרחיב את <g>מעגל המשתתפים</g> בשיעורי הלשמה!',
    shots: [shot('img/3-stats.jpg', 1080, 786, [0, 0, 1080, 786], zoomTo([0, 0, 1080, 786], .9, .5, .4))] },
  { d: 3.5, say: 'למעביר השיעור יש <g>כלי מוכן!</g>',
    shots: [shot('img/4-tool.jpg', 1078, 1463, [0, 0, 1078, 1463], zoomTo([0, 0, 1078, 1463], .86, .5, .45))] },
  { d: 3.5, say: '<g>מצגת עם איורים</g> שמסבירים את הגמרא',
    shots: [shot('img/5-slide.jpg', 945, 2048, SLIDE, zoomTo(SLIDE, .87, .5, 1))] },
  { d: 4, say: '<g>סימון</g> שמאפשר לתלמידים לעקוב אחרי הדף',
    shots: [shot('img/6-mark.jpg', 945, 2048, MARK, zoomTo(MARK, .86, .5, .2), [
      { r: [40, 622, 728, 58], t0: .7, t1: 1.6 },
      { r: [518, 682, 387, 54], t0: 1.6, t1: 2.1 }
    ])] },
  { d: 3.5, say: 'אחרי השיעור: חוזרים בבית ועונים על <g>החידון</g>',
    shots: [shot('img/7-quiz.jpg', 1074, 1148, [0, 0, 1074, 1148], zoomTo([0, 0, 1074, 1148], .8, .9, 0))] }
];

var FADE = 0.4;                         // מעבר דעיכה בין מסכים

/* בניית המסכים */
var stage = document.getElementById('stage'), T = 0, i, j;
document.getElementById('mk').src = LOGO_MARK;
for (i = 0; i < SCREENS.length; i++) {
  var s = SCREENS[i];
  s.start = T; T += s.d;
  s.el = document.createElement('div'); s.el.className = 'scr';
  for (j = 0; j < s.shots.length; j++) {
    var sh = s.shots[j], k = Math.min(BOX_W / sh.a[2], BOX_H / sh.a[3]);
    sh.bw = Math.round(sh.a[2] * k); sh.bh = Math.round(sh.a[3] * k);
    sh.box = document.createElement('div'); sh.box.className = 'box';
    sh.box.style.width = sh.bw + 'px'; sh.box.style.height = sh.bh + 'px';
    sh.box.style.marginLeft = (-sh.bw / 2) + 'px';
    sh.box.style.top = Math.round(BOX_CY - sh.bh / 2) + 'px';
    sh.lay = document.createElement('div'); sh.lay.className = 'lay';
    sh.lay.style.width = sh.w + 'px'; sh.lay.style.height = sh.h + 'px';
    var im = new Image(); im.src = sh.src; im.width = sh.w; im.height = sh.h;
    sh.lay.appendChild(im);
    for (var q = 0; q < sh.hls.length; q++) {
      var h = sh.hls[q]; h.el = document.createElement('div'); h.el.className = 'hl';
      h.el.style.top = h.r[1] + 'px'; h.el.style.height = h.r[3] + 'px';
      sh.lay.appendChild(h.el);
    }
    sh.box.appendChild(sh.lay); s.el.appendChild(sh.box);
  }
  s.txt = document.createElement('div'); s.txt.className = 'say'; s.txt.innerHTML = '<span>' + s.say + '</span>';
  s.el.appendChild(s.txt);
  stage.appendChild(s.el);
}
var TOTAL = T;

function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function ease(x) { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function out(x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); }
function back(x) { x = clamp(x); var c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function lerp(a, b, x) { return a + (b - a) * x; }

function place(sh, p) {                 // p: 0..1 לאורך הזום
  var c = [], n;
  for (n = 0; n < 4; n++) c[n] = lerp(sh.a[n], sh.b[n], p);
  var k = sh.bw / c[2];
  sh.lay.style.transform = 'scale(' + k + ') translate(' + (-c[0]) + 'px,' + (-c[1]) + 'px)';
}

function seek(t) {
  for (var i = 0; i < SCREENS.length; i++) {
    var s = SCREENS[i], lt = t - s.start, end = s.d;
    // דעיכה פנימה בתחילת המסך (חוץ מהראשון), החוצה — כשהבא נכנס
    var op = 1;
    if (i > 0) op = Math.min(op, clamp(lt / FADE));
    if (i < SCREENS.length - 1) op = Math.min(op, clamp((end + FADE - lt) / FADE));
    if (lt < 0 || lt > end + FADE) op = 0;
    s.el.style.opacity = op;
    if (!op) continue;

    // המשפט: עולה ונכנס
    var tx = out((lt - (s.pop ? .55 : .2)) / .5);
    s.txt.style.opacity = tx;
    s.txt.style.transform = 'translateY(' + lerp(40, 0, tx) + 'px)';

    var n = s.shots.length, per = s.d / n;
    for (var j = 0; j < n; j++) {
      var sh = s.shots[j], st = lt - j * per;
      // כמה תמונות במסך אחד: כל אחת דועכת פנימה על קודמתה
      var so = n === 1 ? 1 : (j === 0 ? 1 : clamp(st / .35));
      if (n > 1 && st < 0) so = 0;
      if (n > 1 && j < n - 1 && st > per + .35) so = 0;
      sh.box.style.opacity = so;
      sh.box.style.zIndex = j;
      place(sh, ease(st / (n > 1 ? per + .35 : s.d + FADE)));
      if (s.pop) {
        var pp = back(lt / .8);
        sh.box.style.transform = 'scale(' + lerp(.72, 1, pp) + ')';
        sh.box.style.opacity = clamp(lt / .3);
      }
      for (var q = 0; q < sh.hls.length; q++) {
        var h = sh.hls[q], f = ease((lt - h.t0) / (h.t1 - h.t0));
        // מימין לשמאל, כמו קריאה
        h.el.style.width = (h.r[2] * f) + 'px';
        h.el.style.left = (h.r[0] + h.r[2] * (1 - f)) + 'px';
        h.el.style.opacity = f > 0 ? .55 : 0;
      }
    }
  }
}

window.seek = seek;
window.TOTAL = TOTAL;
window.ready = function () {             // render.js מחכה לגופן ולתמונות
  var imgs = document.images, n;
  for (n = 0; n < imgs.length; n++) if (!imgs[n].complete) return false;
  return document.fonts ? document.fonts.status === 'loaded' : true;
};

var mt = /[?&]t=([\d.]+)/.exec(location.search);
if (mt) seek(parseFloat(mt[1]));
else if (!/[?&]render/.test(location.search)) {
  var t0 = null;
  (function loop(now) {
    if (t0 === null) t0 = now;
    seek(((now - t0) / 1000) % (TOTAL + .8));
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>
</body>
</html>
