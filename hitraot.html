<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E6">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="join-manifest.json">
<title>הדף השבועי</title>
<!-- ============================================================
     איך מחזירים את ההתראות — לתלמיד שחסם בטעות או התחרט.
     ============================================================
     ארבעה צעדים מצוירים, לפי המכשיר (אנדרואיד/אייפון, עם מעבר
     ביניהם), ובסוף בדיקה: התראה מקומית שקופצת מיד.

     **ציורים ולא צילומי מסך.** הריפו ציבורי, וצילום מסך של טלפון
     אמיתי נושא איתו את כל מה שעל המסך. הציור מראה רק את מה שצריך
     ללחוץ עליו.

     נשלח גם בוואטסאפ מהלוח של הרכז, ולכן יש לו כרטיס תצוגה.
     ============================================================ -->
<meta property="og:site_name" content="הדף השבועי של בני עקיבא">
<meta property="og:locale" content="he_IL">
<meta property="og:type" content="website">
<meta property="og:title" content="איך מחזירים את ההתראות · הדף השבועי">
<meta property="og:description" content="ארבעה צעדים בטלפון, ואז בדיקה אחת.">
<meta property="og:url" content="https://hadaf-hashvui.vercel.app/hitraot">
<meta property="og:image" content="https://hadaf-hashvui.vercel.app/share-card.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="הדף השבועי של בני עקיבא">
<meta name="twitter:card" content="summary_large_image">
<style>
/* המסך לא זז לצדדים: לחיצה כפולה אקראית אינה מגדילה, ואלמנט שבורח
   מרוחב המסך אינו יוצר גלילה אופקית. צביטה מכוונת נשארת (נגישות). */
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold:#C08F2B; --gold-t:#8C681F;
  --green-d:#467B1A; --stop:#A5392B;
  --paper:#F6F1E6; --surface:#FFFDF8; --sunk:#EFE6D3;
  --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#5C687E; --rule:#E5DAC3;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.6;
  padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:18px 14px 12px;
  max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);
  letter-spacing:.05em;margin-top:3px}
.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;
  padding:18px;margin-top:12px}
.card h2{font-size:1.14rem;font-weight:800;color:var(--blue-d)}
.card p{margin-top:6px;font-size:.9rem;font-weight:600;color:var(--ink-2)}
.seg{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:11px;margin-top:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;
  font-size:.86rem;font-weight:800;color:var(--ink-3);cursor:pointer}
.seg button.on{background:#fff;color:var(--blue)}
.st{margin-top:18px;text-align:center}
.num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;
  font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.st b{display:block;margin-top:6px;font-size:.98rem;color:var(--blue-d)}
.pic{margin:10px auto 0;width:220px;border:2px solid var(--rule);border-radius:18px;
  background:#1d2230;padding:14px 12px;color:#e8ecf5;font-size:.78rem;text-align:start}
.arw{display:block;text-align:center;color:var(--gold);font-size:1.2rem;margin-top:8px}
.ic{width:46px;height:46px;border-radius:12px;background:#fff;margin:0 auto;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--gold)}
.ic img{width:32px;height:32px}
.pop{background:#2c3244;border-radius:12px;padding:8px 10px;display:flex;
  justify-content:space-between;align-items:center;margin-bottom:10px}
.info{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
.row{background:#2c3244;border-radius:10px;padding:9px 10px;margin-top:6px;
  display:flex;justify-content:space-between;align-items:center}
.row.hi{box-shadow:0 0 0 2px var(--gold)}
.row small{display:block;color:#8e97ad;font-size:.7rem}
.tg{width:36px;height:20px;border-radius:10px;background:#555c70;position:relative;flex:none}
.tg:after{content:'';position:absolute;top:3px;right:3px;width:14px;height:14px;
  border-radius:50%;background:#fff}
.tg.on{background:#3b82f6}
.tg.on:after{right:auto;left:3px}
.go{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;
  background:var(--blue);color:#fff;font-size:1rem;font-weight:800;cursor:pointer}
.msg{margin-top:10px;font-size:.88rem;font-weight:700}
.msg.ok{color:var(--green-d)}
.msg.no{color:var(--stop)}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap">
  <div class="card" id="steps"></div>
  <div class="card" id="test"></div>
</main>
<script src="data.js"></script>
<script src="logo.js"></script>
<script src="getapp.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; });
}
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
/* המלל שנערך בניהול — אותן שתי שכבות של שאר העמודים. */
(function () {
  var take = function (map) {
    for (var k in (map || {})) {
      var p = k.split('.');
      if (p.length === 2 && p[0] === 'ui' && typeof map[k] === 'string' && map[k]) UI[p[1]] = map[k];
    }
  };
  try {
    take(JSON.parse(ls('df:textCache') || 'null'));
    take((JSON.parse(ls('df:cfg') || '{}')).texts);
  } catch (e) {}
})();
(function () { var l = $('hdr-mark'); if (l) l.src = LOGO_MARK; })();
$('brand').innerHTML = esc(PROGRAM.short) + '<br>' +
  esc(PROGRAM.name.slice(PROGRAM.short.length).trim());
$('yr').textContent = tp(UI.rstYear, { y: PROGRAM.year });

var IOS = window.APPX && APPX.isIOS && APPX.isIOS();
/* ציור קטן לכל צעד — רק מה שלוחצים עליו. */
function pic(os, n) {
  var mark = '<img src="' + esc(LOGO_MARK) + '" alt="">';
  if (os === 'a') {
    if (n === 1) return '<div class="pic" style="text-align:center"><div class="ic">' + mark +
      '</div><div style="margin-top:6px">' + esc(PROGRAM.short) + '</div><div style="margin-top:4px;color:var(--gold)">👆 ···</div></div>';
    if (n === 2) return '<div class="pic"><div class="pop"><span>' + esc(PROGRAM.short) +
      '</span><span class="info">i</span></div><div class="ic">' + mark + '</div></div>';
    if (n === 3) return '<div class="pic"><div class="row hi"><span>התראות<small>חסום</small></span></div>' +
      '<div class="row"><span>הרשאות</span></div><div class="row"><span>אחסון</span></div></div>';
    return '<div class="pic"><div class="row hi"><span>אפשר התראות</span><span class="tg on"></span></div></div>';
  }
  if (n === 1) return '<div class="pic" style="text-align:center"><div class="ic" style="background:#8e8e93;font-size:1.5rem">⚙</div>' +
    '<div style="margin-top:6px">הגדרות</div></div>';
  if (n === 2) return '<div class="pic"><div class="row"><span>ספארי</span></div><div class="row hi"><span>' +
    esc(PROGRAM.short) + '</span></div><div class="row"><span>שעון</span></div></div>';
  if (n === 3) return '<div class="pic"><div class="row hi"><span>התראות</span><span>›</span></div></div>';
  return '<div class="pic"><div class="row hi"><span>אפשר התראות</span><span class="tg on"></span></div></div>';
}
function drawSteps() {
  var os = IOS ? 'i' : 'a';
  var h = '<h2>' + esc(UI.hitT) + '</h2><p>' + esc(UI.hitB) + '</p>' +
    '<div class="seg"><button data-os="a" class="' + (os === 'a' ? 'on' : '') + '">' + esc(UI.hitDroid) +
    '</button><button data-os="i" class="' + (os === 'i' ? 'on' : '') + '">' + esc(UI.hitIos) + '</button></div>';
  for (var n = 1; n <= 4; n++) {
    h += '<div class="st"><span class="num">' + n + '</span><b>' +
      esc(UI[(os === 'a' ? 'hitA' : 'hitI') + n]) + '</b>' + pic(os, n) + '</div>' +
      (n < 4 ? '<span class="arw">↓</span>' : '');
  }
  $('steps').innerHTML = h;
  var bs = $('steps').querySelectorAll('[data-os]');
  for (var i = 0; i < bs.length; i++) bs[i].onclick = function () {
    IOS = this.getAttribute('data-os') === 'i'; drawSteps();
  };
}
var TEST = '';
function drawTest() {
  $('test').innerHTML = '<h2>' + esc(UI.hitTestH) + '</h2><p>' + esc(UI.hitTestB) + '</p>' +
    '<button class="go" id="t-go">' + esc(UI.hitTestGo) + '</button>' +
    (TEST ? '<div class="msg ' + (TEST === 'ok' ? 'ok' : 'no') + '">' +
      esc(TEST === 'ok' ? UI.hitTestOk : UI.hitTestNo) + '</div>' : '');
  $('t-go').onclick = function () {
    if (!window.APPX || !APPX.demo || APPX.perm() !== 'granted') { TEST = 'no'; drawTest(); return; }
    APPX.demo(PROGRAM.short, UI.hitTestOk).then(function () { TEST = 'ok'; drawTest(); },
      function () { TEST = 'no'; drawTest(); });
  };
}
drawSteps();
drawTest();
</script>
</body>
</html>
