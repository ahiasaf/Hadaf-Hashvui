# ============================================================
# בדיקה בכל דחיפה.
#
# `git push` הוא הפריסה כאן — אין שלב בנייה ואין סביבת בדיקה
# ביניים. לכן הבדיקה הזו היא הדבר היחיד שעומד בין טעות לבין
# הטלפון של תלמיד, והיא מכוונת בדיוק לטעויות שאי־אפשר לראות
# בעין מהקוד: הפניה לקובץ שאינו קיים, ומספר גרסה שנשכח.
#
# היא אינה בודקת לוגיקה ואינה מנסה. שנייה אחת, בלי התקנות.
# ============================================================
name: בדיקה

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: בדיקה לפני פרסום
        run: python3 tools/preflight.py
