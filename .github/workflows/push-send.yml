# ============================================================
# שליחת התראה למכשירים שנרשמו — ידנית, לפי פקודה.
# ============================================================
# זה הניסוי שבודק את מה שעמוד הבדיקה אינו יכול לבדוק: לא "האם
# המכשיר מסוגל לקבל", אלא **האם התראה באמת מגיעה אליו מבחוץ**,
# כשהאפליקציה סגורה והטלפון בכיס.
#
# למה דווקא כאן ולא מהסביבה שבה נכתב הקוד: שירות ההתראות של
# אפל אינו נגיש משם, ולכן שליחה משם מגיעה לאנדרואיד ולא
# לאייפון. ל-Actions יש רשת פתוחה, והוא כבר רץ כאן בכל דחיפה.
#
# ------------------------------------------------------------
# הפעלה — פעם אחת, ואז לא נוגעים
# ------------------------------------------------------------
# ב-GitHub: Settings → Secrets and variables → Actions →
# New repository secret. שניים:
#
#   VAPID_PRIVATE — המפתח הפרטי לחתימה. **לא בקוד לעולם**:
#                   הריפו ציבורי, ומפתח שנדחף אליו מאפשר לכל
#                   אחד לשלוח התראות בשם התוכנית.
#
#   READ_KEY      — אותה סיסמת קריאה שכבר מוגדרת בסקריפט של
#                   גוגל. היא מאפשרת לשלוף את רשימת המנויים
#                   מהלשונית הפרטית "התראות".
#
# **אין צורך להעתיק מנויים ביד.** כל מי שנרשם בעמוד /pushtest
# נכנס ללשונית לבד, והשליחה קוראת אותה בכל הרצה.
#
# ------------------------------------------------------------
# הרצה
# ------------------------------------------------------------
# Actions → "שליחת התראה" → Run workflow. אפשר לשנות את
# הכותרת והטקסט, או להשאיר את ברירת המחדל.
# ============================================================
name: שליחת התראה

on:
  # ------------------------------------------------------------
  # הפעלה ממסך הניהול
  # ------------------------------------------------------------
  # הסקריפט של גוגל מצית את זה דרך repository_dispatch, עם
  # הכותרת והטקסט במטען. אחיאסף כותב במסך הניהול, וההתראה
  # יוצאת — בלי להיכנס לכאן ובלי להמתין לסקר.
  repository_dispatch:
    types: [push-say]

  workflow_dispatch:
    inputs:
      title:
        description: 'כותרת ההתראה'
        required: false
        default: 'הדף השבועי'
      body:
        description: 'הטקסט'
        required: false
        default: 'דף חדש מחכה לך — מסכת תענית, דף ב.'
      link:
        description: 'לאן לפתוח (נתיב יחסי, ריק = האפליקציה)'
        required: false
        default: ''

# הרשאות מינימליות: השליחה אינה נוגעת בריפו כלל.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # גרסה נעוצה. ספריית שליחה שמתעדכנת לבד היא בדיוק מה
      # שנשבר ביום שבו צריך שיעבוד.
      - name: התקנת ספריית השליחה
        run: npm install --no-save web-push@3.6.7

      - name: שליחה
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          READ_KEY:      ${{ secrets.READ_KEY }}
          # שני המקורות: הפעלה ידנית מכאן, או הצתה ממסך הניהול.
          TITLE: ${{ inputs.title || github.event.client_payload.title }}
          BODY:  ${{ inputs.body  || github.event.client_payload.body }}
          # ריק = לכולם. אחרת קוד ישיבה, ואז רק היא מקבלת.
          ONLY:  ${{ github.event.client_payload.only }}
          # שכבה וכיתה — ר"ם ששולח לכיתה שלו בלבד.
          GRADE: ${{ github.event.client_payload.grade }}
          KLASS: ${{ github.event.client_payload.klass }}
          # לאן ההתראה פותחת. ריק = שורש האפליקציה.
          LINK:  ${{ inputs.link || github.event.client_payload.url }}
          # "צוות" = כל מי שאינו תלמיד ואינו הורה. ריק = לכולם.
          ROLE:  ${{ github.event.client_payload.role }}
          # "הדף נפתח": רק למי שביקש התראה על הדף הזה. 'taanit|ג'.
          WAIT:  ${{ github.event.client_payload.wait }}
        run: node tools/push-send.js
