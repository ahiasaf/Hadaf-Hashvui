# ============================================================
# שליחת התראה למכשירים שנרשמו — ידנית, לפי פקודה.
# ============================================================
# זה הניסוי שבודק את מה שעמוד הבדיקה אינו יכול לבדוק: לא "האם
# המכשיר מסוגל לקבל", אלא **האם התראה באמת מגיעה אליו מבחוץ**,
# כשהאפליקציה סגורה והטלפון בכיס.
#
# למה דווקא כאן ולא מהסביבה שבה נכתב הקוד: שירות ההתראות של
# אפל אינו נגיש משם, ולכן שליחה משם מגיעה לאנדרואיד ולא
# לאייפון. ל-Actions יש רשת פתוחה, והוא כבר רץ כאן בכל דחיפה.
#
# ------------------------------------------------------------
# הפעלה — פעם אחת, ואז לא נוגעים
# ------------------------------------------------------------
# ב-GitHub: Settings → Secrets and variables → Actions →
# New repository secret. שניים:
#
#   VAPID_PRIVATE — המפתח הפרטי לחתימה. **לא בקוד לעולם**:
#                   הריפו ציבורי, ומפתח שנדחף אליו מאפשר לכל
#                   אחד לשלוח התראות בשם התוכנית.
#
#   PUSH_SUBS     — מערך JSON של המנויים, כפי שהועתקו מעמוד
#                   הבדיקה. מנוי הוא כתובת לדחוף למכשיר מסוים,
#                   ולכן גם הוא סוד ולא קובץ.
#                   לדוגמה:  [{"endpoint":"…"},{"endpoint":"…"}]
#
# ------------------------------------------------------------
# הרצה
# ------------------------------------------------------------
# Actions → "שליחת התראה" → Run workflow. אפשר לשנות את
# הכותרת והטקסט, או להשאיר את ברירת המחדל.
# ============================================================
name: שליחת התראה

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'כותרת ההתראה'
        required: false
        default: 'הדף השבועי'
      body:
        description: 'הטקסט'
        required: false
        default: 'דף חדש מחכה לך — מסכת תענית, דף ב.'

# הרשאות מינימליות: השליחה אינה נוגעת בריפו כלל.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # גרסה נעוצה. ספריית שליחה שמתעדכנת לבד היא בדיוק מה
      # שנשבר ביום שבו צריך שיעבוד.
      - name: התקנת ספריית השליחה
        run: npm install --no-save web-push@3.6.7

      - name: שליחה
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBS:     ${{ secrets.PUSH_SUBS }}
          TITLE:         ${{ inputs.title }}
          BODY:          ${{ inputs.body }}
        run: node tools/push-send.js
