name: Send notification
on:
  repository_dispatch:
    types: [push-say]
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        default: "הדף השבועי"
      body:
        description: Notification text
        default: "דף חדש מחכה לך."
      link:
        description: Relative destination path
        default: ""
      dry:
        description: Verify targeting without delivery or data writes
        type: boolean
        default: true
      backend:
        description: Data source (preview requires a dry run)
        type: choice
        default: configured
        options: [configured, neon-preview]
permissions:
  contents: read
concurrency:
  group: ${{ inputs.backend == 'neon-preview' && 'notification-preview' || 'sched-send' }}
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READ_KEY: ${{ secrets.READ_KEY }}
      VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      DRY_RUN: ${{ inputs.dry }}
      HADAF_DATABASE_BACKEND: ${{ inputs.backend == 'neon-preview' && 'neon' || vars.HADAF_DATABASE_BACKEND }}
      DATABASE_URL: ${{ inputs.backend == 'neon-preview' && secrets.NEON_PREVIEW_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require dry delivery for preview data
        env:
          PREVIEW: ${{ inputs.backend == 'neon-preview' }}
        run: |
          if [ "$PREVIEW" = true ] && [ "$DRY_RUN" != true ]; then
            echo "Preview data may only be used for dry verification."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      # Private dispatch text is read from the event file, never printed as step env.
      - run: node tools/push-send.mts
      - name: Report infrastructure failure
        if: failure() && inputs.dry != true && github.event_name == 'repository_dispatch'
        run: node tools/push-report.mts crash
        env:
          SID: ${{ github.event.client_payload.sid }}
