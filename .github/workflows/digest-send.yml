# ============================================================
# העדכון המתוזמן — כל ר"ם, במועד שהוא בחר.
# ============================================================
# בפינה שבעמוד הצוות כל ר"ם בוחר מתי נוח לו לקבל עדכון על
# הלימוד של תלמידיו: בימי שישי, כל יום, במוצאי שבת, או בכלל
# לא. זה מה שמקיים את ההבטחה.
#
# ------------------------------------------------------------
# למה שש כניסות ולא אחת
# ------------------------------------------------------------
# הקרון של GitHub רץ ב-UTC ואינו יודע על שעון קיץ, והתוכנית
# חיה בישראל. לכל שעה ישראלית יש שתי שעות UTC אפשריות — אחת
# בקיץ ואחת בחורף — ולכן שתי כניסות לכל משמרת. הקוד בודק מה
# השעה בישראל באמת, ורק אחת מהשתיים עוברת את הבדיקה.
#
#   07:00 בישראל  →  04:00 / 05:00 UTC   (כל יום)
#   09:00 בישראל  →  06:00 / 07:00 UTC   (שישי)
#   21:00 בישראל  →  18:00 / 19:00 UTC   (מוצאי שבת)
#
# ------------------------------------------------------------
# מה לא נשלח
# ------------------------------------------------------------
#   · בשבת — בשום משמרת.
#   · בשבוע חופשה — שבוע שאין בו דף. כך גם חנוכה ופסח יוצאים
#     מהמשחק בלי רשימת חגים נפרדת.
#   · לפני תחילת התוכנית ואחרי סיומה.
#   · למי שבחר "לא לעדכן אותי".
#
# ------------------------------------------------------------
# לבדוק בלי לשלוח
# ------------------------------------------------------------
# Actions → "העדכון המתוזמן" → Run workflow, ולסמן "הרצה
# יבשה". הכול מחושב ומודפס, ואף התראה אינה יוצאת. אפשר גם
# לבחור משמרת ולכפות אותה, כדי לראות מה היה נשלח בשישי.
# ============================================================
name: העדכון המתוזמן

on:
  schedule:
    # 07:00 בישראל — המשמרת היומית
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    # 09:00 בישראל — שישי בבוקר
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    # 21:00 בישראל — מוצאי שבת
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'

  workflow_dispatch:
    inputs:
      dry:
        description: 'הרצה יבשה — לחשב ולהדפיס בלי לשלוח'
        type: boolean
        required: false
        default: true
      slot:
        description: 'לכפות משמרת (ריק = לפי השעון)'
        type: choice
        required: false
        default: ''
        options: ['', 'day', 'fri', 'sat']

# הרשאות מינימליות: השליחה אינה נוגעת בריפו כלל.
permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # גרסה נעוצה. ספריית שליחה שמתעדכנת לבד היא בדיוק מה
      # שנשבר ביום שבו צריך שיעבוד.
      - name: התקנת ספריית השליחה
        run: npm install --no-save web-push@3.6.7

      - name: שליחה
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          READ_KEY:      ${{ secrets.READ_KEY }}
          DRY_RUN:       ${{ inputs.dry }}
          FORCE_SLOT:    ${{ inputs.slot }}
        run: node tools/digest-send.js
