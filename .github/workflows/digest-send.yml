name: Scheduled notifications
on:
  schedule:
    - cron: "0,30 * * * *"
  repository_dispatch:
    types: [push-digest, push-clock]
  workflow_dispatch:
    inputs:
      dry:
        description: Calculate recipients without delivery or data writes
        type: boolean
        default: true
      slot:
        description: Optional Jerusalem day and time, such as 5:09:00
        default: ""
      mode:
        description: Digest content
        type: choice
        default: learn
        options: [learn, joined]
      everyone:
        description: Include staff regardless of their reminder schedule
        type: boolean
        default: false
      backend:
        description: Data source (preview requires a dry run)
        type: choice
        default: configured
        options: [configured, neon-preview]
permissions:
  contents: read
concurrency:
  group: ${{ inputs.backend == 'neon-preview' && 'notification-preview' || 'sched-send' }}
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READ_KEY: ${{ secrets.READ_KEY }}
      VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      DRY_RUN: ${{ inputs.dry }}
      HADAF_DATABASE_BACKEND: ${{ inputs.backend == 'neon-preview' && 'neon' || vars.HADAF_DATABASE_BACKEND }}
      DATABASE_URL: ${{ inputs.backend == 'neon-preview' && secrets.NEON_PREVIEW_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require dry delivery for preview data
        env:
          PREVIEW: ${{ inputs.backend == 'neon-preview' }}
        run: |
          if [ "$PREVIEW" = true ] && [ "$DRY_RUN" != true ]; then
            echo "Preview data may only be used for dry verification."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - id: dependencies
        run: npm ci --ignore-scripts --omit=dev
      - name: Staff digest
        run: node tools/digest-send.mts
        env:
          FORCE_SLOT: ${{ inputs.slot }}
          MODE: ${{ inputs.mode || github.event.client_payload.mode }}
          SEND_ALL: ${{ inputs.everyone || github.event.client_payload.all }}
          SID: ${{ github.event.client_payload.sid }}
      - name: Report infrastructure failure
        if: failure() && inputs.dry != true && github.event_name == 'repository_dispatch'
        run: node tools/push-report.mts crash
        env:
          SID: ${{ github.event.client_payload.sid }}
      - name: Coordinator reminders
        if: >-
          !cancelled() && steps.dependencies.outcome == 'success' && (github.event_name != 'repository_dispatch' ||
          github.event.action == 'push-clock')
        run: node tools/remind-send.mts
      - name: Shared learning notifications
        if: "!cancelled() && steps.dependencies.outcome == 'success'"
        run: node tools/pair-send.mts
