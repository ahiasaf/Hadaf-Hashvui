# ============================================================
# פריסת ה-Apps Script אוטומטית.
#
# עד עכשיו כל שינוי בסקריפט דרש העתקה ידנית לעורך של גוגל
# ופריסה מחדש — ובכל פעם מחדש. זה חוב, וזו גם המלכודת שכבר
# מחקה פעמיים את PRIVATE_ID ו-READ_KEY.
#
# מכאן והלאה: כל דחיפה שנוגעת ב-apps-script.gs פורסת אותו
# בעצמה. הכתובת אינה משתנה — הפריסה הקיימת מתעדכנת ולא נוצרת
# חדשה, ולכן האפליקציה ממשיכה לדבר עם אותה כתובת.
#
# ------------------------------------------------------------
# הפעלה — פעם אחת, ואז לא נוגעים
# ------------------------------------------------------------
# 1. script.google.com/home/usersettings → Apps Script API: On
#
# 2. על המחשב:  npm i -g @google/clasp  ואז  clasp login
#    נפתח דפדפן, מאשרים, ונוצר קובץ בשם  ~/.clasprc.json
#
# 3. ב-GitHub: Settings → Secrets and variables → Actions →
#    New repository secret. שלושה:
#
#      CLASPRC_JSON    — כל התוכן של ~/.clasprc.json
#      SCRIPT_ID       — עורך Apps Script → Project Settings
#      DEPLOYMENT_ID   — Deploy → Manage deployments (AKfycb...)
#
# ------------------------------------------------------------
# על הסוד
# ------------------------------------------------------------
# CLASPRC_JSON הוא אסימון גישה לחשבון גוגל שלך, בהיקף של
# Apps Script. GitHub שומר אותו מוצפן ואינו מציג אותו שוב —
# גם לא לך. הוא **לעולם אינו נכנס לריפו**, שהוא ציבורי.
#
# לבטל: clasp logout, או myaccount.google.com/permissions.
#
# ------------------------------------------------------------
# הערה למי שעורך את הקובץ הזה
# ------------------------------------------------------------
# **אין להשתמש ב-`secrets` בתוך `if:`.** ההקשר הזה אינו זמין
# בתנאים, ו-GitHub פוסל את הקובץ כולו — לא את השלב, את הקובץ.
# הריצה נכשלת מיד, בלי שום job ובלי לוג שאפשר לקרוא, וזה נראה
# בדיוק כמו פריסה שנכשלה. מעבירים סודות דרך `env` בלבד, ואת
# ההחלטה עושים בתוך `run`.
# ============================================================
name: פריסת הסקריפט

on:
  push:
    branches: [main]
    paths: ['apps-script.gs']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: פריסה
        env:
          CLASPRC_JSON:  ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID:     ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLASPRC_JSON:-}" ] || [ -z "${SCRIPT_ID:-}" ]; then
            echo "::notice::הסודות טרם הוגדרו — ראו את ההסבר בראש הקובץ. מדלג."
            exit 0
          fi

          npm i -g @google/clasp@2.4.2

          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

          # clasp דורש את שני הקבצים האלה, והם נגזרים מהסוד ולא
          # יושבים בריפו — כדי שמזהה הפרויקט לא יהיה ציבורי.
          mkdir -p build
          cp apps-script.gs build/Code.gs
          cat > build/appsscript.json <<'JSON'
          {
            "timeZone": "Asia/Jerusalem",
            "dependencies": {},
            "exceptionLogging": "STACKDRIVER",
            "runtimeVersion": "V8",
            "webapp": { "executeAs": "USER_DEPLOYING", "access": "ANYONE_ANONYMOUS" }
          }
          JSON
          printf '{"scriptId":"%s","rootDir":"build"}\n' "$SCRIPT_ID" > .clasp.json

          clasp push --force

          VER=$(grep -oE 'SCRIPT_VERSION[[:space:]]*=[[:space:]]*[0-9]+' apps-script.gs \
                | grep -oE '[0-9]+' | head -1)

          # עדכון הפריסה **הקיימת**. פריסה חדשה הייתה נותנת כתובת
          # חדשה שהאפליקציה אינה מכירה, וכל כתיבה הייתה ממשיכה
          # ללכת לשום מקום — התקלה שכבר עלתה לנו חודש.
          if [ -n "${DEPLOYMENT_ID:-}" ]; then
            clasp deploy -i "$DEPLOYMENT_ID" -d "v${VER:-auto} · ${GITHUB_SHA:0:7}"
            echo "::notice::הסקריפט נפרס · SCRIPT_VERSION ${VER:-?}"
          else
            echo "::warning::הקוד נדחף, אבל DEPLOYMENT_ID חסר — הפריסה לא עודכנה."
          fi
