# ============================================================
# פריסת ה-Apps Script אוטומטית.
#
# עד עכשיו כל שינוי בסקריפט דרש העתקה ידנית לעורך של גוגל
# ופריסה מחדש — ובכל פעם מחדש. זה חוב, וזו גם המלכודת שכבר
# מחקה פעמיים את PRIVATE_ID ו-READ_KEY.
#
# מכאן והלאה: כל דחיפה שנוגעת ב-apps-script.gs פורסת אותו
# בעצמה. הכתובת אינה משתנה — הפריסה הקיימת מתעדכנת ולא נוצרת
# חדשה, ולכן האפליקציה ממשיכה לדבר עם אותה כתובת.
#
# ------------------------------------------------------------
# הפעלה — פעם אחת, ואז לא נוגעים
# ------------------------------------------------------------
# 1. script.google.com/home/usersettings → Apps Script API: On
#
# 2. על המחשב:  npm i -g @google/clasp  ואז  clasp login
#    נפתח דפדפן, מאשרים, ונוצר קובץ בשם  ~/.clasprc.json
#
# 3. ב-GitHub: Settings → Secrets and variables → Actions →
#    New repository secret. שלושה:
#
#      CLASPRC_JSON    — כל התוכן של ~/.clasprc.json
#      SCRIPT_ID       — עורך Apps Script → Project Settings
#      DEPLOYMENT_ID   — Deploy → Manage deployments (AKfycb...)
#
# ------------------------------------------------------------
# על הסוד
# ------------------------------------------------------------
# CLASPRC_JSON הוא אסימון גישה לחשבון גוגל שלך, בהיקף של
# Apps Script. GitHub שומר אותו מוצפן ואינו מציג אותו שוב —
# גם לא לך. הוא **לעולם אינו נכנס לריפו**, שהוא ציבורי.
#
# לבטל: clasp logout, או myaccount.google.com/permissions.
#
# ------------------------------------------------------------
# הערה למי שעורך את הקובץ הזה
# ------------------------------------------------------------
# **אין להשתמש ב-`secrets` בתוך `if:`.** ההקשר הזה אינו זמין
# בתנאים, ו-GitHub פוסל את הקובץ כולו — לא את השלב, את הקובץ.
# הריצה נכשלת מיד, בלי שום job ובלי לוג שאפשר לקרוא, וזה נראה
# בדיוק כמו פריסה שנכשלה. מעבירים סודות דרך `env` בלבד, ואת
# ההחלטה עושים בתוך `run`.
# ============================================================
name: פריסת הסקריפט

on:
  push:
    branches: [main]
    paths: ['apps-script.gs']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: פריסה
        env:
          CLASPRC_JSON:  ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID:     ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLASPRC_JSON:-}" ] || [ -z "${SCRIPT_ID:-}" ]; then
            echo "::notice::הסודות טרם הוגדרו — ראו את ההסבר בראש הקובץ. מדלג."
            exit 0
          fi

          npm i -g @google/clasp@2.4.2

          # ------------------------------------------------------
          # התאמת קובץ ההזדהות.
          #
          # `clasp login` של גרסה 3 כותב קובץ בצורה אחרת מזו
          # שגרסה 2 יודעת לקרוא, ואין בו access_token כלל אלא
          # refresh_token בלבד. clasp 2 נחנק עליו בשגיאה שאינה
          # מסגירה דבר: "Cannot read properties of undefined".
          #
          # כאן מזהים את שתי הצורות. אם יש רק refresh_token —
          # פודים ממנו access_token מול גוגל וכותבים את הצורה
          # שגרסה 2 מצפה לה. צורה שלישית שלא נראתה עדיין תדפיס
          # את שמות המפתחות שנמצאו (בלי ערכים), כדי שאפשר יהיה
          # לתקן בסיבוב אחד ולא לנחש.
          # ------------------------------------------------------
          printf '%s' "$CLASPRC_JSON" > raw.json
          node > creds.env <<'NODE'
          var fs = require('fs');
          var raw = JSON.parse(fs.readFileSync('raw.json', 'utf8'));
          var out = { shape:'', id:'', secret:'', refresh:'', access:'', scope:'' };

          if (raw.token && raw.token.access_token) {
            out.shape = 'v2';
          } else {
            var t = (raw.tokens && (raw.tokens.default || raw.tokens)) || raw;
            if (t && t.refresh_token) {
              out.shape   = 'v3';
              out.refresh = t.refresh_token;
              out.id      = t.client_id ||
                            (raw.oauth2ClientSettings || {}).clientId || '';
              out.secret  = t.client_secret ||
                            (raw.oauth2ClientSettings || {}).clientSecret || '';
              out.scope   = t.scope || '';
            }
          }
          if (!out.shape) {
            console.error('צורת קובץ לא מוכרת. מפתחות עליונים: ' +
                          Object.keys(raw).join(', '));
            process.exit(1);
          }
          Object.keys(out).forEach(function (k) {
            process.stdout.write(k.toUpperCase() + '=' + out[k] + '\n');
          });
          NODE
          set -a; . ./creds.env; set +a
          echo "צורת ההזדהות: $SHAPE"

          if [ "$SHAPE" = "v2" ]; then
            cp raw.json ~/.clasprc.json
          else
            if [ -z "$ID" ] || [ -z "$SECRET" ]; then
              echo "::error::חסרים client_id/client_secret בקובץ ההזדהות."
              exit 1
            fi
            RESP=$(curl -sS -X POST https://oauth2.googleapis.com/token \
              -d "client_id=$ID" -d "client_secret=$SECRET" \
              -d "refresh_token=$REFRESH" -d "grant_type=refresh_token")
            ACCESS=$(printf '%s' "$RESP" | node -e \
              'var d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                 var j=JSON.parse(d);
                 if(!j.access_token){console.error("גוגל דחתה: "+(j.error||"")+" "+(j.error_description||""));process.exit(1);}
                 process.stdout.write(j.access_token);});')
            SCOPE_USE="${SCOPE:-https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.deployments}"
            ID="$ID" SECRET="$SECRET" REFRESH="$REFRESH" ACCESS="$ACCESS" \
            SCOPE_USE="$SCOPE_USE" node -e '
              var fs=require("fs"),e=process.env;
              fs.writeFileSync(process.env.HOME+"/.clasprc.json", JSON.stringify({
                token:{ access_token:e.ACCESS, refresh_token:e.REFRESH,
                        scope:e.SCOPE_USE, token_type:"Bearer",
                        expiry_date: Date.now()+3500*1000 },
                oauth2ClientSettings:{ clientId:e.ID, clientSecret:e.SECRET,
                                       redirectUri:"http://localhost" },
                isLocalCreds:false }));'
          fi
          rm -f raw.json creds.env

          # clasp דורש את שני הקבצים האלה, והם נגזרים מהסוד ולא
          # יושבים בריפו — כדי שמזהה הפרויקט לא יהיה ציבורי.
          mkdir -p build
          cp apps-script.gs build/Code.gs
          cat > build/appsscript.json <<'JSON'
          {
            "timeZone": "Asia/Jerusalem",
            "dependencies": {},
            "exceptionLogging": "STACKDRIVER",
            "runtimeVersion": "V8",
            "webapp": { "executeAs": "USER_DEPLOYING", "access": "ANYONE_ANONYMOUS" }
          }
          JSON
          printf '{"scriptId":"%s","rootDir":"build"}\n' "$SCRIPT_ID" > .clasp.json

          clasp push --force

          VER=$(grep -oE 'SCRIPT_VERSION[[:space:]]*=[[:space:]]*[0-9]+' apps-script.gs \
                | grep -oE '[0-9]+' | head -1)

          # עדכון הפריסה **הקיימת**. פריסה חדשה הייתה נותנת כתובת
          # חדשה שהאפליקציה אינה מכירה, וכל כתיבה הייתה ממשיכה
          # ללכת לשום מקום — התקלה שכבר עלתה לנו חודש.
          if [ -n "${DEPLOYMENT_ID:-}" ]; then
            clasp deploy -i "$DEPLOYMENT_ID" -d "v${VER:-auto} · ${GITHUB_SHA:0:7}"
            echo "::notice::הסקריפט נפרס · SCRIPT_VERSION ${VER:-?}"
          else
            echo "::warning::הקוד נדחף, אבל DEPLOYMENT_ID חסר — הפריסה לא עודכנה."
          fi
