# ============================================================
# מדידת זמני תגובה של השרת החי — קריאה בלבד, בלי סיסמה ובלי כתיבה.
# מזהה מכשיר מומצא (ZZPROBE…) — השרת מחשב כרגיל ומחזיר "אין".
# הרצה: Actions → "מדידת השרת" → Run workflow.
# ============================================================
name: מדידת השרת

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: מדידה
        run: |
          API=$(grep -oE "https://script.google.com/macros/s/[A-Za-z0-9_-]+/exec" data.js | head -1)
          t() {
            local q="$1"
            curl -sS -L -o out.txt -w "%{http_code} %{time_total}s" --max-time 60 "$API?$q" > meta.txt 2>&1 || true
            echo "$(cat meta.txt) · $q · $(head -c 160 out.txt | tr '\n' ' ')"
          }
          for i in 1 2 3; do
            t "pts=me&id=ZZPROBE$i"
            t "inbox=ZZPROBE$i"
            t "amdaFor=ZZPROBE$i"
            t "challenge=my&id=ZZPROBE$i"
            sleep 5
          done
      # הכרטיסים דרך האתר שלנו (api/pts.js, 8.99.473) — אותה בקשה, מזהה מומצא.
      - name: הכרטיסים דרך האתר
        run: |
          for i in 1 2; do
            curl -sS -o out.txt -w "%{http_code} %{time_total}s" --max-time 60 \
              "https://hadaf-hashvui.vercel.app/api/pts?pts=me&id=ZZPROBE$i&callback=pm1" > meta.txt 2>&1 || true
            echo "$(cat meta.txt) · $(head -c 160 out.txt)"
          done
          curl -sS -o out.txt -w "%{http_code} %{time_total}s" --max-time 60 \
            "https://hadaf-hashvui.vercel.app/api/chal?challenge=my&id=ZZPROBE1&callback=lcb1" > meta.txt 2>&1 || true
          echo "האתגר: $(cat meta.txt) · $(head -c 120 out.txt)"
          curl -sS -o /dev/null -w "בלי pts=me: %{http_code}\n" --max-time 30 "https://hadaf-hashvui.vercel.app/api/pts?pts=all&id=x&callback=pm1" || true
      # מה השרת עצמו מדד (tmNote_) — 6 השעות האחרונות, לפי חלון ונתיב.
      - name: זמני השרת
        env:
          READ_KEY: ${{ secrets.READ_KEY }}
        run: |
          API=$(grep -oE "https://script.google.com/macros/s/[A-Za-z0-9_-]+/exec" data.js | head -1)
          [ -z "${READ_KEY:-}" ] && { echo "אין READ_KEY"; exit 0; }
          curl -sS -L --max-time 60 "$API?tm=1&key=$READ_KEY" | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          if d.get("status") != "ok": print(d); sys.exit(0)
          print(" | ".join(d["cols"]))
          for r in d["rows"]: print(" | ".join(str(x) for x in r))'
      # ההגדרה "מה מוצג" (rows) מהגיליון הציבורי — לבדוק אם "עמוד הביניים" (mid) דלוק.
      - name: הגדרת "מה מוצג"
        run: |
          ID=$(grep -oE "^var SHEET_ID *= *'[^']+'" data.js | grep -oE "'[^']+'" | tr -d "'")
          curl -sS -L --max-time 60 "https://docs.google.com/spreadsheets/d/$ID/gviz/tq?tqx=out:csv&sheet=%D7%94%D7%92%D7%93%D7%A8%D7%95%D7%AA" \
            | python3 -c '
          import sys, csv
          for r in csv.reader(sys.stdin):
              if r and r[0].strip() == "rows": print("rows =", r[1] if len(r) > 1 else "")'
