<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F1E6">
<link rel="icon" href="icon-192.png">
<title>הדף השבועי</title>
<!-- ============================================================
     התחלה מחדש במכשיר — כלי בדיקה לרכז.
     ============================================================
     "אני רוצה להתקין כתלמיד, ואז כהורה, ואז כראש חטיבה, ולבדוק
     מה כל אחד רואה." האפליקציה זוכרת מי אתה בזיכרון של הדפדפן,
     ולכן מכשיר שהיה פעם מנהל נשאר מנהל. כאן מנקים הכול — ההרשמה,
     ההגדרות, מנוי ההתראות, ה-Service Worker והמטמון — ובפתיחה
     הבאה זו פעם ראשונה.

     **ומכשיר בדיקה:** סימון שנשאר אחרי הניקוי. מה שנרשם ממכשיר
     כזה נושא "בדיקה: כן", אינו נספר במונים, ואינו מופיע בלוח של
     הצוות האמיתי — רק בלוח שנפתח במכשיר בדיקה בעצמו. ראו
     `noTestRows_` ב-apps-script.gs.

     **אינו מקושר משום מקום**, כמו /admin. ניקוי מוחק רק את
     המכשיר של מי שלחץ, ולכן אין כאן מה להגן מעבר ל"האם אתה בטוח".
     ============================================================ -->
<style>
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold:#C08F2B; --gold-t:#8C681F;
  --green-d:#467B1A; --stop:#A5392B;
  --paper:#F6F1E6; --surface:#FFFDF8; --sunk:#EFE6D3;
  --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#5C687E; --rule:#E5DAC3;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.6;
  padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:18px 14px 20px;
  max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);
  letter-spacing:.05em;margin-top:3px}
.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;
  padding:18px;margin-top:14px}
.card h2{font-size:1.1rem;font-weight:800;color:var(--blue-d)}
.card p{margin-top:8px;font-size:.9rem;font-weight:600;color:var(--ink-2)}
.now{margin-top:12px;padding:10px 12px;background:var(--sunk);border-radius:12px;
  font-size:.86rem;font-weight:700}
.warn{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:.84rem;
  font-weight:700;color:var(--stop);background:rgba(165,57,43,.08)}
.chk{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:.88rem;
  font-weight:700;color:var(--ink)}
.chk input{margin-top:5px;width:18px;height:18px;flex:none}
.go{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;
  background:var(--blue);color:#fff;font-size:1rem;font-weight:800;cursor:pointer}
.go[disabled]{opacity:.55}
.lnk{display:block;margin-top:12px;text-align:center;font-size:.82rem;font-weight:700;
  color:var(--ink-3);background:none;border:0;text-decoration:underline;cursor:pointer;width:100%}
.ok{margin-top:14px;font-size:1rem;font-weight:800;color:var(--green-d)}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap"><div class="card" id="box"></div></main>

<script src="data.js"></script>
<script src="logo.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; });
}
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* המלל שנערך בניהול — אותן שתי שכבות של שאר העמודים. */
(function () {
  var take = function (map) {
    for (var k in (map || {})) {
      var p = k.split('.');
      if (p.length === 2 && p[0] === 'ui' && typeof map[k] === 'string' && map[k]) UI[p[1]] = map[k];
    }
  };
  try {
    take(JSON.parse(ls('df:textCache') || 'null'));
    take((JSON.parse(ls('df:cfg') || '{}')).texts);
  } catch (e) {}
})();

(function () { var l = $('hdr-mark'); if (l) l.src = LOGO_MARK; })();
$('brand').innerHTML = esc(PROGRAM.short) + '<br>' +
  esc(PROGRAM.name.slice(PROGRAM.short.length).trim());
$('yr').textContent = tp(UI.rstYear, { y: PROGRAM.year });

/* מי המכשיר הזה עכשיו — כדי שיהיה ברור מה עומד להימחק. */
function nowTxt() {
  var bits = [];
  if (ls('df:admOk') === '1') bits.push(UI.rstAdm);
  var me = null;
  try { me = JSON.parse(ls('df:me') || 'null'); } catch (e) {}
  if (me && me.first) bits.push(tp(UI.rstMe, { name: ((me.first || '') + ' ' + (me.last || '')).trim() }));
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i) || '';
    if (k === 'df:head' || k === 'df:headSeen') { bits.push(UI.rstHead); break; }
  }
  if (ls('df:tester') === '1') bits.push(UI.rstTestOn);
  return bits.length ? bits.join(' · ') : UI.rstNone;
}

var DONE = false, BUSY = false;
function paint() {
  var adm = ls('df:admOk') === '1', test = ls('df:tester') === '1';
  var h = '<h2>' + esc(UI.rstT) + '</h2><p>' + esc(UI.rstB) + '</p>' +
    '<div class="now">' + esc(UI.rstNow) + ' ' + esc(nowTxt()) + '</div>';
  if (DONE) {
    h += '<div class="ok">' + esc(UI.rstDone) + '</div><p>' + esc(UI.rstNext) + '</p>';
  } else {
    if (adm) h += '<div class="warn">' + esc(UI.rstAdmWarn) + '</div>';
    h += '<label class="chk"><input type="checkbox" id="test"' + (adm && !test ? '' : ' checked') +
      '> <span>' + esc(UI.rstTest) + '</span></label>' +
      '<button class="go" id="go"' + (BUSY ? ' disabled' : '') + '>' +
      esc(BUSY ? UI.rstBusy : UI.rstGo) + '</button>';
  }
  h += '<button class="lnk" id="mark">' + esc(test ? UI.rstUnmark : UI.rstMark) + '</button>';
  $('box').innerHTML = h;
  if ($('go')) $('go').onclick = wipe;
  $('mark').onclick = function () {
    try {
      if (ls('df:tester') === '1') localStorage.removeItem('df:tester');
      else localStorage.setItem('df:tester', '1');
    } catch (e) {}
    paint();
  };
}

/* הניקוי. כל שלב עצמאי — שלב שנכשל (דפדפן בלי מנויים, בלי
   מטמון) אינו עוצר את השאר. */
function wipe() {
  if (!confirm(UI.rstAsk)) return;
  var test = $('test') && $('test').checked;
  BUSY = true; paint();
  var soft = function (p) { return Promise.resolve(p)['catch'](function () {}); };
  var sw = ('serviceWorker' in navigator) ? navigator.serviceWorker : null;
  soft(sw ? sw.getRegistrations() : [])
    .then(function (rs) {
      return Promise.all((rs || []).map(function (r) {
        return soft(r.pushManager && r.pushManager.getSubscription().then(function (s) {
          return s ? s.unsubscribe() : null;
        })).then(function () { return soft(r.unregister()); });
      }));
    })
    .then(function () {
      if (!window.caches) return;
      return soft(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches['delete'](k); }));
      }));
    })
    .then(function () {
      if (!window.indexedDB || !indexedDB.databases) return;
      return soft(indexedDB.databases().then(function (ds) {
        (ds || []).forEach(function (d) { if (d.name) indexedDB.deleteDatabase(d.name); });
      }));
    })
    .then(function () {
      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      try { if (test) localStorage.setItem('df:tester', '1'); } catch (e) {}
      BUSY = false; DONE = true; paint();
    });
}
paint();
</script>
</body>
</html>
