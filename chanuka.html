<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>הדף השבועי של בני עקיבא</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E2E63">
<meta name="robots" content="noindex">
<!-- ============================================================
     הזמנת חוברות חנוכה — פרויקט מקומי של ישיבת לפיד (8.99.530–533).
     ============================================================
     נפתח מקישור בלבד (/chanuka) — בלי התקנה, בלי הרשמה ובלי זיהוי צוות.
     8.99.533 (אחיאסף): שלבים — שכבה (ז׳–י״א) ← רשימת הכיתות של השכבה, ולכל
     כיתה שם הר"ם (?chn=cls — הר"מים מהלשונית הפרטית, ומספר התלמידים מרשימות
     התלמידים: הגבוה מבין שתיהן, לא הסכום). הר"ם לוחץ על השורה שלו; הרשימה
     מתקפלת לשורה אחת עם "שינוי". כיתה בלי מספר תלמידים — אין שדה כמות, והיא
     נשמרת "תושלם" (אחיאסף ישלים). חוברות תרגול — כן/לא, באותה כמות.
     שמירה: POST {action:'chn', op, rq} (no-cors) → ?chn=chk&op= → "נקלטה" רק
     ממה שנקרא בלשונית. op לכל שליחה (ניסיון חוזר — אותו op); rq קבוע במכשיר
     (df:chnRq) — שליחה חוזרת מעדכנת. השם נכתב בשרת מרשימת הר"מים. השרת: chnPut_.
     הכיתות לא נטענו — שכבה, מספר כיתה וכמות ביד. מועד סגירה (ניהול) — אחריו סגור.
     ?tst=1 — שורות בדיקה, לא נספרות.
     ============================================================ -->
<style>
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
:root{
  --blue:#17468F; --blue-d:#0B2550; --blue-l:#E8EEF8; --gold:#C9A13B; --gold-t:#8C681F; --green-d:#467B1A;
  --paper:#F6F1E6; --surface:#FFFDF8; --ink:#1B2A45; --ink-2:#5A6780;
  --rule:#E5DAC3; --stop:#A5382D;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.5;
  padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:14px 16px 10px;max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);letter-spacing:.05em;margin-top:3px}
.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
/* הבאנר — הכותרת, והכריכות לצידה */
.ban{display:flex;gap:14px;align-items:center;margin:8px 0 16px;padding:16px;border-radius:18px;color:#fff;
  background:linear-gradient(160deg,var(--blue-d),var(--blue));box-shadow:0 8px 22px rgba(11,37,80,.22)}
.ban .tx{flex:1;min-width:0}
.ban h2{font-size:1.32rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.ban p{font-size:.92rem;font-weight:600;opacity:.9;margin-top:4px}
.covers{display:flex;gap:6px;flex:none;align-items:flex-end}
.covers figure{width:58px;text-align:center}
.covers img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.covers figcaption{font-size:.66rem;font-weight:700;margin-top:4px;line-height:1.2;opacity:.92}
.tst{background:#FFF3C4;border:1px solid #E5C76B;color:#6B5310;border-radius:10px;padding:6px 10px;
  font-weight:800;font-size:.86rem;margin-bottom:12px;text-align:center}
/* שלב */
.step{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(37,29,12,.05)}
.step h3{font-size:1.02rem;font-weight:800;color:var(--blue-d);margin-bottom:10px}
/* השכבות */
.grs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grs button{border:2px solid var(--rule);border-radius:12px;background:#fff;color:var(--blue-d);
  font:inherit;font-weight:800;font-size:1.15rem;padding:12px 0;cursor:pointer}
.grs button.on{border-color:var(--blue);background:var(--blue);color:#fff}
/* הכיתות */
.cl{display:flex;flex-direction:column;gap:8px}
.cr{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:2px solid var(--rule);border-radius:14px;
  background:#fff;color:var(--ink);font:inherit;padding:10px 12px;cursor:pointer}
.cr.on{border-color:var(--blue);background:var(--blue-l)}
.cr .bd{flex:none;min-width:52px;height:44px;padding:0 6px;border-radius:12px;background:var(--blue-l);color:var(--blue-d);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.08rem}
.cr.on .bd{background:var(--blue);color:#fff}
.cr .nm{flex:1;min-width:0;font-weight:800;font-size:1.02rem}
.cr .st2{flex:none;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.chg{border:0;background:none;color:var(--blue);font:inherit;font-weight:800;text-decoration:underline;padding:8px 2px 0;cursor:pointer}
/* ההזמנה */
.fl{display:block;margin-bottom:14px}
.fl > span{display:block;font-size:.92rem;font-weight:800;color:var(--blue-d);margin-bottom:4px}
.fl input,.fl select{display:block;width:100%;border:1px solid var(--rule);border-radius:12px;background:#fff;
  padding:11px 13px;font:inherit;font-size:16px;color:var(--ink)}
.fl input:focus,.fl select:focus{outline:2px solid var(--blue);outline-offset:1px}
.fl small{display:block;font-size:.82rem;font-weight:600;color:var(--ink-2);margin-top:4px}
.fl .num{max-width:8rem;font-size:1.3rem;font-weight:800;text-align:center}
.two{display:flex;gap:10px}
.two .fl{flex:1}
.yn{display:flex;gap:10px}
.yn button{flex:1;border:2px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);
  font:inherit;font-weight:800;font-size:1.05rem;padding:11px;cursor:pointer}
.yn button.on{border-color:var(--green-d);background:#EEF6E4;color:var(--green-d)}
.yn.need button{border-color:var(--stop)}
.err{color:var(--stop);font-weight:800;font-size:.86rem;margin-top:4px}
.sum{border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin:4px 0 10px;background:#FFFBEF;
  font-weight:800;font-size:1.02rem;color:var(--blue-d)}
.due{font-size:.84rem;font-weight:700;color:var(--ink-2);margin:0 0 12px}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;
  font:inherit;font-weight:800;font-size:1.08rem;padding:15px;cursor:pointer;box-shadow:0 6px 16px rgba(23,70,143,.25)}
.go[disabled]{opacity:.7;cursor:default}
.go.g{background:#fff;color:var(--blue);border:1px solid var(--rule);box-shadow:none;margin-top:8px}
.st{margin-top:12px;text-align:center}
.st p{font-weight:800;color:var(--stop);margin-bottom:8px}
.msg{text-align:center;font-size:1.1rem;font-weight:800;color:var(--blue-d);padding:28px 8px}
.ok{text-align:center;padding:26px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:16px}
.ok h3{font-size:1.4rem;font-weight:800;color:var(--green-d)}
.ok p{font-size:1.05rem;font-weight:700;margin-top:8px}
.ok .ask{color:var(--gold-t)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap">
  <div class="ban">
    <div class="tx"><h2 id="ttl"></h2><p id="sub"></p></div>
    <div class="covers">
      <figure><img src="chanuka-covers/sefer.webp" alt="" width="360" height="554"><figcaption id="capB"></figcaption></figure>
      <figure><img src="chanuka-covers/avoda.webp" alt="" width="360" height="510"><figcaption id="capP"></figcaption></figure>
    </div>
  </div>
  <div class="tst" id="tstTag" hidden></div>
  <div class="msg" id="msg" hidden></div>
  <div class="st" id="lerr" hidden><p id="lerrT"></p><button class="go g" id="lre" type="button"></button></div>
  <form id="f" autocomplete="off" hidden novalidate>
    <div class="step"><h3 id="stG"></h3><div class="grs" id="grs"></div></div>
    <div class="step" id="clsStep" hidden><h3 id="stC"></h3><div id="clsBox"></div></div>
    <div class="step" id="more" hidden>
      <label class="fl" id="bBox"><span id="booksL"></span>
        <input id="f-b" class="num" type="number" inputmode="numeric" min="1" max="200">
        <small id="booksH"></small></label>
      <div class="fl"><span id="prQ"></span>
        <div class="yn" id="yn"><button type="button" id="yY"></button><button type="button" id="yN"></button></div>
        <div class="err" id="ynErr" hidden></div></div>
      <div class="sum" id="sum" hidden></div>
      <p class="due" id="due"></p>
      <button class="go" id="go" type="submit"></button>
      <div class="st" id="st" hidden><p id="stT"></p><button class="go" id="re" type="button"></button></div>
    </div>
  </form>
  <div class="ok" id="ok" hidden><h3 id="okH"></h3><p id="okB"></p><p class="ask" id="okA" hidden></p></div>
</main>
<script src="data.js"></script>
<script src="logo.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; });
}
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function jget(k) { try { return JSON.parse(ls(k) || 'null'); } catch (e) { return null; } }
/* המלל שנערך בניהול. נוסח שהוחלף בקוד (TEXT_RETIRED) — אינו גובר. */
function take(map) {
  for (var k in (map || {})) {
    var p = k.split('.'), v = map[k];
    if (p.length !== 2 || p[0] !== 'ui' || typeof v !== 'string' || !v) continue;
    var old = (typeof TEXT_RETIRED !== 'undefined' && TEXT_RETIRED[k]) || [];
    if ([].concat(old).indexOf(v) >= 0) continue;
    UI[p[1]] = v;
  }
}
try {
  take(jget('df:textCache'));
  take((jget('df:cfg') || {}).texts);
} catch (e) {}

$('hdr-mark').src = window.LOGO_MARK || '';
$('brand').innerHTML = esc(PROGRAM.short) + '<br>' + esc(PROGRAM.name.slice(PROGRAM.short.length).trim());
$('yr').textContent = tp(UI.rstYear, { y: PROGRAM.year });
$('ttl').textContent = UI.chnTitle;
$('sub').textContent = UI.chnSub;
$('capB').textContent = UI.chnBookL;
$('capP').textContent = UI.chnBookP;
if (UI.chnTitle) document.title = UI.chnTitle;
$('stG').textContent = UI.chnStepG;
$('stC').textContent = UI.chnStepC;
$('booksL').textContent = UI.chnBooks;
$('prQ').textContent = UI.chnPrQ;
$('yY').textContent = UI.chnYes;
$('yN').textContent = UI.chnNo;
$('go').textContent = UI.chnGo;
$('lre').textContent = UI.chnLoadRetry;

var TST = /[?&]tst=1(&|$)/.test(location.search);
if (TST) { $('tstTag').textContent = UI.chnTestTag; $('tstTag').hidden = false; }

/* פרויקט מקומי של ישיבת לפיד — הישיבה קבועה. השכבות — ז׳–י״א. */
var INST = 'lapid';
var GRADES = ['ז', 'ח', 'ט', 'י', 'יא'];
function instName() {
  for (var i = 0; i < INSTITUTIONS.length; i++) if (INSTITUTIONS[i].code === INST) return INSTITUTIONS[i].name;
  return '';
}

/* ---- השרת ---- */
function api() {
  var u = ls('dfApi') || (typeof APPS_SCRIPT_URL !== 'undefined' ? APPS_SCRIPT_URL : '');
  return String(u || '').trim();
}
function get(q) {
  var u = api();
  var direct = u + (u.indexOf('?') < 0 ? '?' : '&') + q + '&t=' + Date.now();
  var j = function (r) { if (!r.ok) throw new Error('http'); return r.json(); };
  return fetch(direct).then(j)['catch'](function () {
    if (typeof APPS_SCRIPT_URL === 'undefined' || u !== APPS_SCRIPT_URL) throw new Error('net');
    return fetch('/api/gs?' + q + '&t=' + Date.now()).then(j);
  });
}
function rid(n) {
  var b = [], i, a;
  try {
    a = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (i = 0; i < a.length; i++) b.push((a[i] < 16 ? '0' : '') + a[i].toString(16));
  } catch (e) {
    for (i = 0; i < n * 2; i++) b.push(Math.floor(Math.random() * 16).toString(16));
  }
  return b.join('');
}
/* המבקש — קבוע במכשיר: שליחה חוזרת שלו מעדכנת, לא מוסיפה. */
var RQ = (function () {
  var k = String(ls('df:chnRq') || '');
  if (/^[0-9a-f]{32,64}$/.test(k)) return k;
  k = rid(20);
  try { localStorage.setItem('df:chnRq', k); } catch (e) {}
  return k;
})();

/* ---- תצוגה ---- */
function grD(g) { return g.length > 1 ? g.charAt(0) + '״' + g.charAt(1) : g + '׳'; }
function clsD(g, c) { return g.length > 1 ? grD(g) + ' ' + c : grD(g) + c; }
function dateD(iso) {
  var d = new Date(iso);
  if (!(d.getTime() > 0)) return '';
  try {
    return d.toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', weekday: 'long', day: 'numeric',
      month: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return d.toLocaleString(); }
}
/* g — השכבה שנבחרה · pick — "שכבה|כיתה" · p — כן/לא לתרגול · failed — הכיתות לא נטענו */
var S = { open: '', close: '', cls: [], g: '', pick: '', p: null, failed: false, lastPick: '' };

function show(which) {
  $('msg').hidden = which !== 'msg';
  $('lerr').hidden = which !== 'lerr';
  $('f').hidden = which !== 'f';
  $('ok').hidden = which !== 'ok';
}
function say(t) { $('msg').textContent = t; show('msg'); }

function load() {
  say(UI.chnLoad);
  /* הכיתות לא נקראו — עוד ניסיון רק למצב ההזמנה; ידוע — הזנה ידנית. */
  get('chn=cls&y=' + INST)['catch'](function () {
    return get('chn=cls').then(function (d) { if (d) d.cls = null; return d; });
  }).then(function (d) {
    if (!d || !d.open) throw new Error('bad');
    S.open = d.open; S.close = d.close || '';
    if (d.open === 'closed') return say(tp(UI.chnClosed, { d: dateD(S.close) }));
    S.failed = d.status !== 'ok' || !d.cls;
    S.cls = S.failed ? [] : d.cls;
    show('f');
    paint();
  })['catch'](function () {
    $('lerrT').textContent = UI.chnLoadErr;
    show('lerr');
  });
}
$('lre').onclick = load;

function rowOf(v) {
  for (var i = 0; i < S.cls.length; i++) if (S.cls[i][0] + '|' + S.cls[i][1] === v) return S.cls[i];
  return null;
}
function paint() {
  /* שלב 1 — השכבה */
  $('grs').innerHTML = GRADES.map(function (g) {
    return '<button type="button" data-g="' + g + '"' + (S.g === g ? ' class="on"' : '') + '>' + grD(g) + '</button>';
  }).join('');
  Array.prototype.forEach.call($('grs').querySelectorAll('[data-g]'), function (el) {
    el.onclick = function () {
      var g = this.getAttribute('data-g');
      if (S.g !== g) { S.g = g; S.pick = ''; }
      paint();
      $('clsStep').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
  });
  /* שלב 2 — הכיתות של השכבה, עם הר"ם */
  $('clsStep').hidden = !S.g;
  var box = $('clsBox'), h = '';
  if (S.g && !S.failed) {
    var L = S.cls.filter(function (x) { return x[0] === S.g; });
    var sel = S.pick ? rowOf(S.pick) : null;
    if (sel) L = [sel];
    h = '<div class="cl">' + L.map(function (x) {
      var v = x[0] + '|' + x[1];
      return '<button type="button" class="cr' + (S.pick === v ? ' on' : '') + '" data-c="' + esc(v) + '">' +
        '<span class="bd">' + esc(clsD(x[0], x[1])) + '</span>' +
        '<span class="nm">' + esc(x[3] || '') + '</span>' +
        (x[2] ? '<span class="st2">' + esc(tp(UI.chnClsStu, { n: x[2] })) + '</span>' : '') + '</button>';
    }).join('') + '</div>' +
      (sel ? '<button type="button" class="chg" id="chg">' + esc(UI.chnChange) + '</button>' : '');
  } else if (S.g) {
    /* הכיתות לא נטענו — מספר הכיתה ביד */
    h = '<div class="st"><p>' + esc(UI.chnLoadErr) + '</p></div>' +
      '<label class="fl"><span>' + esc(UI.chnClsNum) + '</span><input id="f-k" maxlength="3" inputmode="numeric" value="' +
      esc(S.k || '') + '"></label>';
  }
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('[data-c]'), function (el) {
    el.onclick = function () {
      S.pick = this.getAttribute('data-c');
      paint();
      $('more').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
  });
  if ($('chg')) $('chg').onclick = function () { S.pick = ''; paint(); };
  if ($('f-k')) $('f-k').oninput = function () { S.k = this.value; paintMore(); };
  /* שלב 3 — ההזמנה. המספר מהרשימה — רק כשהכיתה התחלפה (תיקון לא נדרס). */
  var row = S.pick ? rowOf(S.pick) : null;
  S.n0 = row ? row[2] : null;
  var key = S.failed ? 'x' + S.g : S.pick;
  if (S.lastPick !== key) { S.lastPick = key; $('f-b').value = S.n0 ? S.n0 : ''; }
  /* כיתה בלי מספר תלמידים — בלי שדה כמות (אחיאסף ישלים). */
  $('bBox').hidden = !S.failed && !S.n0;
  $('booksH').textContent = S.failed ? UI.chnBooksNone : UI.chnBooksHint;
  $('more').hidden = !(S.failed ? S.g : S.pick);
  paintMore();
}

function curCls() {
  if (S.failed) {
    var c = String(S.k || '').replace(/\D/g, '');
    return S.g && c ? { g: S.g, c: c } : null;
  }
  if (!S.pick) return null;
  var p = S.pick.split('|');
  return { g: p[0], c: p[1] };
}
function books() { var n = Math.floor(+$('f-b').value); return n >= 1 && n <= 200 ? n : 0; }
function noQty() { return !S.failed && !S.n0; }
function paintMore() {
  var b = books();
  $('yY').className = S.p === 1 ? 'on' : '';
  $('yN').className = S.p === 0 ? 'on' : '';
  if (S.p != null) { $('yn').className = 'yn'; $('ynErr').hidden = true; }
  var sum = $('sum'), t = '';
  if (S.p != null && noQty()) t = S.p ? UI.chnSumX : UI.chnSumXNo;
  else if (S.p != null && b) t = S.p ? tp(UI.chnSum, { b: b, p: b }) : tp(UI.chnSumNo, { b: b });
  sum.textContent = t;
  sum.hidden = !t;
  $('due').textContent = S.close ? tp(UI.chnDue, { d: dateD(S.close) }) : '';
  $('due').hidden = !S.close;
}
$('f-b').oninput = paintMore;
$('yY').onclick = function () { S.p = 1; paintMore(); };
$('yN').onclick = function () { S.p = 0; paintMore(); };

/* ---- שליחה: "נקלטה" רק מקריאה של הלשונית ---- */
var BUSY = false, OP = '', SIG = '';
function wait(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }
function post(f) {
  var u = api();
  if (!u) return Promise.reject(new Error('api'));
