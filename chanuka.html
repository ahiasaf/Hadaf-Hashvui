<!-- ============================================================
     הזמנת חוברות חנוכה — פרויקט מקומי של ישיבת לפיד (8.99.530–535).
     ============================================================
     נפתח מקישור בלבד (/chanuka) — בלי התקנה, בלי הרשמה ובלי זיהוי צוות.
     8.99.535 (אחיאסף: "עיצוב מושקע, כמו עמוד רכישה"): בצבעי הכריכות (סגול לילה,
     טורקיז, זהב), כותרות ושמות בפרנק-רוהל (fonts/, בלי CDN).
     מסך 1 — שכבה (ז׳–י״א) ← הכיתות: תווית הכיתה ושם הרב בלבד (בלי מספר תלמידים).
     מסך 2 (אחרי בחירה, pushState — "חזרה" של הטלפון חוזר לרשימה) — "עמוד רכישה":
     הכיתה והרב למעלה עם "שינוי", כרטיס ספר הלימוד עם הכריכה ובורר כמות (−/+, ממולא
     לפי רשימת התלמידים — הגבוה מבין שתי הרשימות), כרטיס חוברת התרגול עם השאלה וכן/לא
     (באותה כמות), סיכום וכפתור הזמנה. כיתה בלי מספר תלמידים — בלי בורר כמות ("תושלם").
     שמירה: POST {action:'chn', op, rq} (no-cors) → ?chn=chk&op= → "נקלטה" רק ממה שנקרא
     בלשונית. op לכל שליחה (ניסיון חוזר — אותו op); rq קבוע במכשיר (df:chnRq). השרת: chnPut_.
     הכיתות לא נטענו — מספר כיתה וכמות ביד. מועד סגירה (ניהול) — אחריו סגור. ?tst=1 — בדיקה.
     ============================================================ -->
<style>
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
@font-face{font-family:'FrankRuhlDaf';font-style:normal;font-weight:400 900;font-display:swap;
  src:url(fonts/frank-ruhl-hebrew.woff2) format('woff2')}
:root{
  --night:#241B3A; --night-2:#33285A; --teal:#2C7A86; --teal-l:#E3F1F2;
  --gold:#E3B341; --gold-l:#F7E7B8; --gold-d:#8A6512;
  --paper:#F6F1E6; --card:#FFFDF8; --ink:#231C33; --ink-2:#6B6480; --rule:#E8DFCC;
  --blue-d:#0B2550; --stop:#A5382D; --green-d:#3F7A2A;
  --serif:'FrankRuhlDaf','Frank Ruhl Libre','David',serif;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.5;
  padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:14px 16px 10px;max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-d);letter-spacing:.05em;margin-top:3px}
.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
/* ---- הבאנר: לילה של חנוכה, הכריכות בזווית ---- */
.hero{position:relative;overflow:hidden;margin:8px 0 18px;padding:22px 18px 20px;border-radius:22px;color:#fff;
  background:radial-gradient(120% 90% at 85% 0%,rgba(227,179,65,.28),transparent 55%),
             linear-gradient(155deg,var(--night) 0%,var(--night-2) 55%,var(--teal) 130%);
  box-shadow:0 14px 34px rgba(36,27,58,.32)}
.hero .tx{position:relative;z-index:1;max-width:58%}
.hero h2{font-family:var(--serif);font-size:1.85rem;font-weight:900;line-height:1.12;color:#FFF3D1}
.hero p{font-size:.92rem;font-weight:600;opacity:.88;margin-top:8px}
.covers{position:absolute;left:12px;bottom:14px;width:40%;height:calc(100% - 28px)}
.covers img{position:absolute;bottom:0;width:62%;height:auto;border-radius:5px;
  box-shadow:0 10px 22px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12)}
.covers .c1{left:30%;transform:rotate(5deg);z-index:2}
.covers .c2{left:0;transform:rotate(-7deg);bottom:8px;opacity:.96}
.tst{background:#FFF3C4;border:1px solid #E5C76B;color:#6B5310;border-radius:10px;padding:6px 10px;
  font-weight:800;font-size:.86rem;margin-bottom:12px;text-align:center}
/* ---- כרטיס ---- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:18px 16px;margin-bottom:14px;
  box-shadow:0 2px 6px rgba(36,27,58,.05),0 10px 26px rgba(36,27,58,.06)}
.card h3{font-family:var(--serif);font-size:1.32rem;font-weight:800;color:var(--night);margin-bottom:12px}
/* השכבות */
.grs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grs button{border:1.5px solid var(--rule);border-radius:14px;background:#fff;color:var(--night);
  font-family:var(--serif);font-weight:800;font-size:1.3rem;padding:12px 0;cursor:pointer;transition:all .15s}
.grs button.on{border-color:var(--night);background:var(--night);color:var(--gold);box-shadow:0 6px 14px rgba(36,27,58,.25)}
/* הכיתות: התווית ושם הרב */
.cl{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.cr{display:flex;align-items:center;gap:14px;width:100%;text-align:right;border:1.5px solid var(--rule);border-radius:16px;
  background:#fff;color:var(--ink);font:inherit;padding:10px 12px;cursor:pointer;transition:all .15s}
.cr:active{transform:scale(.99)}
.cr .bg{flex:none;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--night),var(--night-2));color:var(--gold);
  font-family:var(--serif);font-weight:900;font-size:1.25rem;box-shadow:inset 0 0 0 2px rgba(227,179,65,.55)}
.cr .rv{flex:1;min-width:0;font-family:var(--serif);font-weight:700;font-size:1.22rem;color:var(--night);line-height:1.25}
.cr .rv.no{color:var(--ink-2);font-weight:500}
.cr .go2{flex:none;color:var(--gold-d);font-size:1.3rem;font-weight:800}
/* ---- עמוד ההזמנה ---- */
.who{display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,var(--night),var(--night-2));color:#fff;
  border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:0 10px 24px rgba(36,27,58,.25)}
.who .bg{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--gold);color:var(--night);font-family:var(--serif);font-weight:900;font-size:1.3rem}
.who .t{flex:1;min-width:0}
.who .t small{display:block;font-size:.8rem;font-weight:700;opacity:.75}
.who .t b{display:block;font-family:var(--serif);font-size:1.32rem;font-weight:800;color:#FFF3D1;line-height:1.2}
.chg{flex:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:transparent;color:#fff;
  font:inherit;font-size:.86rem;font-weight:700;padding:6px 12px;cursor:pointer}
.prod{display:flex;gap:16px;align-items:flex-start}
.prod img{flex:none;width:92px;height:auto;border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.prod .pi{flex:1;min-width:0}
.prod .pk{font-size:.76rem;font-weight:800;color:var(--teal);letter-spacing:.04em}
.prod h4{font-family:var(--serif);font-size:1.3rem;font-weight:800;color:var(--night);line-height:1.2;margin:2px 0 10px}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--rule);border-radius:14px;overflow:hidden;
  width:max-content;background:#fff}
.qty button{width:44px;height:46px;border:0;background:var(--teal-l);color:var(--teal);font:inherit;font-size:1.4rem;
  font-weight:800;cursor:pointer}
.qty input{width:66px;height:46px;border:0;text-align:center;font:inherit;font-size:1.35rem;font-weight:800;
  color:var(--night);background:#fff;-moz-appearance:textfield;appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input:focus{outline:none}
.hint{font-size:.8rem;font-weight:600;color:var(--ink-2);margin-top:6px}
.yn{display:flex;gap:10px;margin-top:4px}
.yn button{flex:1;border:1.5px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink);
  font:inherit;font-weight:800;font-size:1.05rem;padding:11px;cursor:pointer;transition:all .15s}
.yn button.on{border-color:var(--teal);background:var(--teal);color:#fff}
.yn.need button{border-color:var(--stop)}
.same{font-size:.86rem;font-weight:700;color:var(--teal);margin-top:8px}
.err{color:var(--stop);font-weight:800;font-size:.86rem;margin-top:6px}
.fl{display:block;margin-top:14px}
.fl > span{display:block;font-size:.92rem;font-weight:800;color:var(--night);margin-bottom:4px}
.fl input{display:block;width:100%;border:1.5px solid var(--rule);border-radius:12px;background:#fff;
  padding:11px 13px;font:inherit;font-size:16px;color:var(--ink)}
/* הסיכום והכפתור */
.sumc{background:var(--gold-l);border:1.5px solid var(--gold);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.sumc .sum{font-family:var(--serif);font-weight:800;font-size:1.15rem;color:var(--night)}
.due{font-size:.82rem;font-weight:700;color:var(--gold-d);margin-top:6px}
.go{display:block;width:100%;border:0;border-radius:16px;background:linear-gradient(150deg,#F0C75A,var(--gold));
  color:var(--night);font:inherit;font-weight:900;font-size:1.15rem;padding:16px;cursor:pointer;
  box-shadow:0 10px 22px rgba(227,179,65,.4)}
.go[disabled]{opacity:.7;cursor:default}
.go.g{background:#fff;color:var(--night);border:1px solid var(--rule);box-shadow:none;margin-top:8px}
.st{margin-top:12px;text-align:center}
.st p{font-weight:800;color:var(--stop);margin-bottom:8px}
.msg{text-align:center;font-family:var(--serif);font-size:1.25rem;font-weight:800;color:var(--night);padding:28px 8px}
/* האישור */
.ok{text-align:center;padding:28px 18px 26px;border-radius:22px;color:#fff;
  background:radial-gradient(120% 90% at 50% 0%,rgba(227,179,65,.3),transparent 60%),
             linear-gradient(160deg,var(--night),var(--night-2));box-shadow:0 14px 34px rgba(36,27,58,.3)}
.ok h3{font-family:var(--serif);font-size:1.6rem;font-weight:900;color:#FFF3D1}
.ok .rvn{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--gold);margin-top:8px}
.ok p{font-size:1.02rem;font-weight:700;margin-top:8px;opacity:.95}
.ok .ask{color:var(--gold-l)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap">
  <div class="hero">
    <div class="tx"><h2 id="ttl"></h2><p id="sub"></p></div>
    <div class="covers">
      <img class="c2" src="chanuka-covers/avoda.webp" alt="" width="360" height="510">
      <img class="c1" src="chanuka-covers/sefer.webp" alt="" width="360" height="554">
    </div>
  </div>
  <div class="tst" id="tstTag" hidden></div>
  <div class="msg" id="msg" hidden></div>
  <div class="st" id="lerr" hidden><p id="lerrT"></p><button class="go g" id="lre" type="button"></button></div>
  <form id="f" autocomplete="off" hidden novalidate>
    <!-- מסך 1: שכבה ← כיתה -->
    <div class="card" id="pickStep">
      <h3 id="stG"></h3>
      <div class="grs" id="grs"></div>
      <div id="clsStep" hidden><h3 id="stC" style="margin-top:20px"></h3><div id="clsBox"></div></div>
    </div>
    <!-- מסך 2: עמוד ההזמנה -->
    <div id="more" hidden>
      <div class="who" id="who" hidden><span class="bg" id="whoBg"></span>
        <span class="t"><small id="whoK"></small><b id="whoN"></b></span>
        <button type="button" class="chg" id="chg"></button></div>
      <div class="card">
        <div class="prod"><img src="chanuka-covers/sefer.webp" alt="" width="360" height="554">
          <div class="pi"><div class="pk" id="pkB"></div><h4 id="prodB"></h4>
            <div id="bBox"><div class="qty"><button type="button" id="qP" aria-label="+">+</button>
              <input id="f-b" type="number" inputmode="numeric" min="1" max="200">
              <button type="button" id="qM" aria-label="−">−</button></div>
              <div class="hint" id="booksH"></div></div></div></div>
      </div>
      <div class="card">
        <div class="prod"><img src="chanuka-covers/avoda.webp" alt="" width="360" height="510">
          <div class="pi"><div class="pk" id="pkP"></div><h4 id="prodP"></h4>
            <div style="font-weight:800;color:var(--night)" id="prQ"></div>
            <div class="yn" id="yn"><button type="button" id="yY"></button><button type="button" id="yN"></button></div>
            <div class="same" id="same" hidden></div>
            <div class="err" id="ynErr" hidden></div></div></div>
      </div>
      <div class="sumc" id="sumc" hidden><div class="sum" id="sum"></div><p class="due" id="due"></p></div>
      <button class="go" id="go" type="submit"></button>
      <div class="st" id="st" hidden><p id="stT"></p><button class="go" id="re" type="button"></button></div>
    </div>
  </form>
  <div class="ok" id="ok" hidden><h3 id="okH"></h3><p class="rvn" id="okN" hidden></p>
    <p id="okB"></p><p class="ask" id="okA" hidden></p></div>
</main>
<script src="data.js"></script>
<script src="logo.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; });
}
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function jget(k) { try { return JSON.parse(ls(k) || 'null'); } catch (e) { return null; } }
/* המלל שנערך בניהול. נוסח שהוחלף בקוד (TEXT_RETIRED) — אינו גובר. */
function take(map) {
  for (var k in (map || {})) {
    var p = k.split('.'), v = map[k];
    if (p.length !== 2 || p[0] !== 'ui' || typeof v !== 'string' || !v) continue;
    var old = (typeof TEXT_RETIRED !== 'undefined' && TEXT_RETIRED[k]) || [];
    if ([].concat(old).indexOf(v) >= 0) continue;
    UI[p[1]] = v;
  }
}
try {
  take(jget('df:textCache'));
  take((jget('df:cfg') || {}).texts);
} catch (e) {}

$('hdr-mark').src = window.LOGO_MARK || '';
$('brand').innerHTML = esc(PROGRAM.short) + '<br>' + esc(PROGRAM.name.slice(PROGRAM.short.length).trim());
$('yr').textContent = tp(UI.rstYear, { y: PROGRAM.year });
$('ttl').textContent = UI.chnTitle;
$('sub').textContent = UI.chnSub;
if (UI.chnTitle) document.title = UI.chnTitle;
$('stG').textContent = UI.chnStepG;
$('stC').textContent = UI.chnStepC;
$('pkB').textContent = UI.chnBookL;
$('pkP').textContent = UI.chnBookP;
$('prodB').textContent = UI.chnProdName;
$('prodP').textContent = UI.chnProdName;
$('prQ').textContent = UI.chnPrQ;
$('yY').textContent = UI.chnYes;
$('yN').textContent = UI.chnNo;
$('go').textContent = UI.chnGo;
$('chg').textContent = UI.chnChange;
$('lre').textContent = UI.chnLoadRetry;

var TST = /[?&]tst=1(&|$)/.test(location.search);
if (TST) { $('tstTag').textContent = UI.chnTestTag; $('tstTag').hidden = false; }

/* פרויקט מקומי של ישיבת לפיד — הישיבה קבועה. השכבות — ז׳–י״א. */
var INST = 'lapid';
var GRADES = ['ז', 'ח', 'ט', 'י', 'יא'];
function instName() {
  for (var i = 0; i < INSTITUTIONS.length; i++) if (INSTITUTIONS[i].code === INST) return INSTITUTIONS[i].name;
  return '';
}

/* ---- השרת ---- */
function api() {
  var u = ls('dfApi') || (typeof APPS_SCRIPT_URL !== 'undefined' ? APPS_SCRIPT_URL : '');
  return String(u || '').trim();
}
function get(q) {
  var u = api();
  var direct = u + (u.indexOf('?') < 0 ? '?' : '&') + q + '&t=' + Date.now();
  var j = function (r) { if (!r.ok) throw new Error('http'); return r.json(); };
  return fetch(direct).then(j)['catch'](function () {
    if (typeof APPS_SCRIPT_URL === 'undefined' || u !== APPS_SCRIPT_URL) throw new Error('net');
    return fetch('/api/gs?' + q + '&t=' + Date.now()).then(j);
  });
}
function rid(n) {
  var b = [], i, a;
  try {
    a = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (i = 0; i < a.length; i++) b.push((a[i] < 16 ? '0' : '') + a[i].toString(16));
  } catch (e) {
    for (i = 0; i < n * 2; i++) b.push(Math.floor(Math.random() * 16).toString(16));
  }
  return b.join('');
}
/* המבקש — קבוע במכשיר: שליחה חוזרת שלו מעדכנת, לא מוסיפה. */
var RQ = (function () {
  var k = String(ls('df:chnRq') || '');
  if (/^[0-9a-f]{32,64}$/.test(k)) return k;
  k = rid(20);
  try { localStorage.setItem('df:chnRq', k); } catch (e) {}
  return k;
})();

/* ---- תצוגה ---- */
function grD(g) { return g.length > 1 ? g.charAt(0) + '״' + g.charAt(1) : g + '׳'; }
function clsD(g, c) { return g.length > 1 ? grD(g) + ' ' + c : grD(g) + c; }
function dateD(iso) {
  var d = new Date(iso);
  if (!(d.getTime() > 0)) return '';
  try {
    return d.toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', weekday: 'long', day: 'numeric',
      month: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return d.toLocaleString(); }
}
/* g — השכבה · pick — "שכבה|כיתה" · p — כן/לא לתרגול · failed — הכיתות לא נטענו */
var S = { open: '', close: '', cls: [], g: '', pick: '', p: null, failed: false, lastPick: '' };

function show(which) {
  $('msg').hidden = which !== 'msg';
  $('lerr').hidden = which !== 'lerr';
  $('f').hidden = which !== 'f';
  $('ok').hidden = which !== 'ok';
}
function say(t) { $('msg').textContent = t; show('msg'); }

function load() {
  say(UI.chnLoad);
  /* הכיתות לא נקראו — עוד ניסיון רק למצב ההזמנה; ידוע — הזנה ידנית. */
  get('chn=cls&y=' + INST)['catch'](function () {
    return get('chn=cls').then(function (d) { if (d) d.cls = null; return d; });
  }).then(function (d) {
    if (!d || !d.open) throw new Error('bad');
    S.open = d.open; S.close = d.close || '';
    if (d.open === 'closed') return say(tp(UI.chnClosed, { d: dateD(S.close) }));
    S.failed = d.status !== 'ok' || !d.cls;
    S.cls = S.failed ? [] : d.cls;
    show('f');
    paint();
  })['catch'](function () {
    $('lerrT').textContent = UI.chnLoadErr;
    show('lerr');
  });
}
$('lre').onclick = load;

function rowOf(v) {
  for (var i = 0; i < S.cls.length; i++) if (S.cls[i][0] + '|' + S.cls[i][1] === v) return S.cls[i];
  return null;
}
/* בחירת כיתה — מסך ההזמנה, ו"חזרה" של הטלפון מחזיר לרשימה. */
function pickCls(v) {
  S.pick = v;
  try { history.pushState({ chn: 1 }, ''); } catch (e) {}
  paint();
  window.scrollTo(0, 0);
}
function unpick() { S.pick = ''; paint(); }
window.addEventListener('popstate', function () { if (S.pick) unpick(); });

function paint() {
  /* מסך 1 — השכבה והכיתות (מוסתר כשנבחרה כיתה) */
  $('pickStep').hidden = !!S.pick;
  $('grs').innerHTML = GRADES.map(function (g) {
    return '<button type="button" data-g="' + g + '"' + (S.g === g ? ' class="on"' : '') + '>' + grD(g) + '</button>';
  }).join('');
  Array.prototype.forEach.call($('grs').querySelectorAll('[data-g]'), function (el) {
    el.onclick = function () {
      var g = this.getAttribute('data-g');
      if (S.g !== g) { S.g = g; S.pick = ''; S.k = ''; }
      paint();
      $('clsStep').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
  });
  $('clsStep').hidden = !S.g;
  var box = $('clsBox'), h = '';
  if (S.g && !S.failed) {
    /* שורת כיתה: התווית ושם הרב — בלי מספר תלמידים (אחיאסף). */
    h = '<div class="cl">' + S.cls.filter(function (x) { return x[0] === S.g; }).map(function (x) {
      var v = x[0] + '|' + x[1];
      return '<button type="button" class="cr" data-c="' + esc(v) + '">' +
        '<span class="bg">' + esc(clsD(x[0], x[1])) + '</span>' +
        '<span class="rv' + (x[3] ? '' : ' no') + '">' + esc(x[3] || tp(UI.chnClsLine, { cls: clsD(x[0], x[1]) })) + '</span>' +
        '<span class="go2">‹</span></button>';
    }).join('') + '</div>';
  } else if (S.g) {
    /* הכיתות לא נטענו — מספר הכיתה ביד */
    h = '<div class="st"><p>' + esc(UI.chnLoadErr) + '</p></div>' +
      '<label class="fl"><span>' + esc(UI.chnClsNum) + '</span><input id="f-k" maxlength="3" inputmode="numeric" value="' +
      esc(S.k || '') + '"></label>';
  }
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('[data-c]'), function (el) {
    el.onclick = function () { pickCls(this.getAttribute('data-c')); };
  });
  if ($('f-k')) $('f-k').oninput = function () { S.k = this.value; paintMore(); };
  /* מסך 2 — עמוד ההזמנה. המספר מהרשימה — רק כשהכיתה התחלפה (תיקון לא נדרס). */
  var row = S.pick ? rowOf(S.pick) : null;
  S.n0 = row ? row[2] : null;
  var key = S.failed ? 'x' + S.g : S.pick;
  if (S.lastPick !== key) { S.lastPick = key; $('f-b').value = S.n0 ? S.n0 : ''; }
  $('who').hidden = !row;
  if (row) {
    $('whoBg').textContent = clsD(row[0], row[1]);
    $('whoK').textContent = row[3] ? tp(UI.chnClsLine, { cls: clsD(row[0], row[1]) }) : '';
    $('whoN').textContent = row[3] || tp(UI.chnClsLine, { cls: clsD(row[0], row[1]) });
  }
  /* כיתה בלי מספר תלמידים — בלי בורר כמות (אחיאסף ישלים). */
  $('bBox').hidden = !S.failed && !S.n0;
  $('booksH').textContent = S.failed ? UI.chnBooksNone : UI.chnBooksHint;
  $('more').hidden = !(S.failed ? S.g : S.pick);
  paintMore();
}

function curCls() {
  if (S.failed) {
    var c = String(S.k || '').replace(/\D/g, '');
    return S.g && c ? { g: S.g, c: c } : null;
  }
  if (!S.pick) return null;
  var p = S.pick.split('|');
  return { g: p[0], c: p[1] };
}
function books() { var n = Math.floor(+$('f-b').value); return n >= 1 && n <= 200 ? n : 0; }
function noQty() { return !S.failed && !S.n0; }
function paintMore() {
  var b = books();
  $('yY').className = S.p === 1 ? 'on' : '';
  $('yN').className = S.p === 0 ? 'on' : '';
  if (S.p != null) { $('yn').className = 'yn'; $('ynErr').hidden = true; }
  $('same').textContent = b ? tp(UI.chnPrSame, { n: b }) : '';
  $('same').hidden = !(S.p === 1 && b && UI.chnPrSame);
  var t = '';
  if (S.p != null && noQty()) t = S.p ? UI.chnSumX : UI.chnSumXNo;
  else if (S.p != null && b) t = S.p ? tp(UI.chnSum, { b: b, p: b }) : tp(UI.chnSumNo, { b: b });
  $('sum').textContent = t;
  $('due').textContent = S.close ? tp(UI.chnDue, { d: dateD(S.close) }) : '';
  $('due').hidden = !S.close;
  $('sumc').hidden = !t;
}
$('f-b').oninput = paintMore;
function step(d) {
  var n = Math.floor(+$('f-b').value) || 0;
  n = Math.max(1, Math.min(200, n + d));
  $('f-b').value = n;
  paintMore();
}
$('qP').onclick = function () { step(1); };
$('qM').onclick = function () { step(-1); };
$('yY').onclick = function () { S.p = 1; paintMore(); };
$('yN').onclick = function () { S.p = 0; paintMore(); };
$('chg').onclick = function () { try { history.back(); } catch (e) {} setTimeout(function () { if (S.pick) unpick(); }, 300); };

/* ---- שליחה: "נקלטה" רק מקריאה של הלשונית ---- */
var BUSY = false, OP = '', SIG = '';
function wait(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }
function post(f) {
  var u = api();
  if (!u) return Promise.reject(new Error('api'));
  return fetch(u, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'chn', op: OP, rq: RQ, f: f }) });
}
function check(n) {
  return get('chn=chk&op=' + OP)
    .then(function (r) { return r && r.status === 'ok' && r.saved ? r.o : null; }, function () { return null; })
    .then(function (o) {
      if (o || n <= 1) return o;
      return wait(2500).then(function () { return check(n - 1); });
    });
}
function attempt(f) {
  return post(f)['catch'](function () {})
    .then(function () { return wait(1500); })
    .then(function () { return check(4); });
}
function done(o) {
  var cls = clsD(o.g, o.c);
  $('okH').textContent = UI.chnOkH;
  var rw = rowOf(o.g + '|' + o.c);
  $('okN').textContent = rw && rw[3] ? rw[3] : '';
  $('okN').hidden = !(rw && rw[3]);
  $('okB').textContent = o.b == null ? tp(o.p ? UI.chnOkBX : UI.chnOkBXNo, { cls: cls }) :
    o.p ? tp(UI.chnOkB, { cls: cls, b: o.b, p: o.pn }) : tp(UI.chnOkBNo, { cls: cls, b: o.b });
  $('okA').textContent = UI.chnOkAsk;
  $('okA').hidden = o.st !== 'ask';
  show('ok');
  window.scrollTo(0, 0);
}
function fail() {
  BUSY = false;
  /* אולי ההזמנות נסגרו בינתיים — אז זה מה שמוצג. */
  get('chn=cls').then(function (d) {
    if (d && d.open === 'closed') say(tp(UI.chnClosed, { d: dateD(d.close) }));
  }, function () {});
  $('go').hidden = true;
  $('stT').textContent = UI.chnFail;
  $('st').hidden = false;
  $('re').disabled = false;
  $('re').textContent = UI.chnRetry;
}
function send() {
  if (BUSY) return;
  var c = curCls(), b = noQty() ? 0 : books();
  if (!c) return;
  if (!noQty() && !b) { $('f-b').focus(); return; }
  if (S.p == null) {
    $('yn').className = 'yn need';
    $('ynErr').textContent = UI.chnPrNeed; $('ynErr').hidden = false;
    $('yn').scrollIntoView({ block: 'center' });
    return;
  }
  var f = { y: INST, yn: instName(), g: c.g, c: c.c, b: b, p: S.p ? '1' : '0', tst: TST ? '1' : '' };
  /* אותו תוכן — אותו op (ניסיון חוזר לא יוצר שורה). תוכן אחר — op חדש. */
  var sig = JSON.stringify(f);
  if (!OP || sig !== SIG) { OP = rid(24); SIG = sig; }
  BUSY = true;
  $('go').disabled = true; $('go').textContent = UI.chnSending;
  $('re').disabled = true; $('re').textContent = UI.chnSending;
  attempt(f).then(function (o) { return o || attempt(f); })
    .then(function (o) {
      if (o) done(o);
      else fail();
    }, fail);
}
$('f').onsubmit = function (ev) { ev.preventDefault(); send(); };
$('re').onclick = send;

load();
</script>
</body>
