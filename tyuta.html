<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F1E6">
<link rel="icon" href="icon-192.png">
<title>הדף השבועי</title>
<!-- ============================================================
     מה שמור במכשיר הזה מהפירוש לנוער — קריאה בלבד.
     ============================================================
     כל הקלדה בפירוש לנוער נשמרת קודם בדפדפן (`df:ownDraft`), ורק
     אחר כך בגיליון. כשהשמירה לגיליון נכשלת, הטקסט קיים רק כאן.
     העמוד הזה מציג את כל מה שנשמר כך, עם כפתור העתקה לכל קטע —
     **ואינו משנה ואינו מוחק דבר.** נולד בערב שבו השרת התחיל לדרוש
     סיסמה ודף פתוח מגרסה ישנה איבד שעה וחצי של כתיבה.

     אינו מקושר משום מקום, כמו /reset. הנוסח כאן הוא כלי חירום של
     הרכז ולא מסך למשתמשים.
     ============================================================ -->
<style>
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold-t:#8C681F;
  --paper:#F6F1E6; --surface:#FFFDF8; --sunk:#EFE6D3;
  --ink:#1B2A45; --ink-2:#5A6780; --rule:#E5DAC3;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.6;padding-bottom:34px}
.masthead{display:flex;align-items:center;gap:13px;padding:18px 14px 20px;
  max-width:44rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);margin-top:3px}
.wrap{max-width:44rem;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;
  padding:16px;margin-top:12px}
.card h2{font-size:1rem;font-weight:800;color:var(--blue-d)}
.card .when{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.card pre{white-space:pre-wrap;font-size:.95rem;margin-top:8px;padding:10px;
  background:var(--sunk);border-radius:10px;font-family:inherit}
.card button{margin-top:10px;padding:8px 14px;border:0;border-radius:10px;
  background:var(--blue);color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap" id="box"></main>

<script src="data.js"></script>
<script src="logo.js"></script>
<script>
function $(id) { return document.getElementById(id); }
(function () { var l = $('hdr-mark'); if (l) l.src = window.LOGO_MARK || ''; })();
$('brand').textContent = 'הדף השבועי · של בני עקיבא';
$('yr').textContent = (window.PROGRAM && PROGRAM.year) || '';

/* HTML של הפירוש → טקסט עם מעברי שורה. DOMParser אינו מריץ דבר. */
function plain(h) {
  h = String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p)>/gi, '\n');
  var d = new DOMParser().parseFromString('<body>' + h + '</body>', 'text/html');
  return (d.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}
function copy(t, b) {
  var done = function () { b.textContent = 'הועתק ✓'; };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { fallback(); });
  else fallback();
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}
var all = {};
try { all = JSON.parse(localStorage.getItem('df:ownDraft') || '{}') || {}; } catch (e) {}
var keys = Object.keys(all).sort(function (a, b) {
  var pa = a.split('|'), pb = b.split('|');
  return pa[0] === pb[0] && pa[1] === pb[1] ? (+pa[2]) - (+pb[2]) : (a < b ? -1 : 1);
});
var box = $('box');
if (!keys.length) {
  box.innerHTML = '<div class="card"><h2>אין במכשיר הזה פירוש שלא נשמר.</h2></div>';
}
keys.forEach(function (k) {
  var d = all[k] || {}, p = k.split('|');
  var txt = (d.pieces || []).map(function (x) {
    return ((d.pieces.length > 1 && x.tag) ? '[' + x.tag + ']\n' : '') + plain(x.text);
  }).join('\n\n');
  var c = document.createElement('div'); c.className = 'card';
  var h = document.createElement('h2');
  h.textContent = 'דף ' + p[1] + ' · קטע ' + p[2] + ' (' + p[0] + ')';
  var w = document.createElement('div'); w.className = 'when';
  w.textContent = d.at ? 'נכתב: ' + new Date(d.at).toLocaleString('he-IL') : '';
  var pre = document.createElement('pre'); pre.textContent = txt || '(ריק)';
  var b = document.createElement('button'); b.textContent = 'העתקה';
  b.onclick = function () { copy(txt, b); };
  c.appendChild(h); c.appendChild(w); c.appendChild(pre); c.appendChild(b);
  box.appendChild(c);
});
</script>
</body>
</html>
