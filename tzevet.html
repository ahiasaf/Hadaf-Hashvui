<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לצוות · הדף השבועי של בני עקיבא</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0B2550">
<style>
/* ============================================================
   עמוד הנחיתה לצוות · /tzevet?inst=<קוד>&k=<קוד גישה>
   ============================================================
   נשלח לר"מים ולראשי חטיבות, קישור אחד לכל מוסד. אינו נשלח
   לתלמידים — ולכן הוא מכיל גם את הלוח.

   **הוא אינו מתחרה במסך ההצטרפות.** שם התפקיד הוא להרשים
   ולהירשם, וכאן התפקיד להסביר ולצייד: מה זה, מה עושים איתו,
   ולמי זה טוב. שני קהלים, שתי מטרות, שני עמודים.

   הסדר, והוא לא מקרי
   ------------------
   הבאנר החי יושב **גבוה**, מיד אחרי הכותרת, ומתוכו נפתח הדף
   בהקשה אחת. זו כל הנקודה: העמוד הזה אינו מתאר את הדף אלא
   פותח אותו, ולכן ר"ם יכול להקרין אותו בכיתה ולהתחיל ללמד
   מכאן. אחריו הבקשה, ורק אז הנימוקים.

   מה מגיע מאיפה
   -------------
   * הבאנר — `stage.js`, אותו קובץ שבונה אותו במסך הראשי
     ובמסך ההצטרפות. אין כאן עותק שני של החישוב.
   * המלל — `data.js` (TZEVET) דרך שלוש השכבות של textedit.js,
     כלומר הרכז עורך אותו מהניהול בלי גרסה חדשה.
   * המספר "כבר X הצטרפו" — הלשונית הציבורית `מונים`. מספר
     בלבד; שום שם אינו יוצא מהגיליון הסגור אל העמוד הזה.

   **הצורה של הבאנר מועתקת לכאן, וזה עותק שלישי** (index,
   join, ואני). אין שלב בנייה ואין גיליון סגנון משותף, ולכן
   מי שנוגע בבאנר באחד מהם — שיבדוק בשלושתם. שווה לאחד את
   זה לקובץ אחד ביום שאין דדליין.
   ============================================================ */
:root{
  --blue:#17468F; --blue-d:#0B2550; --blue-l:#3574CE; --cyan:#29ABE2;
  --green:#6FA83B; --green-d:#467B1A; --green-2:#3A6615;
  --gold:#C08F2B; --gold-l:#E5B854; --gold-t:#8C681F;
  --paper:#F6F1E6; --surface:#FFFDF8; --surface-2:#F7F1E4; --sunk:#EFE6D3;
  --rule-2:#EFE7D7;
  --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#5C687E; --rule:#E5DAC3;
  --r:16px; --r-s:12px;
  --sh-1:0 1px 2px rgba(37,29,12,.05), 0 2px 8px rgba(37,29,12,.05);
  --sh-2:0 2px 4px rgba(37,29,12,.06), 0 10px 26px rgba(37,29,12,.08);
  --sh-3:0 10px 40px rgba(11,37,80,.20);
}
*{box-sizing:border-box}
img:not([src]){visibility:hidden}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:34rem;margin:0 auto;padding:0 18px}

/* ---------- הראש ----------
   הכותרת יושבת על גרדיאנט כהה, והתוכן שמתחתיה עולה עליו
   בשוליים שליליים. זה מה שגורם לבאנר להיראות כמו כרטיס
   שיוצא מתוך הראש ולא כמו עוד קופסה מתחתיו. */
header{background:radial-gradient(120% 100% at 80% 0%,#2C63B6 0%,
    var(--blue) 38%,var(--blue-d) 82%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 26px) 18px 30px;
  text-align:center}
/* אותה חתימה שיש בעמוד הראשי ובמסך ההצטרפות: הסמל בעיגול
   לבן, ולצידו שם התוכנית והשנה. זה הפנים של התוכנית, ואין
   סיבה שמסך אחד ייראה אחרת מהשני — רק שכאן היא יושבת על
   הכהה, ולכן הכיתוב לבן. */
.masthead{display:flex;align-items:center;justify-content:center;gap:13px;
  margin-bottom:20px}
.masthead .m{width:54px;height:54px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.28)}
.masthead .m img{width:35px;height:35px;display:block;object-fit:contain}
.masthead .t{text-align:start}
.masthead b{display:block;font-size:1.14rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:#fff}
.masthead .yr{display:block;font-size:.74rem;font-weight:800;color:var(--gold-l);
  letter-spacing:.05em;margin-top:3px}
/* המרווח מתחת לשם הישיבה הוא גם האוויר שמעל הפנייה אחרי
   הגלילה הראשונה — ראו firstScroll. */
header .eyebrow{font-size:.73rem;font-weight:800;letter-spacing:.09em;
  color:var(--gold-l);text-transform:none;margin-bottom:15px}
header h1{margin:0;font-size:1.52rem;font-weight:800;line-height:1.25;
  letter-spacing:-.035em;max-width:22rem;margin-inline:auto}
header .lead{margin:12px auto 0;font-size:.94rem;font-weight:600;
  color:rgba(255,255,255,.82);line-height:1.7;max-width:24rem}

/* שיעור החפיפה נגזר מגובה השורה שמעל הבמה, ולא נבחר לפי
   מראה: היא לבנה, ואם היא גולשת מהאזור הכהה היא יושבת לבן
   על קרם. השוליים השליליים חייבים להיות גדולים ממנה. */
/* `main.wrap` ולא `main`: ל-`.wrap` יש `margin:0 auto`, והוא
   ספציפי יותר מסלקטור אלמנט — כלומר `main{margin-top}` נדרס
   בשקט, החפיפה לא חלה, והשורה הלבנה נחתה על הקרם. */
main.wrap{padding-bottom:46px}

/* ---------- הבמה — הצורה, מועתקת מ-join.html ---------- */
.stage{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 18px;
  color:#fff;box-shadow:var(--sh-3);
  background:radial-gradient(130% 105% at 78% -10%,#2C63B6 0%,var(--blue) 34%,var(--blue-d) 78%)}
.stage .g{position:absolute;border-radius:50%}
.stage .g1{left:-70px;bottom:-90px;width:210px;height:210px;background:var(--green);opacity:.22}
.stage .g2{left:52px;bottom:-120px;width:190px;height:190px;background:var(--cyan);opacity:.14}
.stage>*{position:relative}
.stage .eyebrow{display:flex;align-items:center;gap:9px;font-size:.7rem;font-weight:800;
  letter-spacing:.08em;color:var(--gold-l)}
.stage .eyebrow s{flex:1;height:1px;background:rgba(255,255,255,.16);text-decoration:none}
.stage h2{font-size:1.42rem;font-weight:800;line-height:1.15;letter-spacing:-.04em;
  margin:10px 0 0}
.stage .meta{font-size:.85rem;opacity:.72;font-weight:700;margin-top:7px}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:13px;
  background:rgba(0,0,0,.22);padding:4px;border-radius:13px}
.pick{border:none;background:none;color:rgba(255,255,255,.62);cursor:pointer;
  font-family:inherit;font-size:.86rem;font-weight:800;padding:10px 6px;
  border-radius:10px}
.pick.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.showcase{margin:13px -2px 0;perspective:1100px}
.showcase .frame{border-radius:14px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.42);
  transform:rotateX(7deg) scale(.985);transform-origin:top center;cursor:pointer;
  transition:transform .18s}
.showcase .frame:active{transform:rotateX(0deg) scale(.99)}
.showcase img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.showcase .empty{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);font-weight:700;
  font-size:.88rem}
.stage .acts{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:16px}
.stage .acts button{border:none;border-radius:13px;padding:15px;font-weight:800;
  font-size:.95rem;font-family:inherit;cursor:pointer;transition:transform .12s}
.stage .acts .go{background:#fff;color:var(--blue-d);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.stage .acts .alt{background:rgba(255,255,255,.14);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.stage .acts button:active{transform:scale(.98)}

/* השורה שמעל הבמה — לבנה על הכהה, ולכן היא יושבת בתוך main
   אבל עדיין על רקע הראש. */
/* הכיתוב שמעל הבאנר. הבאנר ירד אל תוך המשימה ויושב על הקרם,
   ולכן הכיתוב אינו לבן עוד. שני השדות ריקים כברירת מחדל. */
.demo-cap{text-align:center;margin:0 0 10px}
.demo-cap b{display:block;font-size:1rem;font-weight:800;letter-spacing:-.02em;
  color:var(--blue-d)}
.demo-cap span{display:block;font-size:.84rem;font-weight:600;
  color:var(--ink-2);margin-top:3px}

/* ---------- חלון ההדגמה ----------
   הדף האינטראקטיבי האמיתי, רץ בתוך חלון. לא סרטון ולא עותק
   שני: מה שיתוקן שם יתוקן גם כאן, ואין שני דברים שנפרדים זה
   מזה עם הזמן.

   **והוא פתוח מהרגע הראשון.** קודם הוא היה מוסתר וממתין —
   תחילה מאחורי מלבן כחול עם משפט, ואחר כך שקוף — ובשני המקרים
   הפגישה הראשונה עם המסך הייתה שטח ריק. עכשיו הוא פשוט שם:
   הדף האינטראקטיבי נטען לעיני מי שמסתכל, עם מסך הטעינה שלו
   עצמו, ומתחיל לנגן ברגע שהוא מוכן. אין המתנה שצריך למלא. */
.demo{position:relative;border-radius:var(--r);overflow:hidden;
  box-shadow:0 16px 38px rgba(11,37,80,.3)}
.demo .df{display:block;width:100%;height:470px;border:0}
@media (min-height:780px){ .demo .df{height:540px} }
/* כל החלון הוא הכפתור */
.demo .dtap{position:absolute;inset:0;z-index:3;cursor:pointer}
/* השורה שמעל ההדגמה. היא גם מכינה את מי שמסתכל להבין מה הוא
   רואה, וגם מפרידה בין הכחול של הכותרת לכחול של הדף שבחלון —
   שני כחולים שנגעו זה בזה נראו כמו תקלת ציור. */
.meet{margin:22px 0 16px;text-align:center;font-size:.97rem;
  font-weight:700;line-height:1.7;color:var(--ink-2)}
/* וגם כשהיא רוקנה, הרווח נשמר */
.meet[hidden] + .demo{margin-top:26px}

/* ---------- קטעים ---------- */
section{margin-top:30px}
h2.sec{font-size:1.12rem;font-weight:800;letter-spacing:-.03em;
  color:var(--blue-d);margin:0 0 14px}

/* ---------- המשימה ----------
   קודם היא הייתה כרטיס, כדי שתשקול יותר מהסיפור שמתחתיה.
   עכשיו היא נושאת בתוכה את הבאנר ואת הקישור — כלומר את שני
   הגושים הגדולים בעמוד — ומסגרת כבר אינה מה שנותן לה משקל.

   נדלקת לרגע למי שחזר לכאן מההדגמה, כדי שיֵדע לאן הגיע. */
/* אוויר מעל, כשגוללים לכאן. בלעדיו שורת היעד נצמדת לקצה
   העליון של המסך ונראית כאילו נחתכה. */
#howto{transition:box-shadow .5s ease;border-radius:var(--r);
  scroll-margin-top:18px}
/* והכלי האחרון סוגר את המשימה — הרווח שאחריו הוא זה של הקטע
   הבא, ולא שניהם יחד. */
#howto .tool.end{padding-bottom:0}
#howto.lit{box-shadow:0 0 0 4px rgba(229,184,84,.5)}

/* השלבים. מספר בעיגול זהב, וקו שמחבר ביניהם — כדי שייקרא
   כרצף ולא כשלוש עצות נפרדות. */
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative;padding-inline-start:46px;padding-bottom:16px;
  font-size:1.02rem;font-weight:700;color:var(--ink);line-height:1.6}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:attr(data-n);position:absolute;inset-inline-start:0;top:0;
  width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:.88rem;box-shadow:0 3px 10px rgba(192,143,43,.35)}
.steps li::after{content:"";position:absolute;inset-inline-start:14.5px;top:32px;
  bottom:2px;width:2px;background:var(--rule)}
.steps li:last-child::after{display:none}
/* ...אלא כשהרשימה נמשכת מעבר לכלי שאחריה. הקו חייב לעבור
   דרך הבאנר, אחרת הוא נראה כקטע חדש ולא כשלב במשימה. */
#steps-a li:last-child::after{display:block}

/* ---------- הכלי של השלב ----------
   בהזחה של טקסט השלבים, והקו ממשיך דרכו. כך "לפתוח את הדף
   בכיתה" והבאנר שפותח אותו הם דבר אחד, ולא הנחיה וקישוט. */
.tool{position:relative;padding-inline-start:46px;padding-bottom:16px}
.tool::after{content:"";position:absolute;inset-inline-start:14.5px;
  top:0;bottom:0;width:2px;background:var(--rule)}
/* האחרון סוגר את הרצף: הקו נוגע בו ונעצר. */
.tool.end::after{bottom:auto;height:14px}
.steps-foot{margin:16px 0 0;font-size:.97rem;font-weight:800;color:var(--blue-d)}
/* שורת היעד. יושבת מעל השאלה ולא לצידה: קודם לאן הולכים,
   ואז איך — כך שלוש הפעולות שמתחת אינן רשימה אלא דרך. */
.goal{margin:0 0 10px;font-size:1.04rem;font-weight:800;letter-spacing:-.02em;
  color:var(--ink);background:rgba(192,143,43,.11);border-radius:var(--r-s);
  padding:13px 15px;line-height:1.6}

/* הסיפור. פס זהב בצד שממנו מתחילים לקרוא, בלי מסגרת מלאה —
   הוא ציטוט של מה שקרה, לא כרטיס נוסף. */
.story{border-inline-start:3px solid var(--gold);padding-inline-start:15px;
  margin-top:6px}
.story h3{margin:0 0 5px;font-size:.78rem;font-weight:800;letter-spacing:.07em;
  color:var(--gold-t)}
/* קטן ובהיר מההנחיות, ובכוונה: הוא מלווה אותן ואינו מתחרה
   בהן. קודם הוא היה גדול וכהה מהן, והעין נחתה עליו ראשונה. */
.story p{margin:0;font-size:.92rem;font-weight:600;color:var(--ink-2);
  line-height:1.85}
.story p b{font-weight:800;color:var(--ink)}

/* שלושת הקהלים. עיגול צבעוני לאייקון — אותו קו של דרכי
   הלימוד במסך ההצטרפות, ולא אמוג'י. */
.who{display:grid;gap:11px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 17px;box-shadow:var(--sh-1);display:flex;gap:13px;align-items:flex-start}
.card .ic{flex:0 0 auto;width:40px;height:40px;border-radius:50%;
  background:var(--c);display:flex;align-items:center;justify-content:center}
.card .ic svg{width:21px;height:21px;fill:#fff}
.card h3{margin:0;font-size:.98rem;font-weight:800;color:var(--blue-d);
  letter-spacing:-.02em}
.card p{margin:4px 0 0;font-size:.9rem;font-weight:600;color:var(--ink-2);
  line-height:1.7}

/* המספר. פס שקט ולא כרטיס — הוא עובדה, לא הכרזה. */
.peers{margin-top:14px;text-align:center;font-size:.94rem;font-weight:800;
  color:var(--green-d);background:rgba(111,168,59,.09);
  border-radius:var(--r-s);padding:11px 14px}

/* שני הקישורים. ירוק לתלמידים, כחול ללוח — אותה הבחנה בצבע
   שיש בניהול, כדי שמי שמכיר אחד יזהה גם את השני. */
.link{border-radius:var(--r);padding:17px 18px;margin-top:11px;
  box-shadow:var(--sh-2)}
.link.kids{background:linear-gradient(150deg,#F2F7EB,#E8F1DC);
  border:1px solid #CFE0B6}
.link.board{background:linear-gradient(150deg,#EDF2FA,#DFE9F7);
  border:1px solid #C4D5EC}
.link h3{margin:0;font-size:1rem;font-weight:800;letter-spacing:-.02em}
.link.kids h3{color:var(--green-2)}
.link.board h3{color:var(--blue-d)}
.link p{margin:5px 0 0;font-size:.89rem;font-weight:600;color:var(--ink-2);
  line-height:1.7}
.url{margin-top:11px;background:rgba(255,255,255,.72);border-radius:10px;
  padding:9px 11px;font-size:.78rem;font-weight:700;color:var(--ink-2);
  direction:ltr;text-align:start;word-break:break-all;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:8px;margin-top:11px}
/* ---------- הכתובת והקוד ----------
   הקוד בריבוע לבן משלו, בגודל שנסרק מהמסך ומהמקרן כאחד. הוא
   נוצר כאן ולא בשירות חיצוני — ראו qr.js — ולכן הכתובת אינה
   יוצאת לשום מקום בדרך. */
/* ---------- שלוש הדרכים לקישור ----------
   באותו מעמד ובאותה צורה: אריח לבן, סימן, ומילה. כך אף אחת
   מהן אינה נראית כמו "הדרך האמיתית" והשתיים האחרות כהערות.

   הכתובת עצמה ירדה: היא ארוכה, איש אינו מקליד אותה, ושלוש
   הדרכים עושות בדיוק את מה שהיא נועדה לו. */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  margin-top:13px;align-items:stretch}
.opt{display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;text-align:center;
  background:#fff;border:1px solid #CFE0B6;border-radius:12px;
  padding:10px 6px;box-shadow:var(--sh-1);min-height:112px}
.opt span{font-size:.74rem;font-weight:800;color:var(--ink-2);line-height:1.3}
.opt .qb{width:100%}
.opt.go{text-decoration:none;cursor:pointer}
.opt.go svg{width:30px;height:30px;display:block}
.opt.wa svg{fill:#25D366}
.opt.ml svg{fill:var(--blue)}
.opt.go:active{transform:scale(.97)}
/* בצר מאוד — שתי שורות, והקוד תופס את הרוחב */
@media (max-width:339px){
  .opts{grid-template-columns:1fr 1fr}
  .opt.qr{grid-column:1 / -1}
  .opt.qr .qb{max-width:150px;margin:0 auto}
}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-weight:800;
  font-size:.92rem;font-family:inherit;cursor:pointer;text-align:center;
  text-decoration:none;display:block;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.g{background:var(--green-d);color:#fff;box-shadow:0 5px 16px rgba(70,123,26,.28)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 5px 16px rgba(23,70,143,.26)}
.btn.ghost{flex:0 0 auto;background:rgba(255,255,255,.85);color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--rule)}

/* ---------- הלוח המקוצר ----------
   אותו כרטיס שמופיע בעמוד הראשי לישיבה שהצטרפה, וכאן הוא
   מראה לר"ם מראש מה יופיע לו מול העיניים ברגע שתלמיד נרשם.

   **הצורה מועתקת מ-index.html, וזה עותק שני.** הנוסח לפחות
   אינו מועתק — הוא נקרא מאותם שדות מלל (UI.cb*), ולכן שינוי
   מילה בניהול משנה את שני המקומות. מי שנוגע כאן — שיבדוק גם
   בעמוד הראשי. */
.brd{background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);
  border-radius:var(--r);padding:20px 18px 18px;box-shadow:var(--sh-2);
  border-top:3px solid var(--gold);margin-top:11px}
.brd-hero{text-align:center}
.brd-hero b{display:block;font-size:2.4rem;font-weight:800;line-height:1;
  letter-spacing:-.05em;color:var(--gold)}
.brd-hero b small{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;
  color:var(--ink);margin-inline-start:7px}
.brd-hero span{display:block;font-size:.95rem;font-weight:700;color:var(--ink-2);
  margin-top:7px;line-height:1.5}
.brd-hero p{font-size:.85rem;font-weight:600;color:var(--ink-3);
  margin:9px 0 0;line-height:1.7}
.brd-bar{margin-top:17px;padding-top:16px;border-top:1px solid var(--rule-2)}
.brd-bar .t{height:12px;border-radius:12px;background:var(--sunk);overflow:hidden}
.brd-bar .t i{display:block;height:100%;border-radius:12px;
  background:linear-gradient(90deg,var(--green),var(--green-d))}
.brd-bar span{display:block;font-size:.88rem;font-weight:800;color:var(--ink);
  margin-top:9px;text-align:center}
.brd-first{display:flex;align-items:center;gap:13px;justify-content:center}
.brd-first .dot{flex:none;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;font-weight:800;color:#fff;
  background:linear-gradient(150deg,var(--blue-l),var(--blue));
  box-shadow:0 0 0 5px rgba(23,70,143,.12),var(--sh-1)}
.brd-first b{display:block;font-size:.96rem;font-weight:800;line-height:1.35;
  text-align:start}
.brd-first>div>span{display:block;margin-top:2px;font-size:.79rem;font-weight:700;
  color:var(--ink-3);text-align:start}
/* הכותרת. בלעדיה הכרטיס נקרא כמספרים ולא כלוח — וצילום מסך
   שלו לבדו אינו אומר של מי הוא. */
.brd-head{text-align:center;padding-bottom:14px;margin-bottom:16px;
  border-bottom:1px solid var(--rule-2)}
.brd-head b{display:block;font-size:1.06rem;font-weight:800;letter-spacing:-.03em;
  color:var(--blue-d)}
.brd-head span{display:block;margin-top:2px;font-size:.83rem;font-weight:800;
  color:var(--gold-t)}
/* ---------- הלוח לפני שהצטרף מישהו ----------
   לא תיבה ריקה ולא מספרים מומצאים: **הצורה האמיתית של הלוח,
   בלי תוכן.** המקפים במקום המספרים הם מה שהופך אותו להדגמה
   ולא להבטחה — ר"ם רואה בדיוק מה יופיע לו, ואף נתון לא נטען.

   לוח לדוגמה עם מספרים היה נראה משכנע יותר ליום אחד, ועולה
   באמון ביום שהמספר האמיתי מגיע ונמוך ממנו. */
/* השלד. **רק המספר** מעומעם — שורת השבוע אמיתית כבר עכשיו,
   ואין סיבה להחוויר אותה רק כדי שהכל ייראה אחיד. */
.brd.skel .brd-hero b{opacity:.5}
.skel-tag{display:block;text-align:center;font-size:.72rem;font-weight:800;
  letter-spacing:.09em;color:var(--gold-t);margin:-6px 0 12px}
/* המקום שבו יעמוד המספר. **עיגול ולא מקף**: מקף נקרא כמחיקה —
   כמו משהו שהיה ואיננו — ועיגול ריק נקרא כמקום שממתין. */
.brd-hero b .hole{display:inline-block;width:38px;height:38px;border-radius:50%;
  border:3px solid var(--gold-l);vertical-align:-4px}
.brd .btn{margin-top:16px;
  background:linear-gradient(140deg,var(--blue-l),var(--blue));color:#fff}
.brd-note{margin:11px 0 0;font-size:.77rem;font-weight:700;color:var(--ink-3);
  text-align:center}

hr{border:0;border-top:1px solid var(--rule);margin:34px 0 0}
footer{text-align:center;color:var(--ink-3);font-size:.82rem;font-weight:600;
  margin-top:18px;line-height:1.9;padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
footer a{color:var(--ink-2);font-weight:800}

/* טבעת מיקוד דו־גונית — אין צבע יחיד שעובר 3:1 גם על הקרם
   וגם על הנייבי. a11y.js מוסיף את אותה טבעת בשאר העמודים. */
:focus-visible{outline:3px solid #fff;outline-offset:0;
  box-shadow:0 0 0 6px var(--blue-d)}

@media (prefers-reduced-motion:reduce){
  .showcase .frame,.btn,.stage .acts button{transition:none}
}

/* ============================================================
   הפנייה האישית לר"ם.
   ============================================================
   פס מרחף ולא כרטיס בעמוד. כרטיס נקרא כמו עוד סעיף שאפשר
   לדלג עליו, ופנייה אישית שנקראת כסעיף אינה נענית. הוא מופיע
   רק אחרי שההדגמה נגללה — קודם רואים מה בנינו, ואז מבקשים.
   ============================================================ */
/* שורה אחת וחץ. לא כרטיס, לא פס, ולא רוחב מלא — מה שיש
   לומר נאמר במסך שנפתח. הזהב הבהיר הוא הזמנה; הכחול הכבד
   של האפליקציה הוא הכרזה, וזו בקשה. */
.askrow{display:flex;align-items:center;gap:12px;width:auto;
  margin:0 auto;padding:15px 18px;border:1px solid rgba(192,143,43,.4);
  border-radius:999px;background:linear-gradient(135deg,#FDF6E6,#FAF0DA);
  color:var(--ink);font-family:inherit;font-size:1rem;font-weight:800;
  letter-spacing:-.02em;cursor:pointer;
  box-shadow:0 2px 10px rgba(192,143,43,.16)}
.askrow .ar-go{flex:0 0 auto;width:32px;height:32px;border-radius:50%;
  background:var(--gold);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:1.05rem;font-weight:800;line-height:1}
#ask-sec{text-align:center}

/* המסך שנפתח. מסך מלא ולא חלונית: בקשה שמציצה מעל תוכן אחר
   מתחרה בו, ומה שנאמר כאן אינו יכול להיקרא בחצי עין. */
.asksheet{position:fixed;inset:0;z-index:70;background:var(--paper);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:asIn .3s ease both}
@keyframes asIn{from{opacity:0}to{opacity:1}}
.as-in{max-width:520px;margin-inline:auto;padding:56px 18px 48px;
  position:relative}
.as-head{display:flex;align-items:center;gap:11px;margin:0 0 22px;
  justify-content:center}
.as-head .m{flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.as-head .m img{width:34px;height:34px;object-fit:contain;display:block}
.as-head b{display:block;font-size:.98rem;font-weight:800;line-height:1.25;
  letter-spacing:-.02em;color:var(--blue-d)}
.as-head .yr{display:block;font-size:.72rem;font-weight:800;
  color:var(--gold-t);margin-top:3px}
.as-x{position:absolute;inset-inline-end:14px;top:12px;width:38px;height:38px;
  border:0;border-radius:50%;background:var(--sunk);color:var(--ink-2);
  font-size:1rem;font-weight:800;font-family:inherit;cursor:pointer}

/* שלושת השלבים — אותן מידות בדיוק של מסך התלמיד. הן נבדקו
   מול אנשים ועבדו, ואין סיבה שר"ם יקבל משהו צפוף יותר. */
.as-body{font-size:16px;line-height:1.7;color:var(--ink)}
.as-bar{display:flex;align-items:center;gap:7px;justify-content:center;
  margin:0 0 20px}
.as-bar i{width:34px;height:5px;border-radius:3px;background:var(--rule)}
.as-bar i.on{background:var(--gold)}
.as-bar i.did{background:var(--green)}
.as-done{display:flex;align-items:center;gap:10px;padding:13px 18px;
  margin-bottom:10px;background:rgba(74,130,28,.09);
  border:1px solid rgba(74,130,28,.3);border-radius:12px;
  font-size:.92rem;font-weight:700;color:var(--green-2)}
.as-done b{font-size:1.05rem}
.as-card{background:var(--surface);border:2px solid var(--gold);
  border-radius:16px;padding:24px 22px 26px;
  box-shadow:0 8px 26px rgba(11,37,80,.12)}
.as-card.fin{text-align:center}
.as-kick{font-size:.78rem;font-weight:800;color:var(--gold);
  letter-spacing:.04em;margin-bottom:7px}
.as-card h2{margin:0;font-size:1.16rem;font-weight:800;
  letter-spacing:-.02em;line-height:1.45}
.as-card > p{margin:11px 0 0;font-size:.95rem;color:var(--ink-2);
  line-height:1.75;font-weight:600}
.as-card .fld{margin-top:18px}
.as-card .label{display:block;font-size:.9rem;font-weight:800;
  color:var(--ink);margin-bottom:6px}
.as-card .label i{font-style:normal;font-weight:600;color:var(--ink-3)}
.as-card input,.as-card select{width:100%;padding:15px;font-family:inherit;
  font-size:1.02rem;font-weight:700;border:1.5px solid var(--rule);
  border-radius:12px;background:#fff;color:var(--ink)}
.as-card .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.as-card .hint{margin-top:7px;font-size:.83rem;font-weight:600;
  color:var(--ink-3);line-height:1.6}
.as-go{display:block;width:100%;margin-top:20px;padding:16px;border:0;
  border-radius:12px;background:var(--blue);color:#fff;font-family:inherit;
  font-weight:800;font-size:1.02rem;cursor:pointer}
.as-go.g{background:var(--green-d)}
.as-thin{display:block;width:100%;margin-top:10px;padding:12px 6px;border:0;
  background:none;color:var(--ink-2);font-family:inherit;font-size:.9rem;
  font-weight:700;text-decoration:underline;cursor:pointer;line-height:1.6}
.as-err{margin-top:14px;background:#F7E4E2;border:1px solid #E2BDB8;
  border-radius:12px;padding:13px 15px;font-size:.88rem;font-weight:700;
  color:#7E2C23;line-height:1.7}
.as-v{width:64px;height:64px;border-radius:50%;background:var(--green-d);
  color:#fff;font-size:2rem;line-height:64px;margin:0 auto 16px;
  font-weight:800;text-align:center}
/* הסמלים וההוראות מגיעים מ-getapp.js, וצריכים את הסגנון שלהם. */
.gsteps{margin:20px 0 0;padding:0;list-style:none;counter-reset:gs}
.gsteps li{counter-increment:gs;position:relative;padding-inline-start:38px;
  margin-bottom:16px;font-size:.97rem;font-weight:600;line-height:1.8}
.gsteps li:last-child{margin-bottom:0}
.gsteps li::before{content:counter(gs);position:absolute;inset-inline-start:0;
  top:3px;width:26px;height:26px;border-radius:50%;background:var(--blue);
  color:#fff;font-size:.82rem;font-weight:800;display:flex;
  align-items:center;justify-content:center}
.gl{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:8px;background:var(--sunk);
  border:1px solid var(--rule);vertical-align:-9px;margin:0 4px}
.gl svg{width:17px;height:17px;fill:none;stroke:var(--blue);
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.apic{margin-top:16px;display:flex;flex-direction:column;align-items:center;
  gap:7px}
.apic img{width:56px;height:56px;border-radius:14px;display:block;
  box-shadow:0 4px 14px rgba(11,37,80,.22)}
.apic span{font-size:.72rem;font-weight:800;color:var(--ink-2)}
/* הלוח: מי הם התלמידים האלה */
/* במרכז ולא נצמד לימין: הוא יושב מתחת לתוכן ממורכז, וקישור
   שנתלה בפינה נראה כמו שריד ולא כמו המשך. */
.brd-more{display:flex;align-items:center;justify-content:center;gap:7px;
  width:-moz-fit-content;width:fit-content;margin:16px auto 0;
  padding:9px 4px;color:var(--blue);font-size:.9rem;font-weight:800;
  text-decoration:none;border-bottom:1.5px solid rgba(23,70,143,.25)}
.brd-more span{font-size:.95rem;line-height:1}

.brd-head .ram{display:block;font-size:.8rem;font-weight:700;
  color:var(--gold-t);margin-top:2px}
</style>
</head>
<body>

<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div class="t"><b>הדף השבועי<br>של בני עקיבא</b>
      <span class="yr">שנת תשפ״ז</span></div>
  </div>
  <div class="eyebrow" id="inst-name"></div>
  <h1 id="t-h1"></h1>
  <p class="lead" id="t-lead"></p>
</header>

<main class="wrap">

  <!-- ההדגמה. הדבר הראשון בעמוד, והיא מתחילה לבד.
       ר"ם עסוק אינו לוחץ על כפתורים — וכל עוד ההדגמה ישבה
       מאחורי לחיצה, מי שהגיע אליה כבר ממילא היה משוכנע.

       המקום שלה שמור מהרגע הראשון והוא ריק, בצבע הרקע. אין בו
       כיסוי ואין בו משפט שמסביר מה עומד לקרות: הדף פשוט עולה
       מתוך הרקע אחרי כמה שניות, וזה מה שתופס את העין. -->
  <p class="meet" id="t-demoNote"></p>
  <div class="demo" id="demo">
    <iframe class="df" id="demo-frame" title="הדגמה" scrolling="no"></iframe>
    <!-- שכבה שקופה מעל הכל: נגיעה בחלון פותחת את הדף האמיתי
         במסך מלא, ולא מפעילה כפתור זעיר שבתוכו. -->
    <div class="dtap" id="demo-tap"></div>
  </div>

  <!-- ============================================================
       המשימה.
       ============================================================
       כל שלב והכלי שמבצע אותו מיד אחריו: אחרי "לפתוח בכיתה"
       ו"ללמוד עמוד" — הבאנר שפותח את הדף; ואחרי "לשלוח לקבוצה"
       — הקישור עצמו. קודם השלבים ישבו יחד והכלים היו פזורים
       בעמוד, ומי שקרא "לשלוח את הקישור" היה צריך לחפש אותו.

       הקו הזהוב ממשיך דרך הכלים, ולכן הכל נקרא כמשימה אחת
       ולא כשלושה קטעים. -->
  <section id="howto">
    <p class="goal" id="t-goalH"></p>
    <h2 class="sec" id="t-stepsH"></h2>
    <ol class="steps" id="steps-a"></ol>

    <div class="tool">
      <p class="demo-cap" id="demo-cap"><b id="t-demoH"></b><span id="t-demoSub"></span></p>
      <div id="stage"></div>
    </div>

    <ol class="steps" id="steps-b"></ol>

    <div class="tool end">
      <div class="link kids">
        <h3 id="t-kidsH"></h3>
        <p id="t-kidsTxt"></p>
        <!-- שלוש דרכים לאותו מקום, ובאותו מעמד: סורקים מהמסך,
             שולחים בוואטסאפ, או שולחים במייל. הכתובת עצמה אינה
             מוצגת — היא ארוכה, איש אינו מקליד אותה, ושלוש
             הדרכים כבר עושות את מה שהיא נועדה לו. -->
        <div class="opts">
          <div class="opt qr" id="kids-qr" hidden>
            <div class="qb" id="kids-qr-box"></div>
            <span id="t-qrCap"></span>
          </div>
          <a class="opt go wa" id="kids-wa" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.15a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 4.54 0 8.23 3.69 8.23 8.23s-3.69 8.24-8.23 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.8-.79.97-.14.16-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.44.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.47c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.88 2.35 1 2.51c.12.17 1.72 2.63 4.17 3.69.58.25 1.04.4 1.39.51.59.19 1.12.16 1.54.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg>
            <span id="t-waBtn"></span>
          </a>
          <a class="opt go ml" id="kids-mail">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v.4l8 4.85 8-4.85V7H4zm16 10V9.7l-7.48 4.53a1 1 0 0 1-1.04 0L4 9.7V17h16z"/></svg>
            <span id="t-mailBtn"></span>
          </a>
        </div>
      </div>
    </div>

    <p class="steps-foot" id="t-stepsFoot"></p>
  </section>

  <!-- ריק ב-whoH = הפרק אינו מוצג, וזו ברירת המחדל. הוא
       נשאר במסמך כדי שמילוי הנוסח בניהול יחזיר אותו — הבטחה
       שאי אפשר לקיים כשה-HTML נמחק. -->
  <section id="who-sec" hidden>
    <h2 class="sec" id="t-whoH"></h2>
    <div class="who" id="who"></div>
  </section>

  <!-- ============================================================
       הבקשה האישית — כאן, ולא מרחפת.
       ============================================================
       פס מרחף הוא אוצר המילים של באנרים: הוא נדחף מעל תוכן,
       ולכן הוא מתנגש בכל מקום שיושם בו. כאן הוא אינו נדחף —
       הוא השורה הבאה ברצף.

       והרגע נכון: הר"ם בדיוק סיים לקרוא מה לעשות ולשלוח את
       הקישור. "ועוד בקשה אישית" אחרי משימה שהסתיימה נקראת
       כהמשך, לא כהפרעה.

       שורה אחת וחץ, בלי כרטיס ובלי פסקה: מה שיש לומר נאמר
       במסך שנפתח, ולא כאן. -->
  <section id="ask-sec">
    <button class="askrow" id="askrow" hidden>
      <span id="ar-t"></span>
      <span class="ar-go" aria-hidden="true">←</span>
    </button>
  </section>

  <!-- הסיפור בא אחרי הבקשה: מי שקרא מה לעשות ומה יקבל עדיין
       שואל "ובאמת עובד?" — והסיפור עונה. -->
  <section id="story-sec">
    <div class="story">
      <h3 id="t-storyH"></h3>
      <p id="t-story"></p>
    </div>
  </section>

  <section>
    <p class="peers" id="peers" hidden></p>

    <!-- **לוח אחד בלבד.** קודם היו כאן שניים — כרטיס כחול
         שהוביל ללוח, ומתחתיו הלוח עצמו — ושניהם דיברו על
         אותו דבר.

         זה הלוח בדיוק כפי שהוא בעמוד הראשי, כולל הכפתור
         הכחול שבתוכו. ההבדל היחיד: כפתור השליחה לתלמידים
         אינו כאן, כי הוא כבר יושב למעלה בתוך המשימה. -->
    <div id="brd"></div>
  </section>

  <hr>
  <footer>
    <span id="t-foot"></span>
    <a id="foot-wa" target="_blank" rel="noopener" hidden></a><br>
    רשת ישיבות בני עקיבא · הדף השבועי · תשפ״ז<br>
    <a href="info.html">פרטים</a> · <a href="accessibility.html">הצהרת נגישות</a>
  </footer>
</main>

<!-- ============================================================
     הפנייה האישית לר"ם.
     ============================================================
     פס מרחף שמופיע אחרי שההדגמה נגללה, ונפתח למסך מלא. הוא
     אינו עוד כרטיס בעמוד: כרטיס נקרא כמו עוד סעיף, ופנייה
     אישית שנקראת כסעיף אינה נענית.

     המסך שנפתח הוא שלושה שלבים — פרטים, התקנה, עדכונים — ולא
     טופס אחד. אותה שפה בדיוק של מסך התלמיד, כי היא זו שעבדה.
     ============================================================ -->
<div class="asksheet" id="asksheet" hidden>
  <div class="as-in">
    <button class="as-x" id="as-x" aria-label="סגירה">✕</button>
    <!-- מסך מלא הוא מסך, ומסך נושא את החתימה של התוכנית:
         הסמל העגול, השם והשנה. פנייה אישית בלי זהות נראית
         כמו חלונית שקפצה, ולא כמו מכתב מהתוכנית. -->
    <div class="as-head">
      <span class="m"><img id="as-mark" alt=""></span>
      <div><b>הדף השבועי<br>של בני עקיבא</b>
        <span class="yr">שנת תשפ״ז</span></div>
    </div>
    <div class="as-body" id="as-body"></div>
  </div>
</div>

<script src="textedit.js"></script>

<script>
/* ============================================================
   הצוות — הלוגיקה.
   ============================================================
   ES5 בלבד, כמו כל השאר.
   ============================================================ */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function qs(k) {
  var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
function tpl(s, o) {
  return String(s || '').replace(/\{(\w+)\}/g, function (m, k) {
    return o[k] == null ? '' : o[k];
  });
}

$('hdr-mark').src = window.LOGO_MARK || '';

/* ---------- המוסד ----------
   מגיע מהקישור. בלעדיו העמוד עדיין עובד — הוא פשוט מדבר
   בכללי, בלי שם ובלי קישורים אישיים. */
/* קוד הגישה ללוח.

   מגיע מהכתובת, ונשמר במכשיר — **אותו מפתח שבו הלוח עצמו
   משתמש**, ולכן מי שפתח פעם אחת את אחד משניהם מחזיק אותו
   לשניהם. בזכות זה הכפתור עובד גם בחזרה מהאפליקציה, שאליה
   הקוד אינו נוסע: כתובת עם קוד גלוי על מקרן בכיתה היא בדיוק
   הדרך שבה קישור הלוח דולף.

   קוד ריק אינו נשמר — אחרת הוא היה דורס קוד תקין שכבר יושב
   על המכשיר. */
var instCode = qs('inst');
var accCode  = qs('k');
function accKey() { return 'boardKey:' + instCode; }
try {
  if (accCode) localStorage.setItem(accKey(), accCode);
  else accCode = localStorage.getItem(accKey()) || '';
} catch (e) {}
/* בעריכת מלל בלי ישיבה בכתובת — נופלים לראשונה ברשימה.

   בלי זה הלוח שבתחתית העמוד אינו מצויר כלל (אין למי לספור),
   ואז אי אפשר להקיש על הנוסח שבתוכו כדי לערוך אותו: מה שאינו
   על המסך אינו ניתן לעריכה במקום. */
if (!instCode && /[?&]tedit=1/.test(location.search) && INSTITUTIONS.length) {
  instCode = INSTITUTIONS[0].code;
}
var instRow  = null;
for (var i = 0; i < INSTITUTIONS.length; i++) {
  if (INSTITUTIONS[i].code === instCode) instRow = INSTITUTIONS[i];
}

/* ============================================================
   הבסיס שממנו נבנים כל הקישורים.
   ============================================================
   `cleanUrls` ב-Vercel מגיש את העמוד בכתובת "/tzevet", בלי
   הסיומת. (ואזהרה למי שעורך: הדגשה בכוכביות סביב נתיב סוגרת
   את ההערה באמצע — הכוכבית והלוכסן הם סוף בלוק.) חיתוך שמחפש `tzevet.html` פשוט לא מצא אותה בייצור,
   הבסיס נשאר `…/tzevet`, וכל שלושת הקישורים יצאו כ-
   `…/tzevetjoin.html` — כלומר 404 על המצגת, על הלוח ועל
   הקישור לתלמידים.

   בסביבת הפיתוח הכתובת כן נגמרת ב-`.html`, ולכן זה עבד שם
   ונשבר רק אצל המשתמש. שתי הצורות מטופלות כאן. */
function base() {
  return location.href.split('#')[0].split('?')[0]
         .replace(/\/tzevet(\.html)?\/?$/, '/');
}
function kidsUrl() {
  return base() + 'join.html' + (instCode ? '?inst=' + encodeURIComponent(instCode) : '');
}
/* הלוח נושא את קוד הגישה כשהוא קיים בכתובת של העמוד הזה.
   בלעדיו הלוח עצמו יבקש אותו — ולכן הכפתור עדיין שווה משהו. */
function boardUrl() {
  var u = base() + 'board.html?inst=' + encodeURIComponent(instCode || '');
  return accCode ? u + '&k=' + encodeURIComponent(accCode) : u;
}

/* ---------- המסלול המוצג ----------
   ברירת המחדל היא מה שהישיבה בחרה בהרשמה, ואם לא בחרה —
   הראשון. הבורר בבמה מאפשר להחליף. */
var track = TRACKS[0].id;
function setTrack(t) { track = t; drawStage(); }

/* ---------- הבמה ----------
   `stage.js` בונה, וכאן רק נקבע מה קורה בלחיצה. */
/* הכפתור הראשי בבאנר פותח את **הדף האמיתי**, נקי.

   קודם הוא פתח שם הדגמה, וזו הייתה טעות: ההדגמה כבר רצה למעלה
   בעמוד הזה, ומי שלחץ "פתיחת הדף" ביקש במפורש את הדבר עצמו —
   ולקבל שם עוד הדגמה זה לקחת ממנו את מה שהוא ביקש.

   `from=tzevet` נשאר: הוא מה שמחזיר את כפתור "יציאה" שבדף
   לכאן, ולא למסך של תלמיד. */
function goDaf() {
  var wk = (typeof LWeek === 'function') ? LWeek() : -1;
  var d  = (typeof LDaf === 'function') ? LDaf(track, wk < 0 ? 0 : wk) : '';
  if (!d) { goApp(); return; }
  location.href = base() + 'learn.html?mas=' + encodeURIComponent(track) +
                  '&daf=' + encodeURIComponent(d) + '&from=tzevet' +
                  (instCode ? '&inst=' + encodeURIComponent(instCode) : '');
}
/* המצגת יושבת במסך הראשי, ומציג המצגות שלה הוא קוד שכבר קיים
   שם. לא משכפלים אותו לכאן בשביל כפתור אחד — הכפתור מוביל
   לשבוע באפליקציה, ושם היא נפתחת. */
function goApp() {
  var wk = (typeof LWeek === 'function') ? LWeek() : -1;
  /* `from=tzevet` הוא מה שמחזיר את כפתור "חזרה" שבאפליקציה
     לכאן ולא למסך ההצטרפות. בלעדיו ר"ם שפתח מצגת היה נופל
     בסוף אל מסך של תלמיד.

     הקוד אינו נוסע איתו — הוא נשמר במכשיר. כתובת עם קוד גלוי
     על מקרן בכיתה היא בדיוק הדרך שבה קישור הלוח דולף. */
  location.href = base() + 'index.html?st=1&from=tzevet' +
    (instCode ? '&inst=' + encodeURIComponent(instCode) : '') +
    '#week=' + track + '-' + ((wk < 0 ? 0 : wk) + 1);
}
function drawStage() {
  $('stage').innerHTML = StageHtml({ track:track, pick:'setTrack',
                                     deck:'goApp', week:'goDaf', trail:'goApp' });
}

/* ---------- שלושת הקהלים ----------
   אותם אייקונים של דרכי הלימוד במסך ההצטרפות — קו עיצובי
   אחד, ולא אמוג'י. */
var IC = {
  ram: '<circle cx="4.4" cy="6.4" r="2.3"/><circle cx="10" cy="5.6" r="2.6"/>' +
       '<circle cx="15.6" cy="6.4" r="2.3"/>' +
       '<path d="M.8 17.2c0-3 4.1-4.9 9.2-4.9s9.2 1.9 9.2 4.9z"/>',
  dad: '<circle cx="5.6" cy="5" r="3"/>' +
       '<path d="M1 17.5c0-3 2-4.8 4.6-4.8s4.6 1.8 4.6 4.8z"/>' +
       '<circle cx="15" cy="8.4" r="2.2"/>' +
       '<path d="M11.4 17.5c0-2.1 1.6-3.5 3.6-3.5s3.6 1.4 3.6 3.5z"/>',
  kid: '<path d="M2.4 4.6c2.5-1.1 5.1-1.1 7.6 0v11.2c-2.5-1.1-5.1-1.1-7.6 0z"/>' +
       '<path d="M17.6 4.6c-2.5-1.1-5.1-1.1-7.6 0v11.2c2.5-1.1 5.1-1.1 7.6 0z"/>'
};
function drawWho() {
  var T = window.TZEVET || {};
  var sec = $('who-sec'), box = $('who');
  if (!box) return;
  /* הכותרת היא המתג: ריקה — אין פרק. */
  if (sec) sec.hidden = !T.whoH;
  if (!T.whoH) { box.innerHTML = ''; return; }
  var rows = [['ram', '#4A821C'], ['dad', '#C08F2B'], ['kid', '#17468F']];
  box.innerHTML = rows.map(function (r) {
    var h = T[r[0] + 'H'], t = T[r[0] + 'Txt'];
    if (!h && !t) return '';                 /* נוסח שרוקן — לא כרטיס ריק */
    return '<div class="card" style="--c:' + r[1] + '">' +
      '<i class="ic"><svg viewBox="0 0 20 20" aria-hidden="true">' + IC[r[0]] +
      '</svg></i><div><h3>' + esc(h || '') + '</h3>' +
      (t ? '<p>' + esc(t) + '</p>' : '') + '</div></div>';
  }).join('');
}

/* ---------- הציור ---------- */
function draw() {
  var T = window.TZEVET || {};
  ['h1','lead','demoNote','demoH','demoSub','goalH','stepsH','stepsFoot','storyH',
   'whoH','kidsH','kidsTxt','qrCap','foot'].forEach(function (k) {
    var el = $('t-' + k);
    if (el) el.textContent = T[k] || '';
  });
  /* הסיפור לבדו נכתב כ-HTML, כדי שאפשר יהיה להדגיש בו משפטים.
     זה גם מה שעושים שאר עמודי המלל בפרויקט. */
  $('t-story').innerHTML = T.story || '';
  document.title = (T.title || 'לצוות') + ' · הדף השבועי של בני עקיבא';

  $('inst-name').textContent = instRow ? instRow.name : '';
  $('inst-name').hidden = !instRow;

  /* שורה שרוקנה מהניהול נעלמת ואינה משאירה רווח לבן על הכהה,
     והבלוק כולו יורד כששתי השורות ריקות. */
  $('t-demoH').hidden   = !(T.demoH || '').trim();
  $('t-demoSub').hidden = !(T.demoSub || '').trim();
  $('demo-cap').hidden  = !((T.demoH || '').trim() || (T.demoSub || '').trim());
  $('t-goalH').hidden   = !(T.goalH || '').trim();

  /* השלבים, בשתי רשימות שהכלים מפרידים ביניהן. שדה שרוקן
     יורד ואינו משאיר מספר מיותם, והמספור רץ על פני שתיהן:
     `data-n` נקבע כאן ולא על ידי הדפדפן, ולכן פיצול הרשימה
     אינו מאפס אותו. */
  var st = [];
  for (var n = 1; n <= 4; n++) if (T['step' + n]) st.push(T['step' + n]);
  var li = function (s, i) {
    return '<li data-n="' + (i + 1) + '">' + esc(s) + '</li>';
  };
  /* הראשון לפני הבאנר, השאר אחריו. הבאנר הוא הכלי של השלב
     הראשון — לפתוח את הדף בכיתה — והוא בא מיד אחריו. */
  $('steps-a').innerHTML = st.slice(0, 1).map(li).join('');
  $('steps-b').innerHTML = st.slice(1).map(function (s, i) {
    return li(s, i + 1);
  }).join('');

  /* שורה שרוקנה אינה משאירה שוליים ריקים מעל ההדגמה */
  $('t-demoNote').hidden = !(T.demoNote || '').trim();

  drawWho();

  /* קטע שרוקן כולו נעלם — פסקה ריקה עדיין נושאת שוליים,
     והמסך היה נראה כאילו חסר בו משהו. */
  $('story-sec').hidden = !((T.storyH || '').trim() || (T.story || '').trim());
  $('t-stepsFoot').hidden = !(T.stepsFoot || '').trim();

  /* הפוטר. הקישור נדלק רק כשיש מספר — הוא נקרא מההגדרות
     שפורסמו, ואינו יושב בריפו. */
  var fw = $('foot-wa'), num = COORD_WA || waNum(T.waNum);
  if (fw) {
    fw.textContent = ' ' + (T.footWa || '');
    fw.hidden = !(num && (T.footWa || '').trim());
    if (num) fw.href = 'https://wa.me/' + num;
  }

  /* שלוש הדרכים לקישור */
  drawQr();
  var msg = tpl(UI.linkWa, { inst: instRow ? instRow.name : 'רשת בני עקיבא',
                             url: kidsUrl() });
  $('kids-wa').href = 'https://wa.me/?text=' + encodeURIComponent(msg);
  $('t-waBtn').textContent = 'וואטסאפ';
  $('kids-mail').href = 'mailto:?subject=' + encodeURIComponent(T.mailSub || '') +
                        '&body=' + encodeURIComponent(msg);
  $('t-mailBtn').textContent = 'מייל';
  
  drawPeers();
  drawBoard();
  drawStage();
  demoBox();
  backFromDemo();
  if (!SCROLLED) { SCROLLED = 1; firstScroll(); }
}
var SCROLLED = 0;

/* ============================================================
   חלון ההדגמה.
   ============================================================
   הדף האינטראקטיבי האמיתי רץ כאן בתוך חלון ומנגן את עצמו,
   בלי שאיש לחץ על דבר. ר"ם עסוק אינו לוחץ — וכל עוד ההדגמה
   ישבה מאחורי לחיצה, מי שהגיע אליה כבר ממילא היה משוכנע.

   **הכיסוי יורד כשההדגמה מתחילה באמת, לא לפי שעון.** טעינה
   על רשת איטית ארוכה בהרבה משנייתיים, ושעון היה מגלה מלבן
   ריק. הדף שבחלון מודיע כשהוא מתחיל — ראו `EMB` ב-learn.html —
   וזה מה שמוריד את הכיסוי. פסק זמן ארוך הוא רשת ביטחון בלבד.

   **ושהות מזערית**: גם כשהכל מהיר, המשפט צריך להספיק להיקרא.
   כיסוי שמהבהב הוא גרוע ממשפט ששוהה רגע.
   ============================================================ */
function demoBox() {
  var box = $('demo'), f = $('demo-frame');
  if (!box || !f || f.src) return;          /* פעם אחת, לא בכל ציור */
  /* במצב עריכת מלל אין הדגמה: היא אינה נושאת מלל שנערך,
     והחלון רק היה גונב את המקום ממה שכן. */
  if (/[?&]tedit=1/.test(location.search)) { box.hidden = true; return; }
  var wk = (typeof LWeek === 'function') ? LWeek() : -1;
  var d  = (typeof LDaf === 'function') ? LDaf(track, wk < 0 ? 0 : wk) : '';
  /* אין דף לשבוע הזה — אין מה להדגים, והחלון פשוט אינו מוצג. */
  if (!d) { box.hidden = true; return; }

  f.src = base() + 'learn.html?mas=' + encodeURIComponent(track) +
          '&daf=' + encodeURIComponent(d) + '&demo=1&embed=1&from=tzevet' +
          (instCode ? '&inst=' + encodeURIComponent(instCode) : '');

  /* אין כאן יותר "מתי היא עולה": היא שם מההתחלה, ומתחילה
     לנגן ברגע שהיא מוכנה. וכשהיא נגמרה — העמוד יורד לבד אל
     ההנחיות. ההדגמה ענתה על "מה זה", והשאלה הבאה היא "ומה אני
     עושה עם זה". */
  window.addEventListener('message', function (e) {
    if (e.data === 'daf-demo-done') toHowto();
  });

  /* נגיעה בחלון פותחת את הדף האמיתי במסך מלא. גרירה אינה
     נגיעה — אצבע שגוללת את העמוד עוברת מעל החלון, וסף של
     כמה פיקסלים הוא מה שמפריד בין השניים. */
  var tap = $('demo-tap'), dr = null;
  tap.addEventListener('pointerdown', function (e) {
    dr = { x:e.clientX, y:e.clientY, m:0 };
  });
  tap.addEventListener('pointermove', function (e) {
    if (dr) dr.m = Math.max(dr.m, Math.abs(e.clientX - dr.x) +
                                  Math.abs(e.clientY - dr.y));
  });
  tap.addEventListener('pointerup', function () {
    var d2 = dr; dr = null;
    if (d2 && d2.m < 8) goDaf();
  });
  tap.addEventListener('pointercancel', function () { dr = null; });
}

/* קוד הסריקה של קישור התלמידים. נכשל משהו — הריבוע פשוט אינו

/* ---------- חזרה מההדגמה ----------
   ר"ם שסיים לצפות לוחץ "איך עושים זאת?" וחוזר לכאן אל ההנחיות.
   הדפדפן היה קופץ לשם בעצמו — אבל התוכן נבנה ב-JS, וברגע שהוא
   קופץ הקטע עוד ריק והוא נוחת במקום הלא נכון. לכן הגלילה נעשית
   כאן, אחרי שהעמוד מצויר.

   וההבהוב: מי שנחת אחרי מעבר בין עמודים צריך רגע כדי לדעת לאן
   הוא הגיע, ומסגרת שנדלקת ודועכת אומרת "זה מה שחיפשת" בלי
   מילה אחת. */
/* ---------- הגלילה הראשונה ----------
   העמוד יורד לבד עד שהפנייה — "רב ומחנך נכבד" — יושבת בראשו,
   והחתימה שמעליה נשארת מעל הקיפול. היא כבר עשתה את שלה: מי
   שפתח קישור רוצה לדעת בשנייה הראשונה ממי זה הגיע.

   **התזמון והקצב הם כל העניין.** מי שפותח עמוד אינו קורא מיד —
   הוא מרפרף שנייה־שתיים, העין מדלגת על הלוגו ומחפשת את התוכן,
   ורק אז היא נוחתת על הכותרת ומתחילה לקרוא. גלילה שקופצת לפני
   הרגע הזה נקראת כמשהו שברח, וגלילה מהירה — גם אם היא מגיעה
   למקום הנכון — קוטעת את הרפרוף במקום להמשיך אותו.

   לכן: שתי שניות של המתנה, ואז תנועה של שנייה וחצי שמתחילה
   כמעט בלי מהירות, צוברת, ונעצרת בעדינות. זו תנועה שמרגישה
   כמו העמוד שמתיישב, לא כמו העמוד שבורח. `behavior:'smooth'`
   של הדפדפן קצר מדי לזה — כרבע שנייה — ולכן היא מצוירת כאן.

   וכל נגיעה מבטלת: מי שכבר גולל יודע לאן הוא הולך, ועמוד שזז
   מתחת לאצבע הוא הדבר המעצבן ביותר שמסך יכול לעשות. */
function firstScroll() {
  if (location.hash) return;                    /* באו לקטע מסוים */
  if (/[?&]tedit=1/.test(location.search)) return;
  if (window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;

  var mark = function () { STOPPED = true; };
  ['touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(function (ev) {
    window.addEventListener(ev, mark, true);
  });

  setTimeout(function () {
    if (STOPPED || window.pageYOffset > 4) return;
    var h1 = $('t-h1'), eb = $('inst-name');
    if (!h1) return;
    var to = h1.getBoundingClientRect().top + window.pageYOffset - 20;
    /* לא לחתוך את שם הישיבה לחצי: או שהוא נראה כולו, או שהוא
       מעל הקיפול. הרווח שנשאר מעל הפנייה הוא המרווח שמתחתיו. */
    if (eb && eb.textContent.trim()) {
      var eBot = eb.getBoundingClientRect().bottom + window.pageYOffset;
      if (to < eBot) to = eBot;
    }
    if (to <= 8) return;

    glide(to, 1500, function () {
      /* ---------- והגלילה השנייה ----------
         עכשיו העין כבר על החלון. שלוש שניות לקרוא את שתי
         השורות, ואז תזוזה קטנה שמושיבה את החלון כולו על המסך
         עם אוויר מתחתיו: חלון שנגמר בדיוק בקצה התחתון נראה
         כאילו נחתך, ומי שרואה אותו כך אינו יודע שזה הכל. */
      setTimeout(function () {
        if (STOPPED) return;
        var box = $('demo');
        if (!box || box.hidden) return;
        var r = box.getBoundingClientRect();
        var y = window.pageYOffset + r.bottom + 22 - window.innerHeight;
        if (y - window.pageYOffset > 14) glide(y, 1100);
      }, 3000);
    });
  }, 2000);
}

/* תנועה אחת: מתחילה כמעט בלי מהירות, צוברת, ונעצרת בעדינות.
   `behavior:'smooth'` של הדפדפן הוא כרבע שנייה — מהיר מדי כדי
   להיקרא כהתיישבות, ולכן היא מצוירת כאן.

   `STOPPED` נבדק בכל פריים: נגיעה באמצע עוצרת מיד. */
var STOPPED = false;
function glide(to, ms, done) {
  var from = window.pageYOffset, dist = to - from, t0 = 0;
  var step = function (ts) {
    if (STOPPED) return;
    if (!t0) t0 = ts;
    var k = Math.min(1, (ts - t0) / ms);
    var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    window.scrollTo(0, from + dist * e);
    if (k < 1) requestAnimationFrame(step);
    else if (done) done();
  };
  requestAnimationFrame(step);
}

/* המעבר אל ההנחיות. שני מקומות מגיעים לכאן: חזרה מההדגמה
   במסך מלא, וסיום ההדגמה שבחלון. */
function toHowto() {
  var el = $('howto');
  if (!el) return;
  setTimeout(function () {
    el.scrollIntoView({ behavior:'smooth', block:'start' });
    el.className = 'lit';
    setTimeout(function () { el.className = ''; }, 1800);
  }, 120);
}
function backFromDemo() {
  if (location.hash === '#howto') toHowto();
}

/* ============================================================
   הלוח המקוצר — מה יופיע לו כשתלמיד יירשם.
   ============================================================
   אותו כרטיס שיש בעמוד הראשי לישיבה שהצטרפה. הוא כאן כדי
   שר"ם יראה מראש מה מחכה לו, ולא יצטרך להאמין לתיאור.

   הכל נקרא מהלשוניות **הציבוריות** — מספרים בלבד. שום שם
   אינו יוצא מהגיליון הסגור אל העמוד הזה, גם לא לכרטיס הזה.

   **הנוסח אינו מועתק:** אותם שדות מלל של העמוד הראשי
   (`UI.cb*`), ולכן מילה שתשונה בניהול משתנה בשני המקומות.
   הצורה כן מועתקת — ראו את ההערה ליד ה-CSS.
   ============================================================ */
/* **מספר אחד בלבד.** הפילוח לפי שכבה ולפי דרך לימוד ירד מכאן:
   הוא שייך ללוח המפורט, ובכרטיס המקוצר הוא הפך שורה של כריות
   קטנות שמתחרות במספר הגדול. */
var counts = { n:0 };

function drawBoard() {
  var el = $('brd'); if (!el) return;
  var T = window.TZEVET || {};
  /* בלי ישיבה אין לוח — אין מה לספור ואין מה להראות. */
  if (!instRow) { el.innerHTML = ''; return; }

  var n = counts.n, wk = (typeof LWeek === 'function') ? LWeek() : -1;
  var tr = null;
  for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === track) tr = TRACKS[i];
  if (!tr) tr = TRACKS[0];
  var row = wk >= 0 ? tr.cal[wk] : null, row0 = tr.cal[0];
  var daf = row && row[2] && row[2] !== 'סיום' ? row[2] : null;
  var did = (wk >= 0 && typeof LCount === 'function')
          ? LCount(tr.id, wk, instRow.code) : 0;

  /* ---------- הכותרת ----------
     בלעדיה זה נקרא ככרטיס מספרים ולא כלוח. "לוח לימוד" ושם
     הישיבה, כדי שגם צילום מסך של הכרטיס לבדו יגיד מה הוא
     ושל מי. */
  /* **של מי הלוח הזה.** "יב״ע לפיד" לבדו אומר איזו ישיבה;
     הר"ם רוצה לדעת שאלה התלמידים שלו. השם מגיע מההרשמה שלו,
     ו"הרב" מתווסף כאן ולא נדרש ממנו להקליד אותו — הוא יקליד
     "יונתן", וזה מה שהיה מופיע. */
  var ram = (typeof ramGet === 'function') ? ramGet() : null;
  var whoLine = (ram && ram.first)
    ? '<span class="ram">' + esc(tpl(T.brdWho || '',
        { ram: ((ram.first || '') + ' ' + (ram.last || '')).trim() })) + '</span>'
    : '';
  var head = '<div class="brd-head"><b>' + esc(T.brdH || '') + '</b>' +
             '<span>' + esc(instRow.name) + whoLine + '</span></div>';

  /* ---------- המספר ----------
     לפני שהצטרף מישהו — **עיגול ריק** ולא מקף. מקף נראה כמו
     מחיקה, כלומר כמו משהו שהיה ואיננו; עיגול ריק נקרא כמקום
     שממתין להתמלא. */
  var unit = esc(tpl(UI.cbHero, { n:'' }).replace(/^\s*/, ''));
  var hero = '<b>' + (n ? n : '<i class="hole"></i>') +
             '<small>' + unit + '</small></b>' +
             '<span>' + esc(UI.cbHeroSub) + '</span>';

  /* ---------- שורת השבוע ----------
     לפני שהלימוד מתחיל, ולפני שיש מה למדוד — שורת הסימנייה.
     היא אמיתית גם עכשיו, ולכן אינה חלק מהשלד. */
  var bar = '';
  if (n && daf) {
    bar = '<div class="brd-bar"><div class="t"><i style="width:' +
      Math.max(3, Math.round(did / n * 100)) + '%"></i></div><span>' +
      esc(tpl(UI.cbBar, { n:did, all:n, daf:daf })) + '</span></div>';
  } else if (row0) {
    bar = '<div class="brd-bar"><div class="brd-first">' +
      '<span class="dot">' + esc(row0[2]) + '</span>' +
      '<div><b>' + esc(UI.cbSoon) + ' · ' + esc(row0[1]) + '</b>' +
      '<span>' + esc(row0[0]) + '</span></div></div></div>';
  }

  /* **קישור ולא כפתור.** מלבן כחול ברוחב מלא הוא הכרזה, והוא
     נקרא כמו הפעולה הראשית של המסך — בזמן שהפעולה הראשית
     כאן היא לשלוח לתלמידים. מי שרוצה לראות פירוט, ילחץ על
     שורה שאומרת "פירוט". */
  var full = '<a class="brd-more" href="' + esc(boardUrl()) + '">' +
             esc(UI.cbBoard) + '<span aria-hidden="true">←</span></a>';

  /* התגית — רק בשלד. משהצטרף אחד, הלוח מדבר בעד עצמו. */
  var tag = n ? '' : '<span class="skel-tag">' + esc(T.brdSkel || '') + '</span>';

  el.innerHTML = '<div class="brd' + (n ? '' : ' skel') + '">' + head + tag +
    '<div class="brd-hero">' + hero + '</div>' +
    bar + full +
    '<p class="brd-note">' + esc(UI.cbNote) + '</p></div>';
}

/* ---------- כמה כבר הצטרפו ----------
   מהלשונית הציבורית `מונים`, מספר בלבד. שום שם אינו יוצא
   מהגיליון הסגור אל העמוד הזה. */
var peers = {};
try { peers = JSON.parse(localStorage.getItem('df:peerCache') || '{}') || {}; }
catch (e) { peers = {}; }

function drawPeers() {
  var T = window.TZEVET || {};
  var el = $('peers');
  var n = instRow ? (peers[instRow.code] || 0) : 0;
  if (!n || !T.peers || !instRow) { el.hidden = true; return; }
  el.textContent = tpl(T.peers, { n:n, inst:instRow.name });
  el.hidden = false;
}


/* ---------- הרכבת המלל ואז הציור ---------- */
function relayer() { TX.layer(TX.published(), TX.draft()); draw(); }
relayer();
TX.init({ repaint: draw, onStop: function () { location.href = './#admin'; } });

/* ---------- מה שפורסם בגיליון ----------
   המלל והמונים. שניהם ציבוריים, ולכן נקראים ישירות בלי
   לעבור דרך הסקריפט של הרכז.

   ושלושת המצבים, כמו בכל קורא בפרויקט: כישלון משאיר את
   המטמון, לשונית שאינה מה שביקשנו נדחית, וריק אמיתי מרוקן. */
function sheetId() {
  try {
    var c = JSON.parse(localStorage.getItem('df:cfg') || '{}');
    if (c && c.sheetId) return c.sheetId;
  } catch (e) {}
  return window.SHEET_ID;
}
function csv(t) {
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < t.length; i++) {
    var c = t[i];
    if (q) {
      if (c === '"' && t[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function sheetCsv(tab) {
  var id = sheetId();
  if (!id || !navigator.onLine) return Promise.resolve(null);
  return fetch('https://docs.google.com/spreadsheets/d/' + id +
               '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(tab) +
               '&t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) { return t ? csv(t) : null; })
    .catch(function () { return null; });
}

sheetCsv('טקסטים').then(function (rows) {
  if (!rows || !rows.length) return;                  /* כישלון — לא נוגעים */
  if (rows[0].join('|').indexOf('מפתח') < 0) return;  /* לשונית אחרת */
  var m = {};
  rows.slice(1).forEach(function (r) {
    var k = (r[0] || '').trim(), v = (r[1] || '').trim();
    if (k && v) m[k] = v;
  });
  try { localStorage.setItem('df:textCache', JSON.stringify(m)); } catch (e) {}
  relayer();
});

/* ---------- הוואטסאפ של הרכז ----------
   לא יושב בקוד: הריפו ציבורי, ומספר טלפון בו הוא מספר שפורסם
   לעולם. הוא מגיע מהגיליון, ומשני מקומות אפשריים:

   **ההגדרות שפורסמו** — אותו שדה שכבר קיים בניהול ← מערכת,
   וזה המקום הטבעי. הערכים שם נשמרים כ-JSON עם גרש מוביל, כדי
   שגוגל שיטס לא תהפוך אותם לטיפוס משלה.

   **ואם משום מה הוא אינו מגיע משם** — `tzevet.waNum` בלשונית
   הטקסטים. הלשונית הזו מוכחת בעמוד הזה: כל המלל שבו מגיע ממנה.
   שדה שני לאותו מספר אינו יפה, אבל קישור שאינו מופיע ואי אפשר
   לדעת למה גרוע ממנו.

   בשני המקרים: אין מספר — הקישור פשוט אינו מוצג. */
var COORD_WA = '';
function waNum(v) {
  v = String(v == null ? '' : v).trim().replace(/^'/, '');
  try { v = JSON.parse(v); } catch (e) {}
  v = String(v || '').replace(/[^0-9]/g, '');
  /* 05… הוא מספר ישראלי מקומי, ו-wa.me דורש קידומת מדינה. מי
     שהקליד אותו כפי שהוא מכיר אותו לא צריך ליפול על זה. */
  if (v.indexOf('0') === 0) v = '972' + v.slice(1);
  return v.length >= 11 ? v : '';
}
/* בלי דרישת כותרת: אם השורה מכילה `coordWa` בעמודה הראשונה,
   זו הלשונית הנכונה. בדיקת כותרת שנכשלת מפילה את הכל בשקט. */
sheetCsv('הגדרות').then(function (rows) {
  if (!rows || !rows.length) return;
  rows.forEach(function (r) {
    if ((r[0] || '').trim() !== 'coordWa') return;
    var v = waNum(r[1]);
    if (v) COORD_WA = v;
  });
  if (COORD_WA) draw();
});

sheetCsv('מונים').then(function (rows) {
  if (!rows || !rows.length) return;
  var head = rows[0], ix = {};
  for (var i = 0; i < head.length; i++) ix[String(head[i]).trim()] = i;
  if (ix['קוד ישיבה'] === undefined) return;          /* לא הלשונית שביקשנו */
  var m = {};
  rows.slice(1).forEach(function (r) {
    var k = String(r[ix['קוד ישיבה']] || '').trim();
    var v = parseInt(r[ix['מצטרפים']], 10);
    if (k && v > 0) m[k] = v;
  });
  peers = m;
  try { localStorage.setItem('df:peerCache', JSON.stringify(m)); } catch (e) {}
  /* אותה לשונית נושאת גם את הפילוח, ולכן היא ממלאת גם את
     הלוח המקוצר — ולא נדרשת קריאה שנייה. */
  if (instCode) {
    rows.slice(1).forEach(function (r) {
      if (String(r[ix['קוד ישיבה']] || '').trim() !== instCode) return;
      counts = { n: parseInt(r[ix['מצטרפים']], 10) || 0 };
    });
  }
  drawPeers(); drawBoard();
});

/* המסכת שהישיבה בחרה בהרשמה — מהלשונית הציבורית `מוסדות`.
   בלעדיה נשארת ברירת המחדל, וזה בסדר: הבורר בבמה פתוח. */
sheetCsv('מוסדות').then(function (rows) {
  if (!rows || rows.length < 2 || !instCode) return;
  var head = rows[0], ci = -1, mi = -1;
  for (var i = 0; i < head.length; i++) {
    var h = String(head[i]).trim();
    if (h === 'code' || h === 'קוד') ci = i;
    if (h === 'מסכתות') mi = i;
  }
  if (ci < 0 || mi < 0) return;
  for (var r = 1; r < rows.length; r++) {
    if (String(rows[r][ci] || '').trim() !== instCode) continue;
    var list = String(rows[r][mi] || '').split(',');
    for (var j = 0; j < list.length; j++) {
      var id = list[j].trim();
      for (var k2 = 0; k2 < TRACKS.length; k2++) {
        if (TRACKS[k2].id === id) { track = id; drawStage(); return; }
      }
    }
    return;
  }
});

/* ============================================================
   הפנייה האישית לר"ם — הבקר.
   ============================================================
   שלושה שלבים: פרטים · התקנה · עדכונים. אותה שפה בדיוק של
   מסך התלמיד, כי היא זו שנבדקה בשטח ועבדה.

   למה בכלל שהר"ם יירשם: בלי שם, שכבה וכיתה אין דרך לדעת מי
   תלמידיו — והעדכון "תלמיד סיים דף" אינו שווה דבר כשאינו
   יודע איזה תלמיד הוא שלו. השאלה על השכבה נשמעת כמו טופס,
   ולכן נאמר בפירוש למה שואלים.

   הידע על המכשיר — התקנה, הרשמה להתראות — מגיע מ-getapp.js,
   ולא מעותק שני שלו.
   ============================================================ */
var RAM_GRADES = ['ז׳', 'ח׳', 'ט׳', 'י׳', 'י״א', 'י״ב'];
var ramStep = 0, ramBusy = false, ramErr = '', ramSkip = false;
/* **מה שהוקלד ולא נשמר עדיין.** בלעדיו, ר"ם שהקליד שם ושכח
   לבחור שכבה קיבל את ההודעה "צריך שכבה" — ויחד איתה טופס
   שהשם שלו נמחק. אדם שנענש על טעות קטנה סוגר את המסך. */
var ramDraft = {};

function tz(k) { return (window.TZEVET && TZEVET[k]) || ''; }
/* **"הרב" מתווסף כאן ובכל מקום אחר.** הוא הקליד שם פרטי ושם
   משפחה; התואר אינו נדרש ממנו ואינו נאמר לו. */
function ramName(me) {
  me = me || ramGet() || {};
  var n = ((me.first || '') + ' ' + (me.last || '')).trim();
  return n ? 'הרב ' + n : '';
}

function ramGet() {
  try { return JSON.parse(localStorage.getItem('df:ram') || 'null'); }
  catch (e) { return null; }
}
function ramSet(v) {
  try { localStorage.setItem('df:ram', JSON.stringify(v)); } catch (e) {}
}
function ramNoted() {
  try { return localStorage.getItem('df:ramNote') === '1'; } catch (e) { return false; }
}
function ramWhere() {
  if (!ramGet()) return 1;
  if (!APPX.installed() && !ramSkip) return 2;
  if (ramNoted() && APPX.perm() === 'granted') return 4;
  return 3;
}

/* ---------- הפס המרחף ----------
   מופיע רק אחרי שההדגמה נגללה: קודם רואים מה בנינו, ואז
   מבקשים. בקשה שקופצת לפני שראה משהו היא בקשה מאדם זר. */
/* השורה יושבת במקומה בעמוד ואינה תלויה בגלילה. מה שהיה
   קודם — פס שקופץ אחרי X פיקסלים — הופיע בראש העמוד על
   מסכים גבוהים, כלומר לפני שהר"ם ראה דבר.

   **כפתור בלי כיתוב אינו כפתור:** אם המלל עוד לא נטען, למשל
   data.js ישן שיושב במטמון, עדיף שלא יופיע כלום. */
function ramBar() {
  var el = $('askrow'); if (!el) return;
  var t = tz('askBar');
  if (!t || ramWhere() === 4) { el.hidden = true; return; }
  $('ar-t').textContent = t;
  el.hidden = false;
}

function ramOpen() {
  var mk = $('as-mark');
  if (mk && !mk.src) mk.src = window.LOGO_MARK || '';
  ramStep = ramWhere();
  if (ramStep === 1 && !ramGet()) ramStep = 0;   /* 0 = הפנייה עצמה */
  $('asksheet').hidden = false;
  document.body.style.overflow = 'hidden';
  ramDraw();
}
function ramClose() {
  $('asksheet').hidden = true;
  document.body.style.overflow = '';
  ramBar();
  drawBoard();
}
function ramGo(n) { ramStep = n; ramDraw(); }

function ramMeter(n) {
  var h = '<div class="as-bar">', i;
  for (i = 1; i <= 3; i++) {
    h += '<i class="' + (i < n ? 'did' : (i === n ? 'on' : '')) + '"></i>';
  }
  return h + '</div>';
}
function ramRow(t) {
  return '<div class="as-done"><b>✓</b><span>' + esc(t) + '</span></div>';
}
function ramKick(n, t, b) {
  return '<div class="as-kick">שלב ' + n + ' מתוך 3</div>' +
    '<h2>' + esc(t) + '</h2>' + (b ? '<p>' + esc(b) + '</p>' : '');
}

function ramDraw() {
  var el = $('as-body'); if (!el) return;
  var me = ramGet(), h = '';

  /* ---- הפנייה עצמה. בלי מד ובלי שלבים: זו עדיין בקשה
          ולא תהליך, ומד מעליה הופך אותה למשימה. ---- */
  if (ramStep === 0) {
    /* שורה ריקה במלל = פסקה. פסקה אחת ארוכה נקראת כקיר. */
    var body = String(tz('askBody') || '').split('\n').map(function (x) {
      return x.trim() ? '<p>' + esc(x.trim()) + '</p>' : '';
    }).join('');
    el.innerHTML = '<div class="as-card"><h2>' + esc(tz('askH')) + '</h2>' + body +
      '<button class="as-go" id="r-go">' + esc(tz('askGo')) + '</button>' +
      '<button class="as-thin" id="r-later">' + esc(tz('askLater')) + '</button></div>';
    ramWire(); return;
  }

  h += ramMeter(ramStep === 4 ? 3 : ramStep);
  if (ramStep > 1 && me) h += ramRow(ramName(me));
  if (ramStep > 2) h += ramRow(ramSkip ? 'ממשיכים בלי התקנה'
                                       : 'האפליקציה על מסך הבית');

  if (ramStep === 1)      h += '<div class="as-card">' + ramWho() + '</div>';
  else if (ramStep === 2) h += '<div class="as-card">' + ramInstall() + '</div>';
  else if (ramStep === 3) h += '<div class="as-card">' + ramNote() + '</div>';
  else                    h += '<div class="as-card fin">' + ramFin() + '</div>';

  el.innerHTML = h;
  ramWire();
  $('asksheet').scrollTop = 0;
}

/* ---------- שלב 1 ---------- */
function ramWho() {
  var me = ramGet() || {}, d = ramDraft;
  me = { first: d.first != null ? d.first : (me.first || ''),
         last:  d.last  != null ? d.last  : (me.last  || ''),
         grade: d.grade != null ? d.grade : (me.grade || ''),
         klass: d.klass != null ? d.klass : (me.klass || '') };
  var opts = function (list, cur) {
    return '<option value="">—</option>' + list.map(function (g) {
      return '<option' + (g === cur ? ' selected' : '') + '>' + esc(g) + '</option>';
    }).join('');
  };
  var cls = [];
  for (var i = 1; i <= 12; i++) cls.push(String(i));
  return ramKick(1, tz('askWhoH'), tz('askWhoB')) +
    '<div class="fld"><label class="label" for="r-first">' +
      esc(tz('askName')) + '</label>' +
      '<input id="r-first" type="text" autocomplete="given-name" value="' +
      esc(me.first || '') + '"></div>' +
    '<div class="fld"><label class="label" for="r-last">' +
      esc(tz('askLast')) + '</label>' +
      '<input id="r-last" type="text" autocomplete="family-name" value="' +
      esc(me.last || '') + '">' +
      /* **"הרב" מתווסף אצלנו, ולא נאמר לו.** הוא כותב את שמו,
         ואנחנו מוסיפים את התואר בלוח ובכל מקום אחר. הסבר על
         מה שקורה מאחורי הקלעים הוא עוד שורה לקרוא. */
      '</div>' +
    '<div class="fld"><label class="label">שכבה וכיתה ' +
      '<i>· ' + esc(tz('askClsH')) + '</i></label>' +
      '<div class="pair">' +
      '<select id="r-grade">' + opts(RAM_GRADES, me.grade) + '</select>' +
      '<select id="r-klass">' + opts(cls, me.klass) + '</select></div></div>' +
    '<button class="as-go" id="r-next">' + esc(tz('askNext')) + '</button>' +
    (ramErr ? '<div class="as-err">' + esc(ramErr) + '</div>' : '');
}

/* ---------- שלב 2 ---------- */
function ramInstall() {
  if (APPX.inApp()) {
    return ramKick(2, tz('askInstH'), '') +
      '<div class="as-err" style="background:rgba(192,143,43,.12);' +
      'border-color:rgba(192,143,43,.35);color:var(--ink)">' +
      '<b>נראה שהדף פתוח בתוך וואטסאפ</b><br>מכאן אי אפשר להוסיף ' +
      'למסך הבית. ' + (APPX.isIOS()
        ? 'לחצו על כפתור השיתוף שלמטה ובחרו "פתיחה בספארי".'
        : 'לחצו על שלוש הנקודות שלמעלה ובחרו "פתיחה בדפדפן".') + '</div>';
  }
  if (APPX.wasAdded() && !APPX.installed()) {
    return ramKick(2, tz('askInstH'), '') +
      '<p>האפליקציה כבר נוספה. <b>פתחו את האייקון</b> מהמסך של ' +
      'הטלפון, ומשם נמשיך.</p>' + APPX.icon();
  }
  var h = ramKick(2, tz('askInstH'), tz('askInstB'));
  h += APPX.bip()
    ? '<button class="as-go" id="r-inst">התקנת האפליקציה</button>'
    : APPX.howList();
  return h + '<button class="as-thin" id="r-skip">' +
    esc(tz('askSkip')) + '</button>';
}

/* ---------- שלב 3 ---------- */
function ramNote() {
  if (!APPX.canNote() || APPX.perm() === 'denied') {
    return ramKick(3, tz('askNoteH'), '') +
      '<p>ההתראות חסומות במכשיר הזה. אפשר לפתוח אותן ' +
      APPX.unblock() + ', ואז לחזור לכאן.</p>' +
      '<button class="as-thin" id="r-later">לא עכשיו</button>';
  }
  return ramKick(3, tz('askNoteH'), tz('askNoteB')) +
    '<button class="as-go g" id="r-note"' + (ramBusy ? ' disabled' : '') + '>' +
    (ramBusy ? 'רגע…' : esc(tz('askNoteGo'))) + '</button>' +
    (ramErr ? '<div class="as-err">' + esc(ramErr) + '</div>' : '') +
    '<button class="as-thin" id="r-later">לא עכשיו</button>';
}

function ramFin() {
  return '<div class="as-v">✓</div><h2>' + esc(tz('askFinH')) + '</h2>' +
    '<p>' + esc(tz('askFinB')) + '</p>' +
    '<button class="as-go" id="r-done">סגירה</button>';
}

/* ---------- חיווט ---------- */
function ramWire() {
  var b;
  if ((b = $('r-go')))   b.onclick = function () { ramErr = ''; ramGo(1); };
  if ((b = $('r-done'))) b.onclick = ramClose;
  /* "לא עכשיו" סוגר את המסך. השורה נשארת בעמוד — היא אינה
     קופצת עליו, ולכן אין ממה להסתיר אותה. */
  if ((b = $('r-later'))) b.onclick = ramClose;
  if ((b = $('r-next'))) b.onclick = ramSave;
  if ((b = $('r-inst'))) b.onclick = function () {
    APPX.prompt(function () { ramGo(ramWhere()); });
  };
  if ((b = $('r-skip'))) b.onclick = function () { ramSkip = true; ramGo(3); };
  if ((b = $('r-note'))) b.onclick = ramAsk;
}

function ramSave() {
  var first = ($('r-first').value || '').trim();
  var last  = ($('r-last').value || '').trim();
  var grade = $('r-grade').value, klass = $('r-klass').value;
  /* שומרים לפני שבודקים: ציור מחדש שמוחק את מה שהוקלד הופך
     הודעת שגיאה לעונש. */
  ramDraft = { first: first, last: last, grade: grade, klass: klass };
  if (first.length < 2) { ramErr = 'צריך שם פרטי.'; ramDraw(); return; }
  if (last.length < 2)  { ramErr = 'צריך שם משפחה.'; ramDraw(); return; }
  if (!grade || !klass) { ramErr = 'צריך שכבה וכיתה — כדי שנדע מי תלמידיך.';
    ramDraw(); return; }
  ramErr = '';
  ramSet({ id: ramId(), first: first, last: last, grade: grade, klass: klass,
           inst: instRow ? instRow.code : '', instName: instRow ? instRow.name : '',
           at: new Date().toISOString() });
  ramPost('רשום', null);
  ramGo(ramWhere());
}

/* מזהה אקראי, כמו של התלמיד: הוא מה שמופיע בגיליון לצד
   העדכונים, ואינו נגזר משום פרט אישי. */
function ramId() {
  var v = '';
  try { v = localStorage.getItem('df:ram-id') || ''; } catch (e) {}
  if (!v) {
    v = 'R' + Date.now().toString(36) +
        Math.random().toString(36).slice(2, 7).toUpperCase();
    try { localStorage.setItem('df:ram-id', v); } catch (e) {}
  }
  return v;
}

/* הכתיבה `no-cors` ואטומה ואינה ראיה לכלום — ולכן שום מסך
   כאן אינו אומר "נרשמת". העדכון עצמו הוא האישור. */
function ramPost(res, sub) {
  var me = ramGet() || {};
  var url = '';
  try { url = localStorage.getItem('dfApi') || ''; } catch (e) {}
  if (!url && typeof APPS_SCRIPT_URL !== 'undefined') url = APPS_SCRIPT_URL;
  if (!url) return Promise.reject(new Error('אין כתובת שרת'));
  return fetch(String(url).trim(), {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'row', tab: 'התראות',
      cols: JSON.stringify([
        ['מזהה', me.id || ''], ['שם', ramName(me)],
        ['ישיבה', me.instName || ''], ['תפקיד', 'ר"ם'],
        ['שכבה', me.grade || ''], ['כיתה', me.klass || ''],
        ['מכשיר', APPX.isIOS() ? 'אייפון' : 'אנדרואיד'],
        ['מנוי', sub ? JSON.stringify(sub) : ''],
        ['תוצאה', res], ['מתי', new Date().toISOString()]
      ])
    })
  });
}

function ramAsk() {
  ramErr = ''; ramBusy = true; ramDraw();
  APPX.ask(function (p) {
    if (p !== 'granted') {
      ramBusy = false;
      ramErr = (p === 'denied')
        ? 'האישור נדחה. בלי אישור אי אפשר לשלוח עדכון.'
        : 'לא התקבל אישור. אפשר לנסות שוב.';
      ramDraw(); return;
    }
    APPX.subscribe().then(function (sub) {
      return ramPost('נרשם', sub);
    }).then(function () {
      try { localStorage.setItem('df:ramNote', '1'); } catch (e) {}
      ramBusy = false; ramGo(4);
    })['catch'](function (e) {
      ramBusy = false;
      ramErr = 'לא הצלחתי להשלים: ' + ((e && e.message) || e) + '. אפשר לנסות שוב.';
      ramDraw();
    });
  });
}

/* הפס נבדק בגלילה, ומצויר פעם אחת. */
APPX.onBip(function () { if ($('asksheet') && !$('asksheet').hidden) ramDraw(); });
(function () {
  var b = $('askrow'); if (b) b.onclick = ramOpen;
  if ($('as-x')) $('as-x').onclick = ramClose;
  ramBar();
})();
</script>
</body>
