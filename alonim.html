<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>הדף השבועי של בני עקיבא</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E2E63">
<meta name="robots" content="noindex">
<!-- ============================================================
     מאגר העלונים להורדה (8.99.449) — בריף 3.11, חלק א׳ סעיף 3.
     ============================================================
     אותו מסך להורה ולתלמיד. נפתח מהכרטיס בבית (שישי) או בקישור ישיר.
     הרשימה וההורדה — דרך הסקריפט אחרי זיהוי המכשיר בשרת (alonim.js).
     כשל — הרשימה האחרונה שבמכשיר; אין רשימה כלל — "נסו שוב", לא "ריק".
     ============================================================ -->
<style>
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold-t:#8C681F; --green-d:#467B1A;
  --paper:#F6F1E6; --surface:#FFFDF8; --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#5C687E;
  --rule:#E5DAC3; --stop:#A5382D;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.55;
  padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:14px 16px 10px;max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);letter-spacing:.05em;margin-top:3px}
.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}
.hd h2{font-size:1.45rem;font-weight:800;color:var(--blue-d);letter-spacing:-.02em}
.bk{background:none;border:0;font:inherit;font-weight:800;font-size:.92rem;color:var(--blue);cursor:pointer;padding:6px 2px}
.q{display:block;width:100%;border:1px solid var(--rule);border-radius:14px;background:var(--surface);
  padding:12px 14px;font-size:1rem;color:var(--ink)}
.q:focus{outline:2px solid var(--blue);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 15px;
  font:inherit;font-weight:700;font-size:.9rem;color:var(--ink);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.it{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);
  border-radius:16px;padding:14px;margin-bottom:12px}
.it .tx{flex:1;min-width:0}
.it .nw{display:block;font-size:.8rem;font-weight:800;color:var(--green-d);margin-bottom:1px}
.it b{display:block;font-size:1.06rem;font-weight:800;color:var(--blue-d);line-height:1.35}
.it small{display:block;font-size:.84rem;color:var(--ink-2);font-weight:600;margin-top:2px}
.it .th{flex:none;width:58px;text-align:center;font-size:.7rem;font-weight:700;color:var(--ink-3);line-height:1.3}
.it .th span{display:flex;align-items:center;justify-content:center;width:46px;height:46px;margin:0 auto 4px;
  border:2px solid var(--blue);border-radius:10px;color:var(--blue)}
.it .th svg{width:26px;height:26px}
.dl{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;background:var(--blue);color:#fff;
  font:inherit;font-weight:800;font-size:1rem;padding:12px;cursor:pointer}
.dl[disabled]{opacity:.7;cursor:default}
.er{margin-top:6px;font-size:.85rem;font-weight:700;color:var(--stop)}
.msg{text-align:center;color:var(--ink-2);font-weight:700;padding:26px 6px}
.msg .dl{display:inline-block;width:auto;padding:10px 22px}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap">
  <div class="hd"><h2 id="ttl"></h2><button class="bk" id="bk" type="button"></button></div>
  <input class="q" id="q" type="search" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div id="list" aria-live="polite"></div>
</main>
<script src="data.js"></script>
<script src="logo.js"></script>
<script src="alonim.js"></script>
<script>
function $(id) { return document.getElementById(id); }
var esc = ALDL.esc;
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; });
}
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
/* המלל שנערך בניהול. נוסח שהוחלף בקוד (TEXT_RETIRED) — אינו גובר. */
function take(map) {
  for (var k in (map || {})) {
    var p = k.split('.'), v = map[k];
    if (p.length !== 2 || p[0] !== 'ui' || typeof v !== 'string' || !v) continue;
    var old = (typeof TEXT_RETIRED !== 'undefined' && TEXT_RETIRED[k]) || [];
    if ([].concat(old).indexOf(v) >= 0) continue;
    UI[p[1]] = v;
  }
}
try {
  take(JSON.parse(ls('df:textCache') || 'null'));
  take((JSON.parse(ls('df:cfg') || '{}')).texts);
} catch (e) {}
$('hdr-mark').src = window.LOGO_MARK || '';
$('brand').innerHTML = esc(PROGRAM.short) + '<br>' + esc(PROGRAM.name.slice(PROGRAM.short.length).trim());
$('yr').textContent = tp(UI.rstYear, { y: PROGRAM.year });
$('ttl').textContent = UI.aldlH;
$('bk').textContent = UI.aldlBack + ' ←';
$('q').placeholder = '⌕ ' + UI.aldlSearch;

/* חזרה: לעמוד הקודם כשבאנו מתוך האפליקציה, אחרת לבית. */
$('bk').onclick = function () {
  var same = false;
  try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
  if (same && history.length > 1) { history.back(); return; }
  location.href = /\.html$/.test(location.pathname) ? 'join.html' : 'join';
};

var ROWS = null, FLT = '', BUSY = {}, ERR = {};
function dm(at) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(at || ''));
  return m ? (+m[3]) + '.' + (+m[2]) : '';
}
function norm(s) { return String(s || '').replace(/["'״׳]/g, '').replace(/\s+/g, ' ').trim(); }
function paint() {
  var el = $('list');
  if (ROWS === null) {
    el.innerHTML = '<div class="msg">' + esc(UI.aldlFail) +
      '<br><button class="dl" type="button" onclick="load()">' + esc(UI.aldlRetry) + '</button></div>';
    $('chips').innerHTML = '';
    return;
  }
  if (ROWS === 'denied') { el.innerHTML = '<div class="msg">' + esc(UI.aldlDenied) + '</div>'; $('chips').innerHTML = ''; return; }
  if (!ROWS.length) { el.innerHTML = '<div class="msg">' + esc(UI.aldlEmpty) + '</div>'; $('chips').innerHTML = ''; return; }
  var mas = [];
  ROWS.forEach(function (r) { if (r.mas && mas.indexOf(r.mas) < 0) mas.push(r.mas); });
  if (FLT && mas.indexOf(FLT) < 0) FLT = '';
  $('chips').innerHTML = mas.length > 1 ? ['' ].concat(mas).map(function (m) {
    return '<button type="button" class="chip' + (m === FLT ? ' on' : '') + '" data-m="' + esc(m) + '">' +
      esc(m || UI.aldlAll) + '</button>';
  }).join('') : '';
  var q = norm($('q').value), newest = ROWS[0] && ROWS[0].id;
  var hit = ROWS.filter(function (r) {
    if (FLT && r.mas !== FLT) return false;
    if (!q) return true;
    var hay = norm(r.t + ' ' + r.mas + ' ' + r.daf + ' ' + r.mas + ' ' + UI.aldlDaf + ' ' + r.daf);
    return q.split(' ').every(function (w) { return hay.indexOf(w) >= 0; });
  });
  if (!hit.length) { el.innerHTML = '<div class="msg">' + esc(UI.aldlNoHit) + '</div>'; return; }
  el.innerHTML = hit.map(function (r) {
    var d = dm(r.at);
    return '<div class="it"><div class="tx">' +
      (r.id === newest ? '<span class="nw">' + esc(UI.aldlNew) + '</span>' : '') +
      '<b>' + esc(r.t) + '</b>' +
      '<small>' + esc(r.pg ? tp(UI.aldlMeta, { n: r.pg, d: d }) : tp(UI.aldlMetaD, { d: d })) + '</small>' +
      '<button class="dl" type="button" data-id="' + esc(r.id) + '"' + (BUSY[r.id] ? ' disabled' : '') + '>' +
      esc(BUSY[r.id] ? UI.aldlDling : UI.aldlDl) + '</button>' +
      (ERR[r.id] ? '<div class="er">' + esc(UI.aldlDlFail) + '</div>' : '') +
      '</div><div class="th"><span>' + ALDL.DOC + '</span>' + esc(r.mas) + '<br>' + esc(r.daf) + '</div></div>';
  }).join('');
}
$('chips').onclick = function (ev) {
  var b = ev.target.closest ? ev.target.closest('.chip') : null;
  if (!b) return;
  FLT = b.getAttribute('data-m') || ''; paint();
};
$('q').oninput = paint;
$('list').onclick = function (ev) {
  var b = ev.target.closest ? ev.target.closest('.dl[data-id]') : null;
  if (!b || b.disabled) return;
  var id = b.getAttribute('data-id');
  BUSY[id] = 1; ERR[id] = 0; paint();
  ALDL.get(id).then(function () { BUSY[id] = 0; paint(); })['catch'](function () { BUSY[id] = 0; ERR[id] = 1; paint(); });
};
function load() {
  var c = ALDL.cached();
  if (c) { ROWS = c; paint(); } else $('list').innerHTML = '<div class="msg">' + esc(UI.aldlLoad) + '</div>';
  if (!ALDL.dev()) { ROWS = 'denied'; paint(); return; }
  ALDL.call('alon=list&dev=' + encodeURIComponent(ALDL.dev())).then(function (r) {
    if (r && r.status === 'ok' && r.rows) {
      try { localStorage.setItem('df:aldl', JSON.stringify({ at: Date.now(), rows: r.rows })); } catch (e) {}
      ROWS = r.rows;
    } else if (r && r.status === 'denied') ROWS = 'denied';
    else ROWS = ALDL.cached();
    paint();
  })['catch'](function () { ROWS = ALDL.cached(); paint(); });
}
load();
</script>
</body>
</html>
