<title>הדף השבועי</title>
<!-- ============================================================
     אתגר "חבר מביא חבר" — עמוד התלמיד (8.99.318).
     ============================================================
     שני מצבים, לפי המכשיר:
       · **נחיתה** (`?ref=<קוד>`, מכשיר שלא נרשם) — "יוסי מזמין
         אותך", שורה אחת על האתגר, וכפתור להרשמה. הקוד נשמר במכשיר
         ועובר עם ההרשמה (join.html), עד שהשרת מכריע.
       · **האתגר שלי** (מכשיר רשום) — הקבוצה שלי קודם: מי השלים,
         מה חסר, ומצב ההגרלה; אחר כך ההזמנה; ובסוף, בקטן, המונה
         והתנאים. מי שכבר רשום והגיע מקישור — "אתה כבר איתנו",
         וכפתור בולט לפתוח קבוצה משלו.

     הכול מצויר ב-chal.js, מהשרת (challengeRoute_). אין כאן שום
     חישוב זכאות, ושום שליחה.
     ============================================================ -->

<meta property="og:url" content="https://hadaf-hashvui.vercel.app/chaver">
<meta property="og:image" content="https://hadaf-hashvui.vercel.app/share-card.jpg">

<style>
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
:root{
  --blue:#17468F; --blue-d:#0B2550; --green:#4E9A2A; --green-d:#2E6B12;
  --gold:#C08F2B; --gold-t:#8C681F;
  --paper:#F6F1E6; --surface:#FFFDF8; --ink:#1B2A45; --ink-2:#5A6780; --rule:#E5DAC3;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--paper);color:var(--ink);line-height:1.6;
  padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:14px 16px 10px;
  max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);
  letter-spacing:.05em;margin-top:3px}
.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
.back{display:inline-block;margin:2px 0 12px;font-size:.9rem;font-weight:700;color:var(--blue);
  text-decoration:none}
footer{margin-top:22px;font-size:.78rem;color:var(--ink-2);text-align:center}
footer a{color:var(--ink-2)}
/* ---- האתגר (גם בבית התלמיד — אותם שמות, ראו join.html) ---- */
.ch-card,.ch-grp,.ch-inv{background:var(--surface);border:1px solid var(--rule);border-radius:16px;
  padding:15px 16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(37,29,12,.05),0 2px 8px rgba(37,29,12,.05)}
.ch-card.soft{background:#F3F7EE;border-color:#D6E6C6}
.ch-card h2,.ch-inv h3,.ch-grp h3{font-size:1.12rem;font-weight:800;color:var(--blue-d);margin:0 0 6px}
.ch-card.land h2{font-size:1.4rem}
.ch-lead{font-size:1rem;font-weight:600;margin:0 0 10px}
.ch-st{font-size:.98rem;font-weight:700;margin:8px 0 2px}
.ch-sm{font-size:.82rem;font-weight:600;color:var(--ink-2);margin-top:4px}
.ch-big{font-size:1.02rem;font-weight:800;color:var(--gold-t);margin:0 0 4px}
.ch-cnt{font-size:.88rem;font-weight:700;color:var(--ink)}
.ch-pub{border-top:1px dashed var(--rule);margin-top:12px;padding-top:10px}
.ch-yay{background:#E7F2DD;color:var(--green-d);font-weight:800;border-radius:12px;padding:9px 12px;margin:0 0 10px}
.ch-ppl{list-style:none;display:grid;gap:6px;margin:6px 0 0}
.ch-ppl li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #EFE7D7;border-radius:12px;
  padding:7px 10px;min-height:42px}
.ch-ppl li b{font-weight:800}
.ch-ppl li i{font-style:normal;font-size:.72rem;font-weight:800;color:var(--gold-t)}
.ch-ok,.ch-no{margin-inline-start:auto;font-size:.82rem;font-weight:800;border-radius:999px;padding:2px 10px}
.ch-ok{background:#E7F2DD;color:var(--green-d)}
.ch-no{background:#F3EEE2;color:var(--ink-2)}
.ch-rm{font-size:.8rem;font-weight:800;color:#fff;background:#1FA637;border-radius:999px;padding:4px 10px;
  text-decoration:none;flex:none}
.ch-grp.in{border-color:#D9A43A}
.ch-grp.won{border:2px solid var(--gold);background:#FFF8E6}
.ch-grp.out{opacity:.85}
.ch-btn{display:block;width:100%;margin:10px 0 0;padding:13px 14px;border-radius:14px;border:0;
  background:var(--blue-d);color:#fff;font:inherit;font-size:1.02rem;font-weight:800;text-align:center;
  text-decoration:none;cursor:pointer}
.ch-btn.big{font-size:1.12rem;padding:15px 14px;box-shadow:0 6px 16px rgba(11,37,80,.25)}
.ch-btn.wa{background:#1FA637}
.ch-btn.wa[aria-disabled]{opacity:.5;pointer-events:none}
.ch-btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--rule)}
.ch-btn.wk{background:var(--green-d)}
.ch-btn[disabled]{opacity:.5}
.ch-link{font-size:.86rem;background:#fff;border:1px dashed var(--rule);border-radius:10px;padding:8px 10px;
  overflow-wrap:anywhere;text-align:left;color:var(--ink-2)}
.ch-inv p{font-size:.92rem;font-weight:600;margin:0 0 8px}
.ch-all,.ch-terms{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.ch-all summary,.ch-terms summary{font-weight:800;color:var(--blue-d);cursor:pointer}
.ch-terms p{font-size:.88rem;font-weight:600;color:var(--ink-2);margin-top:8px}
.ch-stay{font-size:.98rem;font-weight:800;color:var(--green-d);background:#F3F7EE;border-radius:12px;
  padding:10px 12px;margin:0 0 12px}
.ch-mine p{font-size:.95rem;font-weight:600;margin:0 0 6px}
/* ---- השולחן (8.99.325) — ארבעה מקומות, והצלחת היא המקום. chal.js ---- */
.ch-tcard{position:relative;border-radius:22px;padding:16px 14px 14px;margin:0 0 12px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,#FFF4D6 0%,#FFF9EC 55%,#FFFDF8 100%);
  border:1.5px solid #E9C877;box-shadow:0 2px 4px rgba(140,104,31,.08),0 10px 26px rgba(140,104,31,.14)}
.ch-tcard.ch-home{margin:18px 0 14px}
.ch-tcard.set{border-color:#8CC063}
.ch-tcard.in{border:2px solid #D9A43A}
.ch-tcard.won{border:2.5px solid #C08F2B;background:radial-gradient(120% 80% at 50% 0%,#FFE9A8 0%,#FFF4D6 60%,#FFFDF8 100%)}
.ch-tcard.out{filter:saturate(.55);opacity:.9}
.ch-chip{display:inline-block;background:#C08F2B;color:#fff;font-size:.74rem;font-weight:800;
  border-radius:99px;padding:4px 12px;letter-spacing:.04em}
.ch-hh{font-size:1.62rem;font-weight:900;letter-spacing:-.035em;color:#0B2550;line-height:1.15;margin:8px 0 2px}
.ch-hh.sm{font-size:1.35rem;margin-top:4px}
.ch-prize{font-size:.95rem;font-weight:800;color:#8C681F;margin:0}
.ch-tline{font-size:.88rem;font-weight:800;color:#5A6780;margin:2px 0 0}
.ch-tbl{position:relative;width:310px;max-width:100%;margin:10px auto 6px;padding:40px 0}
.ch-tbl.sm{width:290px;padding:36px 0}
.ch-board{position:relative;height:206px;border-radius:30px;
  background:linear-gradient(180deg,#D9A35A,#C68A3F);box-shadow:inset 0 -7px 0 rgba(0,0,0,.08),0 10px 22px rgba(120,80,20,.25)}
.ch-tbl.sm .ch-board{height:180px}
.ch-board:after{content:"";position:absolute;top:8px;right:8px;bottom:8px;left:8px;border-radius:23px;
  border:1.5px solid rgba(255,255,255,.22);pointer-events:none}
.ch-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;
  background:#FFFDF8;border-radius:12px;padding:4px 9px 3px;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.18);font-size:.62rem;font-weight:900;color:#8C681F;line-height:1.15;white-space:nowrap}
.ch-mid svg{display:block;margin:0 auto 1px}
.ch-tcard.won .ch-mid{font-size:.8rem;color:#0B2550}
.ch-pl{position:absolute;width:78px;height:78px}
.ch-tbl.sm .ch-pl{width:66px;height:66px}
.ch-pl > svg{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.ch-pl.ch-free > svg{filter:none}
.ch-pl.ch-q1{top:18px;right:20px}.ch-pl.ch-q2{top:18px;left:20px}
.ch-pl.ch-q3{bottom:18px;right:20px}.ch-pl.ch-q4{bottom:18px;left:20px}
.ch-tbl.sm .ch-pl.ch-q1,.ch-tbl.sm .ch-pl.ch-q2{top:14px}
.ch-tbl.sm .ch-pl.ch-q3,.ch-tbl.sm .ch-pl.ch-q4{bottom:14px}
.ch-food{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center}
.ch-food svg{width:44%;height:auto}
.ch-tick{position:absolute;bottom:0;left:0;width:24px;height:24px;border-radius:50%;background:#E5B854;
  border:2px solid #FFFDF8;display:flex;align-items:center;justify-content:center}
.ch-lb{position:absolute;width:110px;text-align:center;line-height:1.15}
.ch-tbl.sm .ch-lb{width:100px}
.ch-lb b{display:block;font-size:.88rem;font-weight:800;color:#0B2550}
.ch-lb i{display:block;font-style:normal;font-size:.7rem;font-weight:800}
.ch-lb.ch-q1{top:0;right:4px}.ch-lb.ch-q2{top:0;left:4px}
.ch-lb.ch-q3{bottom:0;right:4px}.ch-lb.ch-q4{bottom:0;left:4px}
.ch-lb.ch-free b{color:#9A8A68}
.ch-lb.ch-reg i{color:#3574CE}
.ch-lb.ch-part i{color:#B07A12}
.ch-lb.ch-done i{color:#2E6B12}
.ch-crown{display:inline-block;vertical-align:2px;margin-inline-start:4px;background:#C08F2B;color:#fff;
  font-size:.58rem;font-weight:900;border-radius:99px;padding:1px 7px;white-space:nowrap}
.ch-how{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin:6px 0 12px}
.ch-how div{width:86px;font-size:.74rem;font-weight:800;color:#5A6780;line-height:1.2}
.ch-how i{display:flex;width:38px;height:38px;margin:0 auto 4px;border-radius:50%;
  align-items:center;justify-content:center;background:#fff;box-shadow:0 1px 4px rgba(37,29,12,.14)}
.ch-how span{color:#C9B998;font-weight:900;padding-top:10px}
.ch-more{display:block;text-align:center;font-size:.86rem;font-weight:800;color:#17468F;margin:10px 0 0}
.ch-btn svg{vertical-align:-5px;margin-inline-end:8px}
.ch-btn.sm{display:inline-block;width:auto;flex:none;margin:0;padding:9px 12px;font-size:.88rem;border-radius:12px}
.ch-btn.sm svg{vertical-align:-3px;margin-inline-end:6px}
/* `ch-cta` ולא `big` — בבית יש `#done .big` (המספר הגדול), והוא גובר. */
.ch-btn.ch-cta{font-size:1.12rem;padding:15px 14px;box-shadow:0 6px 16px rgba(11,37,80,.25)}
.ch-btn.wa.ch-cta{box-shadow:0 6px 16px rgba(31,166,55,.32)}
.ch-next{background:#FFFDF8;border:1px solid #E5DAC3;border-radius:18px;padding:12px 14px 14px;margin:0 0 12px}
.ch-k{font-size:.74rem;font-weight:900;color:#C08F2B;letter-spacing:.06em}
.ch-row{display:flex;align-items:center;gap:10px;padding:9px 0;text-align:start}
.ch-row + .ch-row{border-top:1px dashed #E5DAC3}
.ch-pl.ch-mini{position:relative;width:40px;height:40px;flex:none}
.ch-pl.ch-mini > svg{filter:none}
.ch-pl.ch-mini.ch-free > svg circle{fill:#FFFDF8;stroke:#C9B998}
.ch-pl.ch-mini.ch-free > svg path{stroke:#B7A47C}
.ch-pl.ch-mini .ch-tick{width:16px;height:16px;border-width:1.5px}
.ch-pl.ch-mini .ch-tick svg{width:9px;height:9px}
.ch-rt{flex:1;font-size:.95rem;font-weight:800;line-height:1.25}
.ch-rt small{display:block;font-size:.76rem;color:#5A6780;font-weight:700}
.ch-lnk{display:flex;align-items:center;gap:8px;margin-top:10px;background:#fff;border:1.5px solid #E5DAC3;
  border-radius:13px;padding:5px 12px 5px 5px}
.ch-lnk code{flex:1;min-width:0;text-align:left;font:600 .82rem ui-monospace,monospace;color:#5A6780;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch-lnk button{flex:none;border:0;background:#EEF3FA;color:#17468F;font:inherit;font-weight:800;font-size:.86rem;
  border-radius:9px;padding:8px 12px;display:flex;gap:6px;align-items:center;cursor:pointer}
.ch-lnk button[disabled]{opacity:.5}
.ch-all .ch-row:first-of-type{margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap">
  <a class="back" id="back" href="join.html"></a>
  <div id="ch"></div>
  <footer><a href="info.html" id="info"></a></footer>
</main>
<script src="data.js"></script>
<script src="testmode.js"></script>
<script src="learned.js"></script>
<script src="logo.js"></script>
<script src="chal.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
/* המלל שנערך בניהול — אותן שתי שכבות של שאר העמודים. */
(function () {
  var take = function (map) {
    for (var k in (map || {})) {
      var p = k.split('.');
      if (p.length === 2 && p[0] === 'ui' && typeof map[k] === 'string' && map[k]) UI[p[1]] = map[k];
    }
  };
  try {
    take(JSON.parse(ls('df:textCache') || 'null'));
    take((JSON.parse(ls('df:cfg') || '{}')).texts);
  } catch (e) {}
})();
(function () { var l = $('hdr-mark'); if (l) l.src = LOGO_MARK; })();
$('brand').innerHTML = String(PROGRAM.short).replace(/[&<>]/g, '') + '<br>' +
  String(PROGRAM.name.slice(PROGRAM.short.length).trim()).replace(/[&<>]/g, '');
$('yr').textContent = String(UI.rstYear || '').replace('{y}', PROGRAM.year);
document.title = UI.chTitle + ' · ' + PROGRAM.short;
$('back').textContent = UI.chBack;
$('info').textContent = UI.chInfo;
/* מי שלא נרשם במכשיר הזה — אין לו "בית" לחזור אליו. */
if (!LMe()) $('back').style.display = 'none';
CHAL.page($('ch'));
</script>
</body>
</html>
