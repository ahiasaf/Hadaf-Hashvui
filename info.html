<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פרטים · הדף השבועי של בני עקיבא</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E2E63">
<style>
/* ============================================================
   עמוד הפרטים · /info

   אל תבלבל בינו לבין `rights.html` — זה מכתב הפנייה להוצאה,
   שנשלח פעם אחת. זה עמוד שמקושר מכל מסך.

   למה הכל כאן ולמה הנגישות בנפרד
   ------------------------------
   הצהרת הנגישות חייבת קישור משלה — תקנה 35 דורשת "מקום
   בולט", ולכן היא נשארה עומדת בפני עצמה, וכאן יש רק תמצית
   וקישור אליה. לשאר אין דרישת מיקום כלל: הודעת זכויות
   יוצרים אינה חובה בשום צורה (הזכות קמה עם היצירה, בלי
   רישום ובלי הודעה; ערכה ראייתי בלבד), וחובת היידוע על
   פרטיות מתקיימת בנקודת האיסוף — בטופס ההצטרפות, ששם היא
   כתובה. העמוד הזה הוא ההרחבה, לא התחליף.

   הסדר
   ----
   פרטיות ראשונה — זה מה שהורה בא לחפש. זכויות אחרונות,
   ובתוכן מי שנתן רשות קודם למי שבנה: כשהקורא מגיע לשורת
   ה-© האחרונה הוא כבר קרא שתיים כמותה, והיא נקראת כהשלמת
   רשימה ולא כהכרזה.

   סעיף הפרטיות מתאר את מה שקורה בפועל, כולל מה שפחות נוח:
   הצוות של כל מוסד רואה בלוח שמות מלאים וקצב לימוד, ושמות
   של זוכים ומצטיינים מתפרסמים. הצהרה שמסתירה את זה גרועה
   מאין הצהרה. אם ישתנה שדה בטופס, או מה שהלוח מציג, או מה
   שמתפרסם — לתקן כאן ובהודעה שבטופס ההצטרפות, שהיא נקודת
   האיסוף ולכן היא זו שמחויבת חוקית.

   הכל ניתן לעריכה מהניהול דרך שלוש השכבות של textedit.js,
   כדי שסעיף הביאור של הרכז יוכל להתמלא ביום שהוא יעלה בלי
   גרסה חדשה.
   ============================================================ */
:root{
  --blue:#17468F; --blue-d:#0B2550; --gold:#C08F2B;
  --paper:#F6F1E6; --surface:#FFFDF8; --ink:#1B2A45; --ink-2:#5A6780;
  --ink-3:#5C687E; --rule:#E5DAC3;
}
*{box-sizing:border-box}
img:not([src]){visibility:hidden}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.9;
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:36rem;margin:0 auto;padding:0 22px 54px}

header{background:linear-gradient(150deg,var(--blue-d),var(--blue));color:#fff;
  padding:calc(env(safe-area-inset-top) + 26px) 20px 28px;text-align:center}
header img{height:44px;margin-bottom:10px}
header h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}

.lead{font-size:1.02rem;color:var(--ink-2);margin:26px 0 0}

h2{font-size:1.02rem;font-weight:800;color:var(--blue-d);
  margin:32px 0 6px;letter-spacing:-.02em}
p{margin:0}
.body{font-size:.96rem;color:var(--ink-2);white-space:pre-line}
.body b{font-weight:800;color:var(--ink)}
a{color:var(--blue);font-weight:700}
.go{display:inline-block;margin-top:6px;font-size:.94rem}

/* שלושת הקרדיטים. אותה צורה לשלושתם — וזו הצורה שמשווה
   בין מי שנתן למי שבנה. */
.item{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:16px 18px;margin-top:12px}
.item h3{margin:0;font-size:.98rem;font-weight:800;color:var(--blue-d);
  letter-spacing:-.02em}
.item .line{margin:4px 0 0;font-size:.95rem;font-weight:700}
.item .note{margin:5px 0 0;font-size:.9rem;color:var(--ink-2);
  white-space:pre-line}
.item .note b{color:var(--ink)}
.item .txt{margin:5px 0 0;font-size:.93rem;color:var(--ink-2);
  white-space:pre-line}

.ver{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;
  display:inline-block;font-size:1.02rem;font-weight:700;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:8px;
  padding:3px 11px}

:focus-visible{outline:3px solid #fff;outline-offset:0;
  box-shadow:0 0 0 6px #0B2550}

hr{border:0;border-top:1px solid var(--rule);margin:34px 0 0}
footer{text-align:center;color:var(--ink-3);font-size:.82rem;font-weight:600;
  margin-top:22px;line-height:1.9}
footer a{color:var(--ink-2)}
</style>
</head>
<body>

<header>
  <img id="logo" alt="בני עקיבא">
  <h1 id="t-title">פרטים</h1>
</header>

<main class="wrap">

  <p class="lead" id="t-lead"></p>

  <h2 id="h-priv"></h2>
  <p class="body" id="t-priv"></p>

  <h2 id="h-a11y"></h2>
  <p class="body" id="t-a11y"></p>
  <a class="go" href="accessibility.html" id="t-a11yGo"></a>

  <h2 id="h-cred"></h2>
  <p class="body" id="t-cred"></p>

  <div class="item">
    <h3 id="t-gemH"></h3>
    <p class="line" id="t-gem"></p>
    <p class="note" id="t-gemNote"></p>
    <p class="note" id="gem-buy"></p>
  </div>

  <div class="item">
    <h3 id="t-chavH"></h3>
    <p class="line" id="t-chav"></p>
    <p class="note" id="t-chavNote"></p>
  </div>

  <!-- הביאור של הרכז. ריק כל עוד לא עלה, ואז אינו מוצג כלל —
       עדיף בלי סעיף מסעיף שממתין למילוי. -->
  <div class="item" id="own-card" hidden>
    <h3 id="t-ownH"></h3>
    <p class="line" id="t-ownLine"></p>
    <p class="note" id="t-own"></p>
  </div>

  <div class="item">
    <h3 id="t-dafH"></h3>
    <p class="txt" id="t-daf"></p>
    <p class="line" id="t-dafLine"></p>
  </div>

  <h2 id="h-ver"></h2>
  <p><span class="ver" id="ver"></span></p>
  <p class="body" id="t-verBy" style="margin-top:5px"></p>

  <hr>
  <footer>
    רשת ישיבות בני עקיבא · הדף השבועי · תשפ״ז<br>
    <a href="accessibility.html">הצהרת נגישות</a>
  </footer>
</main>

<script src="a11y.js"></script>
<script src="data.js"></script>
<script src="textedit.js"></script>
<script src="logo.js"></script>
<script>
document.getElementById('logo').src = window.LOGO_FULL || window.LOGO_MARK || '';

function draw() {
  var I = window.INFO || {};
  var keys = ['title','lead','priv','a11y','a11yGo','cred',
              'gemH','gem','gemNote','chavH','chav','chavNote',
              'ownH','own','ownLine','dafH','daf','dafLine','verBy'];
  keys.forEach(function (k) {
    var el = document.getElementById('t-' + k);
    if (el) el.innerHTML = I[k] || '';
  });
  var heads = [['priv', I.privH], ['a11y', I.a11yH],
               ['cred', I.credH], ['ver', I.verH]];
  heads.forEach(function (h) {
    var el = document.getElementById('h-' + h[0]);
    if (el) el.innerHTML = h[1] || '';
  });
  document.title = (I.title || 'פרטים') + ' · הדף השבועי של בני עקיבא';

  /* שדה שרוקן בניהול לא ישאיר רווח: פסקה ריקה עדיין נושאת
     שוליים, ואז נראה כאילו חסר שם משהו. */
  ['lead','verBy','dafLine'].forEach(function (k) {
    var el = document.getElementById('t-' + k);
    if (el) el.hidden = !(el.innerHTML || '').replace(/\s|&nbsp;/g, '');
  });

  /* קישור הרכישה — בקשה של ההוצאה, ולכן קישור ולא טקסט.
     כתובת ריקה = בלי קישור, ולא קישור מומצא. */
  var buy = document.getElementById('gem-buy');
  buy.innerHTML = (I.gemUrl && I.gemBuy)
    ? '<a href="' + I.gemUrl + '" target="_blank" rel="noopener">' +
      I.gemBuy + ' ←</a>'
    : '';

  /* כרטיס הביאור מופיע רק כשיש בו תוכן */
  document.getElementById('own-card').hidden =
    !((I.ownH || '').trim() || (I.own || '').trim());

  /* הגרסה מגיעה מ-DAF_REV, שהוא אחד מארבעת המספרים שחייבים
     להיות זהים — ולכן הוא תמיד אותו מספר שבמסך הראשי. */
  document.getElementById('ver').textContent = 'v' + (window.DAF_REV || '');
}
function relayer() { TX.layer(TX.published(), TX.draft()); draw(); }
relayer();

TX.init({ repaint: draw, onStop: function () { location.href = './#admin'; } });

/* ומה שפורסם בגיליון — לכל מי שאינו הרכז. */
(function () {
  var id = window.SHEET_ID;
  try {
    var c2 = JSON.parse(localStorage.getItem('df:cfg') || '{}');
    if (c2.sheetId) id = c2.sheetId;
  } catch (e) {}
  if (!id || !navigator.onLine) return;
  fetch('https://docs.google.com/spreadsheets/d/' + id +
        '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent('טקסטים') +
        '&t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) {
      if (!t) return;
      var map = {}, rows = [], row = [], f = '', q = false;
      for (var i = 0; i < t.length; i++) {
        var ch = t[i];
        if (q) {
          if (ch === '"' && t[i+1] === '"') { f += '"'; i++; }
          else if (ch === '"') q = false; else f += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { row.push(f); f = ''; }
        else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
        else if (ch !== '\r') f += ch;
      }
      if (f || row.length) { row.push(f); rows.push(row); }
      /* כותרת שאינה מוכרת = לא הלשונית שביקשנו. לא נוגעים. */
      if (!rows.length || rows[0].join('|').indexOf('מפתח') < 0) return;
      rows.slice(1).forEach(function (r2) {
        var k = (r2[0] || '').trim(), v = (r2[1] || '').trim();
        if (k && v) map[k] = v;
      });
      try { localStorage.setItem('df:textCache', JSON.stringify(map)); } catch (e) {}
      relayer();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
