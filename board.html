<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הלוח — הדף השבועי של בני עקיבא</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E2E63">
<meta name="robots" content="noindex">
<style>
/* ============================================================
   הלוח של ראש החטיבה.

   קישור קבוע אחד למוסד: board.html?inst=avir

   מספרים בלבד — וזו החלטה, לא חוסר.
   ------------------------------------
   הקישור הזה מועבר. ראש חטיבה שולח לר״ם, ר״ם לר״ם אחר, ומישהו
   מדביק אותו בקבוצה. אם הוא היה מכיל שמות של תלמידים, כל
   העברה כזו הייתה דליפה של רשימת קטינים — בדיוק מה שהגיליון
   הפרטי והסיסמה באו למנוע. לכן הוא קורא **רק** מהלשוניות
   הציבוריות, שיש בהן קוד ישיבה ומספר.

   השמות יושבים בפאנל הניהול של הרכז, מאחורי סיסמת הקריאה.

   וזה גם המקום שבו הוא מוצא שוב את קישור ההצטרפות: קישור אחד
   לזכור במקום שניים.
   ============================================================ */
:root{
  --blue:#17468F; --blue-d:#0B2550; --blue-l:#3574CE;
  --green:#6FA83B; --green-d:#467B1A;
  --gold:#C08F2B; --gold-l:#E5B854; --gold-t:#8C681F;
  --paper:#F6F1E6; --surface:#FFFDF8; --sunk:#EFE6D3;
  --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#5C687E; --rule:#E5DAC3;
  --r:16px; --r-s:12px;
  --sh-1:0 1px 2px rgba(37,29,12,.05), 0 2px 8px rgba(37,29,12,.05);
  --sh-2:0 2px 4px rgba(37,29,12,.06), 0 10px 26px rgba(37,29,12,.08);
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:"Assistant","Segoe UI","Noto Sans Hebrew","Arial Hebrew",system-ui,sans-serif}

/* תמונה שעוד אין לה כתובת — לא מציגים סימן שבור.
   הלוגו מוטמע ב-logo.js, והקובץ הזה שוקל 88KB ומגיע מהרשת.
   עד שהוא נוחת, ל-<img> אין src בכלל — והדפדפן מצייר במקומו
   ריבוע שבור. בקליטה טובה זה מהבהב לרגע; בקליטה חלשה זה מה
   שרואים במשך שניות, ובדיוק במסך הראשון של האפליקציה.

   visibility ולא display: המסגרת שומרת על מקומה, ולכן כשהלוגו
   מגיע שום דבר לא קופץ. */
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.6;
  padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}

/* ---------- חתימת התוכנית ----------
   זהה לעמוד הראשי. הסמל העגול על רקע לבן, השם בשתי שורות,
   ומתחת — הישיבה או השנה. */
/* הפס הכחול ירד. הוא הפך את הכותרת לרצועה נפרדת שיושבת מעל
   העמוד במקום להיות חלק ממנו — ובעמוד הראשי הסמל פשוט צף על
   אותו רקע קרם כמו כל השאר. אותה כותרת, אותו רקע, אותם צבעים. */
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:18px 14px 20px;
  max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);
  letter-spacing:.05em;margin-top:3px}

.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:18px;margin-top:14px;box-shadow:var(--sh-1)}
.card h2{font-size:.98rem;font-weight:800;letter-spacing:-.02em}
.card .h{font-size:.8rem;font-weight:600;color:var(--ink-3);margin-top:3px;line-height:1.6}

/* שלושת המספרים. גדולים, כי הם הסיבה שהוא פתח את הדף. */
/* ---------- הכותרת של הלוח ----------
   קודם ישבו כאן שלוש משבצות מספרים, ומתחתיהן שלוש משבצות מסגרות:
   שלוש מתחת לשלוש, ואחת מהן — "אבות ובנים" — הופיעה פעמיים.

   מה שראש חטיבה באמת פותח את הלוח כדי לדעת הוא שאלה אחת: **כמה
   למדו את הדף של השבוע**. לכן היא לבדה למעלה, ובגודל שאומר שהיא
   העיקר. "מצטרפים" הוא הקשר שלה ולא מספר מתחרה, ולכן הוא שורה
   קטנה מתחתיה. */
.hero{margin-top:16px;background:linear-gradient(160deg,var(--blue-d),var(--blue));
  color:#fff;border-radius:var(--r-m, 20px);padding:18px;box-shadow:var(--sh-2);
  display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
  width:100%;text-align:start;border:0;font:inherit}
.hero .tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;
  background:rgba(255,255,255,.16);border-radius:20px;padding:3px 9px}
.hero h3{font-size:1.24rem;font-weight:800;letter-spacing:-.03em;margin-top:7px}
.hero .lead{font-size:.92rem;font-weight:700;margin-top:5px;color:rgba(255,255,255,.88)}
.hero .lead b{font-size:1.05rem}
.hero .sub{font-size:.75rem;font-weight:700;margin-top:7px;color:rgba(255,255,255,.62)}
/* בשורה ולא בפינה. מיקום מוחלט הניח שיש מקום פנוי מתחת לטקסט,
   ובשם ישיבה ארוך הוא פשוט התיישב עליו. */
.hero .chev{display:inline-block;margin-top:9px;font-size:.75rem;font-weight:800;
  color:#fff;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 11px}
button.hero{cursor:pointer}
button.hero:active{transform:scale(.99)}
/* הטבעת. מספר לבדו הוא נתון; טבעת שמתמלאת היא מצב — ורואים
   אותה בלי לקרוא. */
.ring{flex:0 0 auto;position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(255,255,255,.18);stroke-width:9}
.ring .fg{fill:none;stroke:var(--gold-l, #E3B44A);stroke-width:9;stroke-linecap:round;
  transition:stroke-dasharray .7s cubic-bezier(.3,.1,.2,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1}
.ring .mid b{font-size:1.5rem;font-weight:800;letter-spacing:-.04em}
.ring .mid span{font-size:.66rem;font-weight:800;color:rgba(255,255,255,.72);
  margin-top:3px;white-space:nowrap}

/* פילוח. מוט ולא עוגה: השוואה בין שכבות נקראת בעין בשורות
   באורך שונה, ובעוגה צריך לפענח אותה. */
.bars{margin-top:12px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:2.6rem 1fr 2rem;align-items:center;gap:9px}
.bar .k{font-size:.84rem;font-weight:800;color:var(--ink-2)}
.bar .t{height:9px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,var(--blue-l),var(--blue))}
.bar .n{font-size:.84rem;font-weight:800;text-align:start}

.wk{margin-top:12px;padding-top:13px;border-top:1px solid var(--rule)}
.wk b{font-size:1.02rem;font-weight:800}
.wk .of{font-size:.88rem;font-weight:700;color:var(--ink-2);margin-top:3px}

.btn{display:block;width:100%;text-align:center;font-size:.98rem;font-weight:800;
  border:0;border-radius:14px;padding:15px;margin-top:11px;cursor:pointer;
  font-family:inherit;color:#fff;text-decoration:none;
  background:linear-gradient(140deg,var(--green),var(--green-d));
  box-shadow:0 6px 18px rgba(74,130,28,.26)}
.btn.g{background:var(--sunk);color:var(--ink-2);box-shadow:none}
/* כחול לצוות, ירוק לתלמידים. ההבדל הוא לא קישוט: שני קישורים
   שנראים אותו דבר הם הזמנה לשלוח את הלא־נכון, וזו טעות שאי
   אפשר להחזיר ממנה. הצבע, הכותרת והפס בצד עושים את ההבחנה
   לפני שקוראים מילה. */
.btn.b{background:linear-gradient(140deg,var(--blue-l),var(--blue));
  box-shadow:0 6px 18px rgba(23,70,143,.26)}
/* הכרטיס המשני. שקט יותר מזה שמעליו — הוא רשת ביטחון, לא
   פעולה שמחפשים. */
.card.team{background:var(--sunk);box-shadow:none;border:1px solid var(--rule)}
.card.team h2{color:var(--ink-2)}
.card.team .btn{padding:12px;font-size:.9rem}
.card.team .url{background:var(--surface)}
.url{margin-top:11px;background:var(--sunk);border-radius:10px;padding:9px 11px;
  font-size:.76rem;font-weight:700;color:var(--ink-2);direction:ltr;text-align:left;
  overflow-wrap:anywhere;line-height:1.5}

/* ---------- שלוש המסגרות ----------
   משבצת עם אייקון ומספר, ולא צ'יפ עם תווית. האיור הוא מה שמבדיל
   בין שלוש הקטגוריות בסריקה של חצי שנייה, והמספר הוא מה שהופך
   את המשבצת ממילה למשפט. */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.tile{position:relative;text-align:center;padding:13px 6px 11px;border-radius:13px;
  border:1px solid var(--rule);background:var(--surface);font-family:inherit;
  display:block;width:100%;transition:transform .14s,box-shadow .14s}
.tile.go{cursor:pointer;box-shadow:var(--sh-1)}
.tile.go:active{transform:scale(.975)}
.tile svg{width:26px;height:26px;fill:var(--c);opacity:.92}
.tile b{display:block;font-size:1.5rem;font-weight:800;line-height:1.05;
  color:var(--c);letter-spacing:-.03em;margin-top:6px}
.tile span{display:block;font-size:.71rem;font-weight:800;color:var(--ink-2);
  margin-top:3px;line-height:1.3}
.chev{font-style:normal;color:var(--ink-3);font-size:.8rem;font-weight:800}
.tile .chev{position:absolute;inset-block-start:8px;inset-inline-start:9px;
  font-size:.72rem}

/* הפס השבועי כפתור — אותו מראה, ועכשיו הוא נפתח */
/* כשהוא נפתח הוא חייב להיראות כמו משהו שנפתח. פס אפור עם חץ
   קטן נקרא כטקסט, ואיש לא לוחץ על טקסט. */
.wk.go{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;text-align:start;cursor:pointer;font-family:inherit;font-size:inherit;
  margin-top:12px;padding:12px 13px;border:1px solid var(--rule);
  border-radius:12px;background:var(--sunk);transition:transform .14s}
.wk.go:active{transform:scale(.99)}
.wk.go .chev{font-size:1rem;color:var(--blue)}
/* הפירוט נפתח מתחת למה שנלחץ, ולא מחליף את המסך. שתי השאלות —
   "כמה" ו"מי" — הן אותה שאלה בשתי רמות, ומסך שמחליף מסך הפך
   אותן לשני מקומות שצריך לנווט ביניהם. */
.open{margin-top:11px;border-top:1px solid var(--rule);padding-top:11px;
  animation:opIn .22s ease-out}
@keyframes opIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.tile.sel{outline:2px solid var(--c);outline-offset:-2px}
/* מי שבאמצע — פס דק מתחת לשם. לא אחוז, ולא צבע שני שמתחרה
   בירוק של מי שסיים: זהב, כלומר בדרך. */
.pbar{margin-top:6px;height:5px;border-radius:5px;background:var(--sunk);
  overflow:hidden;max-width:190px}
.pbar i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--gold-l, #E3B44A),var(--gold, #C08F2B));
  transition:width .7s cubic-bezier(.3,.1,.2,1)}
.prow.mid .tick{background:rgba(192,143,43,.18);border-color:rgba(192,143,43,.45)}

/* ---------- מסך הפירוט ----------
   שם אחד בשורה, וסימן אחד. הרכז סורק ומחפש את מי שלא סימן —
   ולכן ה-✓ הוא מה שבולט, ולא הצבע של השורה. */
.detail .back{background:none;border:0;color:var(--blue);font-weight:800;
  font-size:.83rem;font-family:inherit;cursor:pointer;padding:0 0 9px}
.keyline{margin-top:11px;font-size:.78rem;font-weight:700;color:var(--ink-3);
  line-height:1.65;background:var(--sunk);border-radius:11px;padding:10px 12px}
.klink{display:block;margin-top:7px;background:none;border:0;padding:0;
  color:var(--blue);font-weight:800;font-size:.8rem;font-family:inherit;
  cursor:pointer;text-decoration:underline}
.wgrp{font-size:.74rem;font-weight:800;color:var(--ink-3);letter-spacing:.02em;
  margin:13px 0 3px;padding-top:10px;border-top:1px solid var(--rule)}
.wgrp:first-of-type{margin-top:6px;padding-top:0;border-top:0}
.prow{display:flex;align-items:center;gap:9px;padding:8px 0;
  border-bottom:1px solid var(--rule);font-size:.92rem}
.prow:last-child{border-bottom:0}
.prow b{font-weight:800}
.prow .s{font-size:.76rem;font-weight:700;color:var(--ink-3);margin-top:1px}
.prow .tick{flex:none;width:22px;height:22px;border-radius:50%;
  background:var(--sunk);color:transparent;display:flex;align-items:center;
  justify-content:center;font-size:.8rem;font-weight:800}
.prow.did .tick{background:var(--green);color:#fff}
.empty{text-align:center;padding:8px 0 4px}
.empty .big{font-size:2.2rem;line-height:1}
.empty p{font-size:.9rem;font-weight:700;color:var(--ink-2);margin-top:9px;line-height:1.7}

.soon{margin-top:14px;font-size:.82rem;font-weight:700;color:var(--ink-3);
  text-align:center;line-height:1.7}
footer{text-align:center;color:var(--ink-3);font-size:.76rem;font-weight:700;
  margin-top:22px;line-height:1.9}
footer b{display:block;color:var(--ink-2)}
footer a{color:var(--ink-2);font-weight:800}
</style>
</head>
<body>

<!-- אותה חתימה שיש בעמוד הראשי: הסמל העגול, "הדף השבועי של
     בני עקיבא", והשנה. זה הפנים של התוכנית, ואין סיבה שמסך
     אחד ייראה אחרת מהשני. -->
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1>הדף השבועי<br>של בני עקיבא</h1>
      <div class="yr" id="sub">שנת תשפ"ז</div></div>
  </div>
</header>

<main class="wrap" id="body"></main>

<div class="wrap"><footer>
  <b id="foot-how"></b>
  רשת ישיבות בני עקיבא · הדף השבועי · תשפ״ז<br>
  <a href="accessibility.html">הצהרת נגישות</a> · <a href="info.html">פרטים</a>
</footer></div>

<script src="a11y.js"></script>
<script src="data.js"></script>
<script src="learned.js"></script>
<script src="logo.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function qs(k) {
  var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) {
    return v[k] != null ? v[k] : m;
  });
}
(function () { var l = $('hdr-mark'); if (l) l.src = LOGO_MARK; })();

/* ---------- הישיבה ---------- */
var code = qs('inst'), inst = null;
for (var i = 0; i < INSTITUTIONS.length; i++)
  if (INSTITUTIONS[i].code === code) inst = INSTITUTIONS[i];

/* ============================================================
   קוד הגישה.

   `?inst=avir` לבדו אינו סוד — הוא שם הישיבה, ואפשר לנחש אותו.
   כל עוד הלוח היה מספרים בלבד זה הספיק. ברגע שיש בו שמות של
   תלמידים זה כבר לא, ולכן הקישור האישי נושא `&k=`.

   שלוש דקויות שנקבעו כאן:

   1. **הקוד נשמר במכשיר בפתיחה הראשונה ומנוקה מהכתובת.** הלוח
      הוא מסך שמצלמים ומראים, ו-URL עם קוד בתוכו הוא קוד שדולף
      בצילום מסך. אחרי הביקור הראשון הכתובת נקייה והלוח ממשיך
      לעבוד.

   2. **הקוד שייך למוסד ולא לאדם.** אין הרשמה, אין סיסמה אישית,
      ובישיבה שיש בה כמה אנשי צוות פשוט מעבירים את הקישור הלאה.

   3. **הזנה ידנית כגיבוי.** אפליקציה שנוספה למסך הבית מחזיקה
      אחסון נפרד מהדפדפן, ולכן מי שפתח את הקישור בספארי ואז פתח
      את האפליקציה — לא ימצא שם את הקוד. שש אותיות פותרות את זה
      בלי לחזור לרכז.
   ============================================================ */
function accKey() { return 'boardKey:' + code; }
var acc = '';
try { acc = localStorage.getItem(accKey()) || ''; } catch (e) {}

(function () {
  var k = qs('k');
  if (!k) return;
  acc = k;
  try { localStorage.setItem(accKey(), k); } catch (e) {}
  /* מנקים את הכתובת בלי לטעון מחדש. replaceState ולא assign —
     כפתור "אחורה" לא אמור להחזיר לגרסה שיש בה קוד. */
  try {
    if (history.replaceState) {
      history.replaceState(null, '',
        location.pathname + '?inst=' + encodeURIComponent(code));
    }
  } catch (e2) {}
})();

/* ---------- קריאה מהגיליון הציבורי ----------
   אותן שתי לשוניות שמסך ההצטרפות קורא, ומאותה סיבה: מספרים
   בלבד. */
function sheetCsv(tab) {
  var id = (LGet('cfg', {}) || {}).sheetId || SHEET_ID;
  if (!id || !navigator.onLine) return Promise.resolve(null);
  return fetch('https://docs.google.com/spreadsheets/d/' + id +
               '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(tab) +
               '&t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) { return t ? csv(t) : null; })
    .catch(function () { return null; });
}
function csv(text) {
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

/* "ח׳:11 · ט׳:7" → [['ח׳',11],['ט׳',7]] — הצורה שהסקריפט כותב,
   כדי שפילוח לא ידרוש עמודה לכל שכבה. */
function pairs(t) {
  return String(t || '').split('·').map(function (p) {
    var i = p.lastIndexOf(':');
    return i < 0 ? null : [p.slice(0, i).trim(), parseInt(p.slice(i + 1), 10) || 0];
  }).filter(function (x) { return x && x[0] && x[1]; });
}

var joined = LGet('boardCache', null);
function loadBoard() {
  return Promise.all([
    sheetCsv('מונים').then(function (rows) {
      /* `!rows` = הקריאה נכשלה, ואז לא נוגעים במטמון. לשונית עם
         כותרת בלבד היא קריאה שהצליחה ותשובתה אפס — וזה בדיוק
         המצב אחרי מחיקת כל הרשומות של ישיבה. התנאי הקודם
         (`< 2`) בלע את שניהם, ולכן המספר הישן שרד את המחיקה. */
      if (!rows || !rows.length) return;
      var head = rows[0], ix = {};
      for (var i = 0; i < head.length; i++) ix[String(head[i]).trim()] = i;
      if (ix['קוד ישיבה'] === undefined) return;      /* לא הלשונית שביקשנו */
      /* אפס ולא "להשאיר כמו שהיה". כשכל הרשומות של ישיבה נמחקות
         היא נעלמת מהלשונית לגמרי, ולולא זה הלוח היה ממשיך להראות
         את המספר הישן לנצח — וזה בדיוק מה שקרה. */
      var hit = null;
      for (var r = 1; r < rows.length; r++) {
        if (String(rows[r][ix['קוד ישיבה']] || '').trim() !== code) continue;
        hit = { n: parseInt(rows[r][ix['מצטרפים']], 10) || 0,
                grades: pairs(rows[r][ix['שכבות']]),
                ways:   pairs(rows[r][ix['מסגרות']]) };
      }
      joined = hit || { n:0, grades:[], ways:[] };
      LSet('boardCache', joined);
    }),
    sheetCsv('מוני-לימוד').then(function (rows) {
      var m = LCountsFrom(rows);
      if (m) LSet('learnCount', m);        /* `{}` הוא תשובה, לא כישלון */
    })
  ]).catch(function () {});
}

/* ============================================================
   הרשימה השמית — רק עם הקוד.

   המספרים באים מהלשוניות הציבוריות ואינם דורשים דבר. השמות
   באים מהגיליון הסגור, דרך הסקריפט, והקוד הוא מה שפותח אותם.
   מה שחוזר משם הוא שם פרטי, שכבה, מסגרת, ואילו שבועות סומנו —
   בלי משפחה ובלי טלפון. קישור שדלף חושף "יונתן, ז׳, לומד לבד",
   ולא רשימת קטינים שאפשר ליצור איתם קשר.
   ============================================================ */
var API_URL = (LGet('cfg', {}) || {}).api || APPS_SCRIPT_URL || '';
var roster = LGet('rosterCache:' + code, null);
var rosterMsg = '';

/* Apps Script מפנה את /exec לדומיין אחר, ויש דפדפנים שחוסמים
   את הקריאה בגלל CORS. תגית script אינה כפופה לו כלל. */
function jsonp(url) {
  return new Promise(function (ok) {
    var name = '__brd' + Date.now(), t, sc = document.createElement('script');
    var done = function (v) {
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      clearTimeout(t); if (sc.parentNode) sc.remove(); ok(v);
    };
    t = setTimeout(function () { done(null); }, 12000);
    window[name] = function (d) { done(d); };
    sc.onerror = function () { done(null); };
    sc.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + name;
    document.body.appendChild(sc);
  });
}
function askScript(params) {
  if (!API_URL) return Promise.resolve(null);
  var q = Object.keys(params).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  var url = API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + q;
  return fetch(url).then(function (r) { return r.json(); })
    .catch(function () { return jsonp(url); });
}

function loadRoster() {
  if (!acc) return Promise.resolve(null);
  return askScript({ board:code, k:acc }).then(function (d) {
    if (!d) { rosterMsg = 'לא קיבלתי תשובה מהשרת.'; return null; }
    if (d.status !== 'ok') {
      /* קוד שגוי אינו נשמר — אחרת הוא היה נדבק למכשיר ומונע
         מהקישור הנכון לעבוד בפעם הבאה. */
      if (d.status === 'denied') {
        acc = ''; try { localStorage.removeItem(accKey()); } catch (e) {}
      }
      rosterMsg = d.message || 'לא הצלחתי לפתוח את הרשימה.';
      return null;
    }
    roster = d.students || [];
    rosterMsg = '';
    LSet('rosterCache:' + code, roster);
    return roster;
  }).catch(function () { rosterMsg = 'לא קיבלתי תשובה מהשרת.'; return null; });
}

function keyAsk() {
  var v = prompt('הזינו את קוד הגישה של הישיבה (שש אותיות):', '');
  if (v == null) return;
  v = String(v).trim().toLowerCase();
  if (!v) return;
  acc = v;
  try { localStorage.setItem(accKey(), v); } catch (e) {}
  rosterMsg = 'בודק…'; draw();
  loadRoster().then(draw);
}

/* ============================================================
   לוח שליטה, לא רשימה.

   הרשימה השמית הייתה נכונה לארבעה תלמידים ושגויה לעשרים. מה
   שראש חטיבה מסתכל עליו כל יום הוא **כמה**, ומה שהוא מחפש פעם
   בשבוע הוא **מי** — ושתי השאלות אינן צריכות לחלוק מסך.

   לכן המסך הראשון הוא שלוש משבצות עם מספר, והשמות נמצאים
   לחיצה אחת מכאן. משבצת בלי מספר היא תווית; משבצת עם מספר היא
   משפט — "שלושה אבות ובנים" הוא מה שמתחילים ממנו שיחה.

   האיורים אינם קישוט. הם מה שמבדיל בין שלוש קטגוריות בסריקה
   של חצי שנייה, והם משאירים את המסך צעיר בלי לרדת לאמוג'י.
   ============================================================ */
var WAYS = [
  /* גדול וקטן, ורווח ביניהם — בלי הרווח הם נקראים ככתם אחד */
  ['אבות ובנים', 'אבות ובנים', 'var(--gold)',
   '<circle cx="5.6" cy="5" r="3"/>' +
   '<path d="M1 17.5c0-3 2-4.8 4.6-4.8s4.6 1.8 4.6 4.8z"/>' +
   '<circle cx="15" cy="8.4" r="2.2"/>' +
   '<path d="M11.4 17.5c0-2.1 1.6-3.5 3.6-3.5s3.6 1.4 3.6 3.5z"/>'],
  /* שלושה בשורה עם כתף אחת משותפת — חבורה, לא נקודות */
  ['חבורת לימוד', 'חבורות', 'var(--green-d)',
   '<circle cx="4.4" cy="6.4" r="2.3"/><circle cx="10" cy="5.6" r="2.6"/>' +
   '<circle cx="15.6" cy="6.4" r="2.3"/>' +
   '<path d="M.8 17.2c0-3 4.1-4.9 9.2-4.9s9.2 1.9 9.2 4.9z"/>'],
  ['לימוד עצמי', 'לומדים לבד', 'var(--blue)',
   /* פער בשדרה. בלעדיו שני חצאי הספר נוגעים, וב-26 פיקסלים הם
      נקראים כמלבן כהה ולא כספר פתוח. */
   '<path d="M2.4 4.6c2.4-1.1 4.5-1.1 6.9 0v11.2c-2.4-1.1-4.5-1.1-6.9 0z"/>' +
   '<path d="M17.6 4.6c-2.4-1.1-4.5-1.1-6.9 0v11.2c2.4-1.1 4.5-1.1 6.9 0z"/>']
];
function wayLbl(w) {
  for (var i = 0; i < WAYS.length; i++) if (WAYS[i][0] === w) return WAYS[i][1];
  return w || 'לא צוין';
}

var view = '';                 /* '' · 'way:<מסגרת>' · 'week' */
/* לחיצה שנייה על אותו דבר סוגרת. הלוח נשאר במקומו, ולכן אין
   לאן "לחזור" — וכפתור חזרה שמוביל למקום שאף פעם לא עזבת הוא
   בדיוק מה שהופך שתי רמות של אותה שאלה לשני מסכים. */
function go(v) {
  view = (view === v) ? '' : v;
  draw();
  if (view) setTimeout(function () {
    var el = document.querySelector('.open');
    if (el && el.scrollIntoView) el.scrollIntoView({ block:'nearest', behavior:'smooth' });
  }, 40);
}

function didWeek(p) {
  var wk = LWeek();
  if (wk < 0) return false;
  for (var i = 0; i < (p.weeks || []).length; i++)
    if (String(p.weeks[i]).split('|')[1] === String(wk + 1)) return true;
  return false;
}

/* המספרים למשבצות. כשיש רשימה שמית סופרים ממנה, ואחרת מלשונית
   "מונים" — כדי שמי שאין לו קוד עדיין יראה מספרים ולא ריק. */
function wayCount(w) {
  if (roster) {
    var n = 0;
    roster.forEach(function (p) { if ((p.way || '') === w) n++; });
    return n;
  }
  var hit = 0;
  ((joined && joined.ways) || []).forEach(function (p) { if (p[0] === w) hit = p[1]; });
  return hit;
}

function tilesHtml() {
  var can = !!roster;
  return '<div class="tiles">' + WAYS.map(function (g) {
    var n = wayCount(g[0]);
    return '<' + (can && n ? 'button' : 'div') + ' class="tile' +
      (can && n ? ' go' : '') + (view === 'way:' + g[0] ? ' sel' : '') +
      '" style="--c:' + g[2] + '"' +
      (can && n ? ' onclick="go(\'way:' + g[0] + '\')"' : '') + '>' +
      '<svg viewBox="0 0 20 20">' + g[3] + '</svg>' +
      '<b>' + n + '</b><span>' + esc(g[1]) + '</span>' +
      (can && n ? '<i class="chev">' + (view === 'way:' + g[0] ? '×' : '←') + '</i>' : '') +
      '</' + (can && n ? 'button' : 'div') + '>';
  }).join('') + '</div>';
}

/* פירוט: שמות של מסגרת אחת, או של מי שלמד השבוע. */
/* הפירוט נפתח בתוך הכרטיס שנלחץ. אין כותרת חוזרת ואין כפתור
   חזרה — מה שמעליו עדיין על המסך ואומר את שניהם. */
function weekOpenHtml() {
  if (!roster) return '';
  /* שלוש קבוצות ולא שתיים. "לא סיים" ו"לא התחיל" הם שני מצבים
     שונים לגמרי, ורק אחד מהם הוא מי שכדאי להזכיר לו. */
  var did = roster.filter(didWeek);
  var mid = roster.filter(function (p) { return !didWeek(p) && frac(p) > 0; });
  var non = roster.filter(function (p) { return !didWeek(p) && !frac(p); });
  return '<div class="open">' +
    (did.length ? '<div class="wgrp">סיימו · ' + did.length + '</div>' +
                  did.map(function (q) { return pRow(q); }).join('') : '') +
    (mid.length ? '<div class="wgrp">באמצע הדף · ' + mid.length + '</div>' +
                  mid.map(function (q) { return pRow(q); }).join('') : '') +
    (non.length ? '<div class="wgrp">עדיין לא פתחו · ' + non.length + '</div>' +
                  non.map(function (q) { return pRow(q); }).join('') : '') +
    '<p class="h" style="margin-top:10px">"סיים" = הגיע לסוף הדף האינטראקטיבי, ' +
    'ענה על החידה השבועית, או סימן בעצמו.</p></div>';
}
function wayOpenHtml() {
  if (!roster || view.indexOf('way:') !== 0) return '';
  var w = view.slice(4);
  var list = roster.filter(function (p) { return (p.way || '') === w; });
  var byGrade = {}, gord = [];
  list.forEach(function (p) {
    var g = p.grade || 'ללא שכבה';
    if (!byGrade[g]) { byGrade[g] = []; gord.push(g); }
    byGrade[g].push(p);
  });
  gord.sort();
  return '<div class="open">' +
    '<div class="wgrp">' + esc(wayLbl(w)) + ' · ' + list.length + '</div>' +
    gord.map(function (g) {
      return (gord.length > 1
                ? '<div class="wgrp">' + esc(g) + ' · ' + byGrade[g].length + '</div>'
                : '') +
        byGrade[g].map(function (q) { return pRow(q, true); }).join('');
    }).join('') +
    '<p class="h" style="margin-top:10px">✓ מסמן את מי שסיים את הדף השבוע.</p></div>';
}

/* כמה מהדף הוא עבר, 0–1. השרת מחזיר `pos` רק לשבוע שלא הושלם,
   ולכן אין כאן סתירה בין הפס לבין הסימון. */
function frac(p) {
  var wk = LWeek();
  if (wk < 0 || didWeek(p)) return 0;
  var m = p.pos || {};
  for (var k in m) if (String(k).split('|')[1] === String(wk + 1)) return m[k];
  return 0;
}
/* `noGrade` — ברשימה שכבר מקובצת לפי שכבה, חזרה על השכבה בכל
   שורה היא רעש.

   ולעולם לא `list.map(pRow)`: `map` מעביר את האינדקס כארגומנט
   שני, ולכן כל שורה מלבד הראשונה קיבלה noGrade אמיתי ואיבדה
   את השכבה שלה. עוטפים. */
function pRow(p, noGrade) {
  var did = didWeek(p), f = did ? 0 : frac(p);
  /* שם מלא ושכבה. "יונתן" לבדו אינו מזהה אף אחד בשכבה של ארבעים,
     והרשימה הזו נועדה לצוות שצריך לדעת למי לפנות. */
  var nm = ((p.first || '') + ' ' + (p.last || '')).trim() || '—';
  var bits = [];
  if (p.grade && !noGrade) bits.push(p.grade);
  if (p.with)  bits.push('עם ' + p.with);
  var sub = bits.join(' · ');
  /* פס ולא אחוז. "29%" מזמין השוואה בין תלמידים, והוא גם מדויק
     יותר ממה שהוא באמת — קטע 12 מתוך 41 אינו 29 אחוז מהלימוד.
     פס אומר את הדבר היחיד שהצוות צריך: הוא התחיל, והוא בדרך. */
  return '<div class="prow' + (did ? ' did' : (f ? ' mid' : '')) + '">' +
    '<span class="tick">' + (did ? '✓' : '') + '</span>' +
    '<div style="flex:1">' +
    '<b>' + esc(nm) + '</b>' +
    (sub ? '<div class="s">' + esc(sub) + '</div>' : '') +
    (f ? '<div class="pbar"><i style="width:' +
         Math.max(5, Math.round(f * 100)) + '%"></i></div>' : '') +
    '</div></div>';
}

/* השער: בלי קוד אין שמות, ויש לומר את זה פעם אחת ובשקט — לא
   ככרטיס שתופס חצי מסך בכל כניסה. */
function keyHtml() {
  if (acc && roster) return '';
  if (!acc) {
    return '<div class="keyline">הרשימות השמיות נפתחות עם קוד הגישה של ' +
      'הישיבה, המוטמע בקישור האישי שנשלח אליכם.' +
      (rosterMsg ? '<br><b>' + esc(rosterMsg) + '</b>' : '') +
      '<button class="klink" id="kask">הזנת הקוד ידנית</button></div>';
  }
  return '<div class="keyline">' + esc(rosterMsg || 'טוען את הרשימה…') +
    (rosterMsg ? '<button class="klink" id="kask">הזנת הקוד ידנית</button>' : '') +
    '</div>';
}

/* המספרים של הישיבה עצמה, בנוסח שאפשר להדביק בקבוצה. לפני
   שהשנה מתחילה אין "סיימו השבוע", ולכן יש שני נוסחים ולא אחד
   עם אפסים. */
function groupMsg() {
  var wk = LWeek(), tr = TRACKS[0].id;
  try { var t = localStorage.getItem('dfHomeTrack');
        for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === t) tr = t; } catch (e) {}
  var n = joined ? joined.n : 0;
  var v = { inst: inst ? inst.name : '', n: n, url: joinUrl() };
  if (wk < 0) return tp(UI.groupWaPre, v);
  var trk = null;
  for (var j = 0; j < TRACKS.length; j++) if (TRACKS[j].id === tr) trk = TRACKS[j];
  v.daf = 'מסכת ' + (trk ? trk.masechet : '') + ' · דף ' + (LDaf(tr, wk) || '');
  v.did = LCount(tr, wk, code);
  return tp(UI.groupWa, v);
}

/* ---------- הקישור לתלמידים ----------
   כאן, ולא רק בהודעה שנשלחה בהרשמה: הודעת וואטסאפ נקברת
   בקבוצה תוך יומיים, והלוח הוא מה שהוא שומר. */
/* בסיס הכתובת — בלי המקטע האחרון, יהיה אשר יהיה.

   `cleanUrls` ב-Vercel מגיש את העמוד הזה בכתובת `/board` ולא
   `/board.html`, ולכן הסרה של הסיומת לא תפסה כלום: הבסיס נשאר
   `…/board`, והקישור שנבנה עליו יצא `…/boardboard.html` — 404
   אצל כל מי שקיבל אותו. */
function baseUrl() {
  return location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '');
}
function joinUrl() {
  return baseUrl() + 'join.html?inst=' + encodeURIComponent(code);
}
/* הקישור לעמוד הזה עצמו, נקי מכל מה שהודבק אחריו. */
function boardUrl() {
  /* עם הקוד. קישור לצוות בלי קוד הוא קישור שייפתח אצלם על מסך
     שאומר "הזינו קוד" — כלומר לא קישור. */
  var u = baseUrl() + 'board.html?inst=' + encodeURIComponent(code);
  return acc ? u + '&k=' + encodeURIComponent(acc) : u;
}

function draw() {
  if (!inst) {
    $('body').innerHTML = '<div class="card"><h2>הקישור אינו שלם</h2>' +
      '<p class="h">כתובת הלוח כוללת את קוד הישיבה, למשל ' +
      '<span dir="ltr">board.html?inst=avir</span>. בקשו מרכז התוכנית ' +
      'את הקישור של הישיבה שלכם.</p></div>';
    return;
  }
  $('sub').textContent = inst.name;

  var wk = LWeek(), tr = TRACKS[0].id;
  try { var t = localStorage.getItem('dfHomeTrack');
        for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === t) tr = t; } catch (e) {}

  var n     = joined ? joined.n : 0;
  var dads  = 0;
  if (joined) joined.ways.forEach(function (p) { if (p[0] === 'אבות ובנים') dads = p[1]; });
  var daf   = wk >= 0 ? LDaf(tr, wk) : null;
  var didWk = wk >= 0 ? LCount(tr, wk, code) : 0;

  /* קישור אחד בחזית, ולא שניים.

     הקישור לצוות ירד ממעמד שווה. ראש חטיבה שנרשם מהטלפון שלו
     מקבל את הלוח באותו מכשיר — אין מה למסור לו, וכרטיס שמציג
     שני קישורים זה לצד זה הפך משימה אחת לשתי החלטות.

     מה שנשאר הוא בדיוק מה שהוא כן: דרך לצרף איש צוות נוסף,
     ורשת ביטחון למי שהחליף מכשיר. לכן הוא למטה, שקט, ובלשון
     שאומרת למה הוא קיים. */
  var share =
    '<div class="card"><h2>' + esc(UI.kidsTitle) + '</h2>' +
    '<p class="h">' + esc(UI.linkNote) + '</p>' +
    '<div class="url">' + esc(joinUrl()) + '</div>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=' +
      encodeURIComponent(tp(UI.linkWa, { inst:inst.name, url:joinUrl() })) + '">' +
      esc(UI.kidsWaBtn) + '</a>' +
    '<button class="btn g" id="cp">' + esc(UI.kidsCopy) + '</button>' +

    /* ההודעה לקבוצה נושאת תמיד את **קישור התלמידים** ולעולם לא
       את קישור הלוח — הודעה שנשלחת לקבוצת כיתה עם הקוד בתוכה
       היא הדליפה הקלה ביותר שאפשר לייצר. */
    '<a class="btn g" style="text-decoration:none" target="_blank" rel="noopener" ' +
    'href="https://wa.me/?text=' + encodeURIComponent(groupMsg()) + '">' +
    esc(UI.groupBtn) + '</a></div>' +

    '<div class="card team"><h2>' + esc(UI.teamAlso) + '</h2>' +
    '<p class="h">' + esc(UI.teamAlsoSub) + '</p>' +
    '<div class="url">' + esc(boardUrl()) + '</div>' +
    '<a class="btn b" target="_blank" rel="noopener" href="https://wa.me/?text=' +
      encodeURIComponent(tp(UI.teamWa, { inst:inst.name, url:boardUrl() })) + '">' +
      esc(UI.teamWaBtn) + '</a>' +
    '<button class="btn g" id="cp-team">' + esc(UI.teamCopy) + '</button></div>';

  /* לפני שהצטרף מישהו — לא אפס ושלושה גרפים ריקים, אלא מה
     לעשות עכשיו. זה גם מה שהופך את הלוח למלא מחר. */
  if (!n) {
    $('body').innerHTML =
      '<div class="card"><div class="empty"><div class="big">📩</div>' +
      '<p>הקישור לתלמידים עוד לא הופץ.<br>שלחו אותו לכיתות ולהורים, ' +
      'וכאן תראו כמה הצטרפו.</p></div></div>' + share + soonLine();
    wire();
    return;
  }

  var maxG = 0;
  joined.grades.forEach(function (p) { if (p[1] > maxG) maxG = p[1]; });
  var weekOpen = roster && LWeek() >= 0;

  /* המספר שראש חטיבה פותח את הלוח בשבילו, ורק הוא, למעלה.
     כשיש רשימה שמית — סופרים ממנה, כי היא מדויקת יותר מהמונה. */
  var doneN = roster ? roster.filter(didWeek).length : didWk;
  var totN  = roster ? roster.length : n;

  $('body').innerHTML =
    heroHtml(daf, doneN, totN, weekOpen) +

    /* שלוש המסגרות, כל אחת עם המספר שלה — וזה מה שראש חטיבה
       באמת רוצה לדעת: לא כמה בסך הכול, אלא שיש אבות ובנים. */
    '<div class="card"><h2>דרכי הלימוד</h2>' +
    '<p class="h">' + (roster ? 'לחיצה על משבצת פותחת את השמות.'
                              : 'המספרים של הישיבה שלכם.') + '</p>' +
    tilesHtml() + wayOpenHtml() + keyHtml() + '</div>' +

    (joined.grades.length
      ? '<div class="card"><h2>לפי שכבה</h2><div class="bars">' +
        joined.grades.map(function (p) {
          return '<div class="bar"><span class="k">' + esc(p[0]) + '</span>' +
            '<span class="t"><i style="width:' +
            Math.max(6, Math.round(p[1] / maxG * 100)) + '%"></i></span>' +
            '<span class="n">' + p[1] + '</span></div>';
        }).join('') + '</div></div>'
      : '') +

    share + soonLine();
  wire();
}
/* ---------- הכותרת ----------
   טבעת ולא מספר יבש. "7 מתוך 17" הוא נתון שצריך לחשב; טבעת
   שמלאה בשני שליש היא מצב שרואים. המספר עדיין שם, במרכזה,
   כי מי שרוצה את המדויק לא צריך לנחש אותו מהצורה.

   לפני שהלימוד התחיל אין מה למלא, ולכן במקום טבעת ריקה —
   שנקראת כאפס ולא כ"עוד לא" — מוצג מה שכן ידוע: מתי מתחילים. */
function ringHtml(done, tot) {
  var C = 213.6;                                  /* 2πr, r=34 */
  var pct = tot ? Math.max(0, Math.min(1, done / tot)) : 0;
  return '<div class="ring"><svg width="84" height="84" viewBox="0 0 84 84">' +
    '<circle class="bg" cx="42" cy="42" r="34"></circle>' +
    '<circle class="fg" cx="42" cy="42" r="34" stroke-dasharray="' +
    (pct * C).toFixed(1) + ' ' + C + '"></circle></svg>' +
    '<div class="mid"><b>' + done + '</b><span>מתוך ' + tot + '</span></div></div>';
}
function heroHtml(daf, done, tot, canOpen) {
  if (!daf) {
    return '<div class="hero"><div style="flex:1">' +
      '<span class="tag">בקרוב</span>' +
      '<h3>מתחילים בפרשת בראשית</h3>' +
      '<div class="lead"><b>' + tot + '</b> כבר נרשמו מהישיבה</div>' +
      '<div class="sub">כשהשבוע הראשון ייפתח, כאן יופיע מי למד אותו.</div>' +
      '</div></div>';
  }
  var tag  = canOpen && view === 'week' ? 'סגירה ×' : 'מי ומי ←';
  var body =
    '<div style="flex:1">' +
    '<span class="tag">השבוע</span>' +
    '<h3>דף ' + esc(daf) + '</h3>' +
    '<div class="lead"><b>' + done + '</b> מתוך ' + tot + ' סיימו את הדף</div>' +
    '<div class="sub">' + tot + ' מצטרפים בישיבה' +
    (canOpen ? '' : ' · השמות נפתחים עם קוד הגישה') + '</div>' +
    (canOpen ? '<i class="chev">' + tag + '</i>' : '') +
    '</div>' + ringHtml(done, tot);
  return canOpen
    ? '<button class="hero" onclick="go(\'week\')">' + body + '</button>' +
      (view === 'week' ? '<div class="card" style="margin-top:9px">' +
                         weekOpenHtml() + '</div>' : '')
    : '<div class="hero">' + body + '</div>';
}

/* `num()` ירדה יחד עם שורת שלוש המשבצות. */
/* משפט אחד עם תאריך, ולא רשימת פיצ'רים. רשימה קוראת כמו שיווק
   ומזמינה למדוד אותנו מול הבטחה; משפט אחד הוא הבטחה שאפשר
   לעמוד בה. */
/* לפני שהלימוד מתחיל — שורת הסימנייה של השבוע הראשון, לא
   תאריך לועזי. הלוח עצמו כבר מציג אותה; זו רק המשלימה לכותרת. */
function soonLine() {
  var d = new Date(PROGRAM.startDate + 'T00:00:00');
  if (isNaN(d) || Date.now() >= d.getTime()) return '';
  var r0 = TRACKS[0].cal[0];
  return '<p class="soon">מתחילים · ' + esc(r0[1]) + ' · דף ' + esc(r0[2]) +
         '<br>' + esc(r0[0]) + '</p>';
}

function wire() {
  bindCopy('cp', joinUrl);
  bindCopy('cp-team', boardUrl);
  var ka = $('kask'); if (ka) ka.onclick = keyAsk;
}
function bindCopy(id, urlOf) {
  var b = $(id); if (!b) return;
  b.onclick = function () {
    var u = urlOf(), was = b.textContent;
    var ok = function () { b.textContent = UI.linkCopied;
                           setTimeout(function () { b.textContent = was; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(u).then(ok).catch(function () { legacy(u, ok); });
    else legacy(u, ok);
  };
}
function legacy(txt, done) {
  var t = document.createElement('textarea');
  t.value = txt; t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;top:-999px;opacity:0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(t);
}

$('foot-how').textContent =
  'שמרו את כתובת העמוד הזה — זה הלוח שלכם. הוא נשלח אליכם בהרשמה, ' +
  'ואפשר גם להוסיף אותו למסך הבית.';

/* מהמטמון מיד, ומהגיליון אחר כך — לוח שנפתח בלי רשת מראה את
   מה שהיה, ולא מסך ריק. */
draw();
loadBoard().then(draw);
loadRoster().then(draw);
</script>
