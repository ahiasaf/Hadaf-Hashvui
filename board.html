<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הלוח — הדף השבועי של בני עקיבא</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E2E63">
<meta name="robots" content="noindex">
<style>
/* ============================================================
   הלוח של ראש החטיבה.

   קישור קבוע אחד למוסד: board.html?inst=avir

   מספרים בלבד — וזו החלטה, לא חוסר.
   ------------------------------------
   הקישור הזה מועבר. ראש חטיבה שולח לר״ם, ר״ם לר״ם אחר, ומישהו
   מדביק אותו בקבוצה. אם הוא היה מכיל שמות של תלמידים, כל
   העברה כזו הייתה דליפה של רשימת קטינים — בדיוק מה שהגיליון
   הפרטי והסיסמה באו למנוע. לכן הוא קורא **רק** מהלשוניות
   הציבוריות, שיש בהן קוד ישיבה ומספר.

   השמות יושבים בפאנל הניהול של הרכז, מאחורי סיסמת הקריאה.

   וזה גם המקום שבו הוא מוצא שוב את קישור ההצטרפות: קישור אחד
   לזכור במקום שניים.
   ============================================================ */
:root{
  --blue:#17468F; --blue-d:#0B2550; --blue-l:#3574CE;
  --green:#6FA83B; --green-d:#4A821C;
  --gold:#C08F2B; --gold-l:#E3B44A;
  --paper:#F6F1E6; --surface:#FFFDF8; --sunk:#EFE6D3;
  --ink:#1B2A45; --ink-2:#5A6780; --ink-3:#96A0B2; --rule:#E5DAC3;
  --r:16px; --r-s:12px;
  --sh-1:0 1px 2px rgba(37,29,12,.05), 0 2px 8px rgba(37,29,12,.05);
  --sh-2:0 2px 4px rgba(37,29,12,.06), 0 10px 26px rgba(37,29,12,.08);
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:"Assistant","Segoe UI","Noto Sans Hebrew","Arial Hebrew",system-ui,sans-serif}

/* תמונה שעוד אין לה כתובת — לא מציגים סימן שבור.
   הלוגו מוטמע ב-logo.js, והקובץ הזה שוקל 88KB ומגיע מהרשת.
   עד שהוא נוחת, ל-<img> אין src בכלל — והדפדפן מצייר במקומו
   ריבוע שבור. בקליטה טובה זה מהבהב לרגע; בקליטה חלשה זה מה
   שרואים במשך שניות, ובדיוק במסך הראשון של האפליקציה.

   visibility ולא display: המסגרת שומרת על מקומה, ולכן כשהלוגו
   מגיע שום דבר לא קופץ. */
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.6;
  padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}

/* ---------- חתימת התוכנית ----------
   זהה לעמוד הראשי. הסמל העגול על רקע לבן, השם בשתי שורות,
   ומתחת — הישיבה או השנה. */
header{background:linear-gradient(150deg,var(--blue-d),var(--blue));
  padding:calc(env(safe-area-inset-top) + 10px) 4px 6px}
.masthead{display:flex;align-items:center;gap:13px;padding:14px;
  max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.12),0 8px 22px rgba(0,0,0,.14)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:#fff}
.masthead .yr{font-size:.78rem;font-weight:800;color:var(--gold-l);
  letter-spacing:.03em;margin-top:3px}

.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:18px;margin-top:14px;box-shadow:var(--sh-1)}
.card h2{font-size:.98rem;font-weight:800;letter-spacing:-.02em}
.card .h{font-size:.8rem;font-weight:600;color:var(--ink-3);margin-top:3px;line-height:1.6}

/* שלושת המספרים. גדולים, כי הם הסיבה שהוא פתח את הדף. */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.num{background:var(--surface);border-radius:var(--r);padding:15px 8px;
  text-align:center;box-shadow:var(--sh-2);border-top:3px solid var(--gold)}
.num b{display:block;font-size:1.75rem;font-weight:800;letter-spacing:-.04em;
  line-height:1.1;color:var(--blue)}
.num span{display:block;font-size:.72rem;font-weight:800;color:var(--ink-3);
  margin-top:4px;line-height:1.35}
@media (max-width:339px){.nums{grid-template-columns:1fr 1fr}}

/* פילוח. מוט ולא עוגה: השוואה בין שכבות נקראת בעין בשורות
   באורך שונה, ובעוגה צריך לפענח אותה. */
.bars{margin-top:12px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:2.6rem 1fr 2rem;align-items:center;gap:9px}
.bar .k{font-size:.84rem;font-weight:800;color:var(--ink-2)}
.bar .t{height:9px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,var(--blue-l),var(--blue))}
.bar .n{font-size:.84rem;font-weight:800;text-align:start}

.wk{margin-top:12px;padding-top:13px;border-top:1px solid var(--rule)}
.wk b{font-size:1.02rem;font-weight:800}
.wk .of{font-size:.88rem;font-weight:700;color:var(--ink-2);margin-top:3px}

.btn{display:block;width:100%;text-align:center;font-size:.98rem;font-weight:800;
  border:0;border-radius:14px;padding:15px;margin-top:11px;cursor:pointer;
  font-family:inherit;color:#fff;text-decoration:none;
  background:linear-gradient(140deg,var(--green),var(--green-d));
  box-shadow:0 6px 18px rgba(74,130,28,.26)}
.btn.g{background:var(--sunk);color:var(--ink-2);box-shadow:none}
/* כחול לצוות, ירוק לתלמידים. ההבדל הוא לא קישוט: שני קישורים
   שנראים אותו דבר הם הזמנה לשלוח את הלא־נכון, וזו טעות שאי
   אפשר להחזיר ממנה. הצבע, הכותרת והפס בצד עושים את ההבחנה
   לפני שקוראים מילה. */
.btn.b{background:linear-gradient(140deg,var(--blue-l),var(--blue));
  box-shadow:0 6px 18px rgba(23,70,143,.26)}
.lk{border-radius:var(--r-s);padding:12px 13px;margin-top:12px;
  border:1px solid var(--rule);background:var(--surface)}
.lk:first-of-type{margin-top:11px}
.lk.team{border-inline-start:4px solid var(--blue-l);background:#F4F7FC}
.lk.kids{border-inline-start:4px solid var(--green);background:#F5F8F0}
.lk h3{font-size:.9rem;font-weight:800;letter-spacing:-.02em}
.lk.team h3{color:var(--blue)}
.lk.kids h3{color:var(--green-d)}
.lk p{font-size:.8rem;font-weight:600;color:var(--ink-2);margin-top:4px;line-height:1.65}
.lk .btn{margin-top:10px;padding:13px;font-size:.92rem}
/* ההעתקה אינה שוות־ערך לשליחה, ולכן אינה נראית כמוה: קטנה
   יותר, שקטה יותר, ועם השם המלא — שני כפתורים שכתוב עליהם
   "העתקת הקישור" זה בדיוק המקום שבו מעתיקים את הלא־נכון. */
.lk .btn.g{padding:10px;font-size:.82rem;background:transparent;
  border:1px solid var(--rule);color:var(--ink-2)}
.lk .url{background:var(--surface);border:1px solid var(--rule)}
.url{margin-top:11px;background:var(--sunk);border-radius:10px;padding:9px 11px;
  font-size:.76rem;font-weight:700;color:var(--ink-2);direction:ltr;text-align:left;
  overflow-wrap:anywhere;line-height:1.5}

/* ---------- הרשימה השמית ----------
   שם אחד בשורה, וסימן אחד. הרכז סורק את הרשימה בעין ומחפש את
   מי שלא סימן — ולכן ה-✓ הוא מה שבולט, ולא הצבע של השורה. */
.wgrp{font-size:.74rem;font-weight:800;color:var(--ink-3);letter-spacing:.02em;
  margin:13px 0 3px;padding-top:10px;border-top:1px solid var(--rule)}
.wgrp:first-of-type{margin-top:6px;padding-top:0;border-top:0}
.prow{display:flex;align-items:center;gap:9px;padding:8px 0;
  border-bottom:1px solid var(--rule);font-size:.92rem}
.prow:last-child{border-bottom:0}
.prow b{font-weight:800}
.prow .s{font-size:.76rem;font-weight:700;color:var(--ink-3);margin-top:1px}
.prow .tick{flex:none;width:22px;height:22px;border-radius:50%;
  background:var(--sunk);color:transparent;display:flex;align-items:center;
  justify-content:center;font-size:.8rem;font-weight:800}
.prow.did .tick{background:var(--green);color:#fff}
.empty{text-align:center;padding:8px 0 4px}
.empty .big{font-size:2.2rem;line-height:1}
.empty p{font-size:.9rem;font-weight:700;color:var(--ink-2);margin-top:9px;line-height:1.7}

.soon{margin-top:14px;font-size:.82rem;font-weight:700;color:var(--ink-3);
  text-align:center;line-height:1.7}
footer{text-align:center;color:var(--ink-3);font-size:.76rem;font-weight:700;
  margin-top:22px;line-height:1.9}
footer b{display:block;color:var(--ink-2)}
</style>
</head>
<body>

<!-- אותה חתימה שיש בעמוד הראשי: הסמל העגול, "הדף השבועי של
     בני עקיבא", והשנה. זה הפנים של התוכנית, ואין סיבה שמסך
     אחד ייראה אחרת מהשני. -->
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1>הדף השבועי<br>של בני עקיבא</h1>
      <div class="yr" id="sub">שנת תשפ"ז</div></div>
  </div>
</header>

<div class="wrap" id="body"></div>

<div class="wrap"><footer>
  <b id="foot-how"></b>
  רשת ישיבות בני עקיבא · הדף השבועי · תשפ״ז
</footer></div>

<script src="data.js"></script>
<script src="learned.js"></script>
<script src="logo.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function qs(k) {
  var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) {
    return v[k] != null ? v[k] : m;
  });
}
(function () { var l = $('hdr-mark'); if (l) l.src = LOGO_MARK; })();

/* ---------- הישיבה ---------- */
var code = qs('inst'), inst = null;
for (var i = 0; i < INSTITUTIONS.length; i++)
  if (INSTITUTIONS[i].code === code) inst = INSTITUTIONS[i];

/* ============================================================
   קוד הגישה.

   `?inst=avir` לבדו אינו סוד — הוא שם הישיבה, ואפשר לנחש אותו.
   כל עוד הלוח היה מספרים בלבד זה הספיק. ברגע שיש בו שמות של
   תלמידים זה כבר לא, ולכן הקישור האישי נושא `&k=`.

   שלוש דקויות שנקבעו כאן:

   1. **הקוד נשמר במכשיר בפתיחה הראשונה ומנוקה מהכתובת.** הלוח
      הוא מסך שמצלמים ומראים, ו-URL עם קוד בתוכו הוא קוד שדולף
      בצילום מסך. אחרי הביקור הראשון הכתובת נקייה והלוח ממשיך
      לעבוד.

   2. **הקוד שייך למוסד ולא לאדם.** אין הרשמה, אין סיסמה אישית,
      ובישיבה שיש בה כמה אנשי צוות פשוט מעבירים את הקישור הלאה.

   3. **הזנה ידנית כגיבוי.** אפליקציה שנוספה למסך הבית מחזיקה
      אחסון נפרד מהדפדפן, ולכן מי שפתח את הקישור בספארי ואז פתח
      את האפליקציה — לא ימצא שם את הקוד. שש אותיות פותרות את זה
      בלי לחזור לרכז.
   ============================================================ */
function accKey() { return 'boardKey:' + code; }
var acc = '';
try { acc = localStorage.getItem(accKey()) || ''; } catch (e) {}

(function () {
  var k = qs('k');
  if (!k) return;
  acc = k;
  try { localStorage.setItem(accKey(), k); } catch (e) {}
  /* מנקים את הכתובת בלי לטעון מחדש. replaceState ולא assign —
     כפתור "אחורה" לא אמור להחזיר לגרסה שיש בה קוד. */
  try {
    if (history.replaceState) {
      history.replaceState(null, '',
        location.pathname + '?inst=' + encodeURIComponent(code));
    }
  } catch (e2) {}
})();

/* ---------- קריאה מהגיליון הציבורי ----------
   אותן שתי לשוניות שמסך ההצטרפות קורא, ומאותה סיבה: מספרים
   בלבד. */
function sheetCsv(tab) {
  var id = (LGet('cfg', {}) || {}).sheetId || SHEET_ID;
  if (!id || !navigator.onLine) return Promise.resolve(null);
  return fetch('https://docs.google.com/spreadsheets/d/' + id +
               '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(tab) +
               '&t=' + Date.now())
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (t) { return t ? csv(t) : null; })
    .catch(function () { return null; });
}
function csv(text) {
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

/* "ח׳:11 · ט׳:7" → [['ח׳',11],['ט׳',7]] — הצורה שהסקריפט כותב,
   כדי שפילוח לא ידרוש עמודה לכל שכבה. */
function pairs(t) {
  return String(t || '').split('·').map(function (p) {
    var i = p.lastIndexOf(':');
    return i < 0 ? null : [p.slice(0, i).trim(), parseInt(p.slice(i + 1), 10) || 0];
  }).filter(function (x) { return x && x[0] && x[1]; });
}

var joined = LGet('boardCache', null);
function loadBoard() {
  return Promise.all([
    sheetCsv('מונים').then(function (rows) {
      if (!rows || rows.length < 2) return;
      var head = rows[0], ix = {};
      for (var i = 0; i < head.length; i++) ix[String(head[i]).trim()] = i;
      for (var r = 1; r < rows.length; r++) {
        if (String(rows[r][ix['קוד ישיבה']] || '').trim() !== code) continue;
        joined = { n: parseInt(rows[r][ix['מצטרפים']], 10) || 0,
                   grades: pairs(rows[r][ix['שכבות']]),
                   ways:   pairs(rows[r][ix['מסגרות']]) };
        LSet('boardCache', joined);
      }
    }),
    sheetCsv('מוני-לימוד').then(function (rows) {
      var m = LCountsFrom(rows);
      if (m && Object.keys(m).length) LSet('learnCount', m);
    })
  ]).catch(function () {});
}

/* ============================================================
   הרשימה השמית — רק עם הקוד.

   המספרים באים מהלשוניות הציבוריות ואינם דורשים דבר. השמות
   באים מהגיליון הסגור, דרך הסקריפט, והקוד הוא מה שפותח אותם.
   מה שחוזר משם הוא שם פרטי, שכבה, מסגרת, ואילו שבועות סומנו —
   בלי משפחה ובלי טלפון. קישור שדלף חושף "יונתן, ז׳, לומד לבד",
   ולא רשימת קטינים שאפשר ליצור איתם קשר.
   ============================================================ */
var API_URL = (LGet('cfg', {}) || {}).api || APPS_SCRIPT_URL || '';
var roster = LGet('rosterCache:' + code, null);
var rosterMsg = '';

/* Apps Script מפנה את /exec לדומיין אחר, ויש דפדפנים שחוסמים
   את הקריאה בגלל CORS. תגית script אינה כפופה לו כלל. */
function jsonp(url) {
  return new Promise(function (ok) {
    var name = '__brd' + Date.now(), t, sc = document.createElement('script');
    var done = function (v) {
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      clearTimeout(t); if (sc.parentNode) sc.remove(); ok(v);
    };
    t = setTimeout(function () { done(null); }, 12000);
    window[name] = function (d) { done(d); };
    sc.onerror = function () { done(null); };
    sc.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + name;
    document.body.appendChild(sc);
  });
}
function askScript(params) {
  if (!API_URL) return Promise.resolve(null);
  var q = Object.keys(params).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  var url = API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + q;
  return fetch(url).then(function (r) { return r.json(); })
    .catch(function () { return jsonp(url); });
}

function loadRoster() {
  if (!acc) return Promise.resolve(null);
  return askScript({ board:code, k:acc }).then(function (d) {
    if (!d) { rosterMsg = 'לא קיבלתי תשובה מהשרת.'; return null; }
    if (d.status !== 'ok') {
      /* קוד שגוי אינו נשמר — אחרת הוא היה נדבק למכשיר ומונע
         מהקישור הנכון לעבוד בפעם הבאה. */
      if (d.status === 'denied') {
        acc = ''; try { localStorage.removeItem(accKey()); } catch (e) {}
      }
      rosterMsg = d.message || 'לא הצלחתי לפתוח את הרשימה.';
      return null;
    }
    roster = d.students || [];
    rosterMsg = '';
    LSet('rosterCache:' + code, roster);
    return roster;
  }).catch(function () { rosterMsg = 'לא קיבלתי תשובה מהשרת.'; return null; });
}

function keyAsk() {
  var v = prompt('הזינו את קוד הגישה של הישיבה (שש אותיות):', '');
  if (v == null) return;
  v = String(v).trim().toLowerCase();
  if (!v) return;
  acc = v;
  try { localStorage.setItem(accKey(), v); } catch (e) {}
  rosterMsg = 'בודק…'; draw();
  loadRoster().then(draw);
}

/* השם כפי שמציגים אותו כאן: פרטי בלבד, וכשיש שניים זהים —
   מוסיפים את השכבה. */
function rosterHtml() {
  if (!acc) {
    return '<div class="card"><h2>מי לומד</h2>' +
      '<p class="h">הרשימה השמית נפתחת עם קוד הגישה של הישיבה. הוא ' +
      'מוטמע בקישור האישי שרכז התוכנית שלח לכם — פתחו אותו, והלוח ' +
      'יזכור אותו.</p>' +
      (rosterMsg ? '<div class="url">' + esc(rosterMsg) + '</div>' : '') +
      '<button class="btn g" id="kask">הזנת הקוד ידנית</button></div>';
  }
  if (!roster) {
    return '<div class="card"><h2>מי לומד</h2>' +
      '<p class="h">' + esc(rosterMsg || 'טוען…') + '</p>' +
      (rosterMsg ? '<button class="btn g" id="kask">הזנת הקוד ידנית</button>' : '') +
      '</div>';
  }
  if (!roster.length) {
    return '<div class="card"><h2>מי לומד</h2>' +
      '<p class="h">עוד לא הצטרף אף אחד דרך הקישור.</p></div>';
  }

  var wk = LWeek();
  var grp = {}, gord = [];
  roster.forEach(function (p) {
    var w = p.way || '';
    if (!grp[w]) { grp[w] = []; gord.push(w); }
    grp[w].push(p);
  });
  gord.sort(function (a, b) { return grp[b].length - grp[a].length; });

  var didWeek = function (p) {
    if (wk < 0) return false;
    for (var i = 0; i < (p.weeks || []).length; i++)
      if (String(p.weeks[i]).split('|')[1] === String(wk + 1)) return true;
    return false;
  };

  return '<div class="card"><h2>מי לומד · ' + roster.length + '</h2>' +
    '<p class="h">✓ מסמן את מי שסיים את הדף השבוע.</p>' +
    gord.map(function (w) {
      return '<div class="wgrp">' + esc(WAY_SHORT[w] || w || 'לא צוין') +
        ' · ' + grp[w].length + '</div>' +
        grp[w].map(function (p) {
          var did = didWeek(p);
          var sub = [p.grade, p.with ? 'עם ' + p.with : ''].filter(Boolean).join(' · ');
          return '<div class="prow' + (did ? ' did' : '') + '">' +
            '<span class="tick">' + (did ? '✓' : '') + '</span>' +
            '<div><b>' + esc(p.first || '—') + '</b>' +
            (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div></div>';
        }).join('');
    }).join('') + '</div>';
}
var WAY_SHORT = { 'אבות ובנים':'אבות ובנים', 'חבורת לימוד':'חבורה',
                  'לימוד עצמי':'לומדים לבד' };

/* המספרים של הישיבה עצמה, בנוסח שאפשר להדביק בקבוצה. לפני
   שהשנה מתחילה אין "סיימו השבוע", ולכן יש שני נוסחים ולא אחד
   עם אפסים. */
function groupMsg() {
  var wk = LWeek(), tr = TRACKS[0].id;
  try { var t = localStorage.getItem('dfHomeTrack');
        for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === t) tr = t; } catch (e) {}
  var n = joined ? joined.n : 0;
  var v = { inst: inst ? inst.name : '', n: n, url: joinUrl() };
  if (wk < 0) return tp(UI.groupWaPre, v);
  var trk = null;
  for (var j = 0; j < TRACKS.length; j++) if (TRACKS[j].id === tr) trk = TRACKS[j];
  v.daf = 'מסכת ' + (trk ? trk.masechet : '') + ' · דף ' + (LDaf(tr, wk) || '');
  v.did = LCount(tr, wk, code);
  return tp(UI.groupWa, v);
}

/* ---------- הקישור לתלמידים ----------
   כאן, ולא רק בהודעה שנשלחה בהרשמה: הודעת וואטסאפ נקברת
   בקבוצה תוך יומיים, והלוח הוא מה שהוא שומר. */
function joinUrl() {
  return location.href.split('#')[0].split('?')[0]
           .replace(/board\.html$/, '') + 'join.html?inst=' + encodeURIComponent(code);
}
/* הקישור לעמוד הזה עצמו, נקי מכל מה שהודבק אחריו. */
function boardUrl() {
  /* עם הקוד. קישור לצוות בלי קוד הוא קישור שייפתח אצלם על מסך
     שאומר "הזינו קוד" — כלומר לא קישור. */
  var u = location.href.split('#')[0].split('?')[0]
            .replace(/board\.html$/, '') + 'board.html?inst=' + encodeURIComponent(code);
  return acc ? u + '&k=' + encodeURIComponent(acc) : u;
}

function draw() {
  if (!inst) {
    $('body').innerHTML = '<div class="card"><h2>הקישור אינו שלם</h2>' +
      '<p class="h">כתובת הלוח כוללת את קוד הישיבה, למשל ' +
      '<span dir="ltr">board.html?inst=avir</span>. בקשו מרכז התוכנית ' +
      'את הקישור של הישיבה שלכם.</p></div>';
    return;
  }
  $('sub').textContent = inst.name;

  var wk = LWeek(), tr = TRACKS[0].id;
  try { var t = localStorage.getItem('dfHomeTrack');
        for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === t) tr = t; } catch (e) {}

  var n     = joined ? joined.n : 0;
  var dads  = 0;
  if (joined) joined.ways.forEach(function (p) { if (p[0] === 'אבות ובנים') dads = p[1]; });
  var daf   = wk >= 0 ? LDaf(tr, wk) : null;
  var didWk = wk >= 0 ? LCount(tr, wk, code) : 0;

  /* שני קישורים, ובסדר הזה: הצוות קודם. זה הקישור שהוא נמצא בו
     ברגע זה, וזו גם השאלה שהוא שואל ראשונה — "איך אני נותן את
     זה לר״ם שלי". */
  var share =
    '<div class="card"><h2>שני קישורים</h2>' +
    '<p class="h">אחד לצוות, אחד לתלמידים. לא להחליף ביניהם.</p>' +

    '<div class="lk team"><h3>' + esc(UI.teamTitle) + '</h3>' +
    '<p>' + esc(UI.teamNote) + '</p>' +
    '<div class="url">' + esc(boardUrl()) + '</div>' +
    '<a class="btn b" target="_blank" rel="noopener" href="https://wa.me/?text=' +
      encodeURIComponent(tp(UI.teamWa, { inst:inst.name, url:boardUrl() })) + '">' +
      esc(UI.teamWaBtn) + '</a>' +
    '<button class="btn g" id="cp-team">' + esc(UI.teamCopy) + '</button></div>' +

    '<div class="lk kids"><h3>' + esc(UI.kidsTitle) + '</h3>' +
    '<p>' + esc(UI.linkNote) + '</p>' +
    '<div class="url">' + esc(joinUrl()) + '</div>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=' +
      encodeURIComponent(tp(UI.linkWa, { inst:inst.name, url:joinUrl() })) + '">' +
      esc(UI.kidsWaBtn) + '</a>' +
    '<button class="btn g" id="cp">' + esc(UI.kidsCopy) + '</button></div>' +

    /* ההודעה לקבוצה נפרדת משני הקישורים בכוונה: היא אינה
       "קישור" אלא דיווח, והיא נשלחת שוב ושוב לאורך השנה. היא
       נושאת את **קישור התלמידים** ולעולם לא את קישור הלוח —
       הודעה שנשלחת לקבוצת כיתה עם הקוד בתוכה היא הדליפה
       הקלה ביותר שאפשר לייצר. */
    '<a class="btn g" style="text-decoration:none" target="_blank" rel="noopener" ' +
    'href="https://wa.me/?text=' + encodeURIComponent(groupMsg()) + '">' +
    esc(UI.groupBtn) + '</a></div>';

  /* לפני שהצטרף מישהו — לא אפס ושלושה גרפים ריקים, אלא מה
     לעשות עכשיו. זה גם מה שהופך את הלוח למלא מחר. */
  if (!n) {
    $('body').innerHTML =
      '<div class="card"><div class="empty"><div class="big">📩</div>' +
      '<p>הקישור לתלמידים עוד לא הופץ.<br>שלחו אותו לכיתות ולהורים, ' +
      'וכאן תראו כמה הצטרפו.</p></div></div>' + share + soonLine();
    wire();
    return;
  }

  var maxG = 0;
  joined.grades.forEach(function (p) { if (p[1] > maxG) maxG = p[1]; });

  $('body').innerHTML =
    '<div class="nums">' +
      num(n, 'מצטרפים') +
      num(didWk, 'למדו השבוע') +
      num(dads, 'אבות ובנים') +
    '</div>' +

    (joined.grades.length
      ? '<div class="card"><h2>לפי שכבה</h2><div class="bars">' +
        joined.grades.map(function (p) {
          return '<div class="bar"><span class="k">' + esc(p[0]) + '</span>' +
            '<span class="t"><i style="width:' +
            Math.max(6, Math.round(p[1] / maxG * 100)) + '%"></i></span>' +
            '<span class="n">' + p[1] + '</span></div>';
        }).join('') + '</div>' +
        (daf ? '<div class="wk"><b>השבוע · דף ' + esc(daf) + '</b>' +
               '<div class="of">' + didWk + ' מתוך ' + n + ' סיימו</div></div>' : '') +
        '</div>'
      : '') +

    rosterHtml() + share + soonLine();
  wire();
}
function num(v, t) {
  return '<div class="num"><b>' + v + '</b><span>' + esc(t) + '</span></div>';
}
/* משפט אחד עם תאריך, ולא רשימת פיצ'רים. רשימה קוראת כמו שיווק
   ומזמינה למדוד אותנו מול הבטחה; משפט אחד הוא הבטחה שאפשר
   לעמוד בה. */
/* לפני שהלימוד מתחיל — שורת הסימנייה של השבוע הראשון, לא
   תאריך לועזי. הלוח עצמו כבר מציג אותה; זו רק המשלימה לכותרת. */
function soonLine() {
  var d = new Date(PROGRAM.startDate + 'T00:00:00');
  if (isNaN(d) || Date.now() >= d.getTime()) return '';
  var r0 = TRACKS[0].cal[0];
  return '<p class="soon">מתחילים · ' + esc(r0[1]) + ' · דף ' + esc(r0[2]) +
         '<br>' + esc(r0[0]) + '</p>';
}

function wire() {
  bindCopy('cp', joinUrl);
  bindCopy('cp-team', boardUrl);
  var ka = $('kask'); if (ka) ka.onclick = keyAsk;
}
function bindCopy(id, urlOf) {
  var b = $(id); if (!b) return;
  b.onclick = function () {
    var u = urlOf(), was = b.textContent;
    var ok = function () { b.textContent = UI.linkCopied;
                           setTimeout(function () { b.textContent = was; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(u).then(ok).catch(function () { legacy(u, ok); });
    else legacy(u, ok);
  };
}
function legacy(txt, done) {
  var t = document.createElement('textarea');
  t.value = txt; t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;top:-999px;opacity:0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(t);
}

$('foot-how').textContent =
  'שמרו את כתובת העמוד הזה — זה הלוח שלכם. הוא נשלח אליכם בהרשמה, ' +
  'ואפשר גם להוסיף אותו למסך הבית.';

/* מהמטמון מיד, ומהגיליון אחר כך — לוח שנפתח בלי רשת מראה את
   מה שהיה, ולא מסך ריק. */
draw();
loadBoard().then(draw);
loadRoster().then(draw);
</script>
</body>
</html>
