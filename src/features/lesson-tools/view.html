

<header>
  <div class="hrow">
    <a class="back" href="/app" id="back" aria-label="יציאה מהדף" title="יציאה">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <!-- שם הדף הוא הכפתור לבחירת דף ועמוד. -->
    <div class="ttl" id="ttl" role="button" tabindex="0" onclick="pickOpen()" aria-label="בחירת דף ועמוד">
      <div class="lesson-title"><h1 id="t-daf"><span id="t-mas">לימוד אינטראקטיבי</span> <span id="t-page" hidden></span></h1><span id="t-sub"></span></div>
      <span class="lesson-choose"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 2h4v4H2zm8 0h4v4h-4zM2 10h4v4H2zm8 0h4v4h-4z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>בחירת דף</span>
    </div>
    <!-- "קטע 2 מתוך 9", ליד פס ההתקדמות. -->
    <span id="count"></span>
  </div>
  <div class="prog"><i id="bar"></i></div>
</header>
<!-- נדלקת רק כשחזרנו לאמצע דף, ומתפוגגת לבד. -->
<div class="resume" id="resume" aria-hidden="true" inert></div>
<div class="pick" id="pick" onclick="if(event.target===this)pickClose()"></div>

<main>
  <!-- האזור הצדדי **ראשון** בסדר ה-DOM, ולכן במסך RTL הוא הימני
       ביותר: המצגת מימין לדף, והחברותא משמאלו. -->
  <aside id="side"></aside>

  <section class="stage" id="stage">
    <div id="holder">
      <img id="page" alt="צורת הדף" draggable="false">
      <svg id="ov" preserveAspectRatio="none"></svg>
      <!-- מסגרת הזהב שנוסעת מקטע לקטע. ראו glowPaint. -->
      <svg id="glow" preserveAspectRatio="none" aria-hidden="true"><rect rx="6"/></svg>
    </div>
    <div class="dbadge" id="dbadge"></div>
    <button class="qfab" id="qfab" title="חידה"><img src="icon-quiz.png" alt="חידה"></button>
    <div class="qhint" id="qhint" role="button" tabindex="0"></div>
    <div class="veil" id="veil" aria-busy="true"><div class="load-card">
      <svg class="load-page" viewBox="0 0 160 190" aria-hidden="true">
        <rect x="18" y="8" width="124" height="172" rx="12" fill="var(--surface)" stroke="var(--rule)" stroke-width="2"/>
        <path d="M38 33h84M38 44h84M38 55h84M38 78h35m14 0h35M38 89h35m14 0h35M38 100h35m14 0h35M38 123h84M38 134h84M38 145h84M38 156h60" stroke="var(--rule)" stroke-width="4" stroke-linecap="round"/>
        <rect class="load-focus" x="30" y="68" width="100" height="42" rx="6" fill="none" stroke="var(--gold)" stroke-width="2"/>
      </svg>
      <div class="load-status" role="status" aria-live="polite">
        <b id="veil-t">פותחים את הדף</b>
        <small id="veil-s">טוענים את הדף והביאור</small>
      </div>
      <div class="spin" aria-hidden="true"><i></i><i></i><i></i></div>
    </div></div>
  </section>

  <!-- מגירת הביאור. בטלפון היא גיליון תחתון עם ידית: גוררים
       למעלה למסך מלא, למטה להצצה. במחשב היא עמודה לצד הדף. -->
  <aside class="chav" id="chav">
    <div class="chd" id="chd">
      <i class="grip" aria-hidden="true"></i>
      <span class="cht" id="cht"></span>
      <span class="sp"></span>
      <span id="chnum" hidden></span>
      <span class="zoom" role="group" aria-label="גודל הטקסט">
        <button id="czm" aria-label="הקטנת הטקסט" title="הקטנת הטקסט">א−</button>
        <button id="czp" aria-label="הגדלת הטקסט" title="הגדלת הטקסט">א+</button>
      </span>
      <button id="chclose" aria-label="סגירת הביאור" title="סגירה">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="chb" id="chb"></div>
  </aside>
</main>

<!-- לוח המקליט. מוסתר תמיד, ונדלק רק ב-`?rec=1`. -->
<div class="rec" id="rec">
  <div class="rec-h"><b>מקליט הדגמה</b></div>
  <div class="rec-b" id="rec-b"></div>
  <div class="rec-a" id="rec-a"></div>
</div>

<!-- הסרגל: הקודם כחץ, מתגי התצוגה כקבוצה אחת, והבא בזהב. -->
<nav><div class="nrow">
  <button id="prev" aria-label="הקטע הקודם" title="הקטע הקודם">
    <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <!-- בטלפון מתגי התצוגה מקופלים לתפריט; במחשב ה-details נשאר
       פתוח ושקוף והקבוצה נראית כשהייתה. ראו viewMenuInit(). -->
  <details class="tools-menu" id="viewmenu">
    <summary aria-label="אפשרויות תצוגה" title="תצוגה">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10.5" cy="4.5" r="2.2" fill="currentColor"/><circle cx="5.5" cy="11.5" r="2.2" fill="currentColor"/></svg>
    </summary>
    <div class="tools" role="group" aria-label="תצוגה">
      <button id="chtog" aria-controls="chav" aria-pressed="false">ביאור</button>
      <!-- מוסתר עד שיודעים שיש לדף הזה מצגת. ראו sideInit(). -->
      <button id="dktog" aria-controls="side" aria-pressed="false" style="display:none">איור</button>
      <button id="whole" aria-pressed="false" title="מעבר בין מיקוד לדף המלא">כל הדף</button>
    </div>
  </details>
  <span class="sp"></span>
  <button class="p" id="next">הבא ◂</button>
</div></nav>

<!-- שער הדף: הוצאת ח. וגשל נתנה רשות להשתמש בצורת הדף וביקשה
     קישור לרכישה. נפתח בכניסה הראשונה, ואחר כך חולף מעצמו. -->
<div class="sheet gate" id="gate"><div class="card">
  <a id="g-logo" target="_blank" rel="noopener"><img id="g-logoimg" alt=""></a>
  <div class="gn" id="g-gem"></div>
  <a class="gbuy" id="g-gembuy" target="_blank" rel="noopener"></a>
  <i class="grule"></i>
  <div class="gk" id="g-k2"></div>
  <div class="gn sm" id="g-chav"></div>
  <div class="gby" id="g-chavby"></div>
  <button class="btn p" id="gate-go"></button>
</div></div>

<!-- בחירת שקף קיים לחלק-פירוש (ניהול). -->
<div class="sheet own-pick" id="own-pick"></div>

<!-- ייצוא הפירוש לכל הדף (ניהול). -->
<div class="sheet own-export" id="own-export"></div>

<!-- מסך הסיום. שתי הפעולות שתלמיד באמת רוצה כאן הן החידה
     והדף הבא, ולכן הן למעלה ובולטות. -->
<div class="sheet" id="done"><div class="card done-card">
  <div class="seal" aria-hidden="true">
    <svg viewBox="0 0 32 32" width="36" height="36"><path d="M7 16.5l6 6L25 10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h2>ישר כוח!</h2>
  <p id="done-sub"></p>
  <p id="done-mark" style="display:none;font-weight:800;color:var(--ok, #4A821C);
     font-size:.88rem;margin-top:-4px"></p>
  <a class="btn p" id="to-quiz" href="join.html">לשאלה השבועית</a>
  <a class="btn nx" id="to-next" href="./">לדף הבא</a>
  <button class="btn" id="stay">חזרה לדף</button>
  <div class="minor">
    <button id="again">מהתחלה</button>
    <a href="/app" id="to-home">חזרה לתוכנית</a>
  </div>
</div></div>

<!-- לוח השנה, קישורי הדפים וכתובת המחבר - אותם קבצים שהאפליקציה
     עצמה נשענת עליהם. אין כאן מאגר נפרד. -->
