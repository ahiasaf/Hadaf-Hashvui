<!-- ============================================================
     עמוד הקידום של ההגרלה — לפני שיש זוכים.
     ============================================================
     נפתח מהודעת הקידום. תמונה אחת שאושרה (חמשת הפרסים), ברוחב
     המסך ובגובה אוטומטי — בלי חיתוך, בלי בחירה ובלי אנימציה.
     מתחתיה שתי ההסתייגויות כמלל חי.

     שלושה מצבים, נפרדים:
       · קידום — מה שלמעלה. לכל מי שאינו מזוהה כתלמיד של מוסד
         שבהגרלה, ולכל אחד לפני הפרסום. בלי זוכים ובלי שעה.
       · תוצאות — "יש זוכים בהגרלה!", הזוכה מהמוסד של הקורא ראשון,
         שאר הזוכים, ואחריהם הפרסים. **רק מה שהשרת החזיר** (raffleRes_
         ב-apps-script.gs): פורסם, והמזהה שבמכשיר שייך לתלמיד של
         המוסד. הסתרה כאן אינה ההגנה — השרת הוא.
       · סגור — מכשיר של לפיד או "אחר": אין הגרלה ואין פרסים.
       · בדיקה אליך בלבד (`?stk=<אסימון>`; לא `rt` — שם שמור ב-Apps Script) — מההתראה שהרכז שלח לעצמו לפני
         הפרסום (rafSelf_): השרת מחזיר את המבט לפי האסימון, בלי זהות
         המכשיר. אסימון שפג — הקידום הרגיל.
       · דוגמה לפני הגרלה (`?stk=<אסימון>&dm=1`) — מההתראה שהרכז שלח לעצמו
         ממסך בחירת המוסדות, לפני כל הגרלה (rafDemo_): השרת מחזיר רק סוג
         הודעה ומוסדות, והעמוד בונה "תלמיד לדוגמה" לכל מוסד — אין כאן שום
         תלמיד אמיתי. התווית "דוגמה" נשארת בראש המסך לאורך כל הגלילה,
         ומופיעה רק בנתיב הזה. אסימון של "בדיקה אליך" אינו נפתח כדוגמה,
         ולהפך (מרחבים נפרדים במטמון). פג — הקידום הרגיל, בלי תוצאה.
       · תצוגה מקדימה (`?pv=w|g`) — רק בתוך מסך האישור בניהול: הנתונים
         נלקחים מהעמוד שמסביב (rafPvGet ב-index.html), לא מהשרת ולא
         מהכתובת. נפתח לבד — אין נתונים, והעמוד מתנהג כרגיל.
     ============================================================ -->

<style>
html,body{touch-action:manipulation;overflow-x:clip;overscroll-behavior-x:none}
:root{
  --blue-d:#0B2550; --gold-t:#8C681F;
  --paper:#F6F1E6; --ink:#1B2A45; --ink-2:#5A6780;
}
*{box-sizing:border-box;margin:0;padding:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img:not([src]){visibility:hidden}
body{background:var(--paper);color:var(--ink);line-height:1.6;
  padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
header{padding:calc(env(safe-area-inset-top) + 4px) 0 0}
.masthead{display:flex;align-items:center;gap:13px;padding:14px 14px 10px;
  max-width:32rem;margin:0 auto}
.masthead .m{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(37,29,12,.07),0 8px 22px rgba(37,29,12,.09)}
.masthead .m img{width:38px;height:38px;display:block;object-fit:contain}
.masthead h1{font-size:1.24rem;font-weight:800;letter-spacing:-.035em;
  line-height:1.2;color:var(--blue-d)}
.masthead .yr{font-size:.76rem;font-weight:800;color:var(--gold-t);
  letter-spacing:.05em;margin-top:3px}
.wrap{max-width:32rem;margin:0 auto;padding:0 16px}
.art{display:block;width:100%;height:auto;border-radius:14px}
.note{margin-top:12px;font-size:.92rem;font-weight:600;color:var(--ink-2)}
.note + .note{margin-top:4px}
#res h2{font-size:1.5rem;font-weight:800;color:var(--blue-d);text-align:center;margin:4px 0 12px}
.win{background:#fff;border:2px solid var(--gold-t);border-radius:16px;padding:14px;text-align:center}
.win small{display:block;font-size:.86rem;font-weight:700;color:var(--ink-2)}
.win b{display:block;font-size:1.4rem;color:var(--blue-d);margin-top:2px}
.win p{margin-top:6px;font-weight:800;color:var(--gold-t)}
.oth{margin-top:14px}
.oth h3,.prz{font-size:1rem;font-weight:800;color:var(--blue-d);margin:16px 0 6px}
.oth li{list-style:none;padding:6px 0;border-bottom:1px solid #E5DAC3;font-weight:600}
.oth li span{color:var(--ink-2);font-weight:500}
.dm{position:sticky;top:0;z-index:5;background:#8C1F1F;color:#fff;font-size:.95rem;font-weight:800;
  text-align:center;padding:9px 12px;padding-top:calc(env(safe-area-inset-top) + 9px)}
.win .dmt{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:800;color:#8C1F1F;
  border:1px solid #8C1F1F;border-radius:999px;padding:1px 10px}
.pv{background:#0B2550;color:#fff;font-size:.86rem;font-weight:800;text-align:center;
  border-radius:10px;padding:7px 10px;margin-bottom:12px}
main.wait{visibility:hidden}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <span class="m"><img id="hdr-mark" alt=""></span>
    <div><h1 id="brand"></h1><div class="yr" id="yr"></div></div>
  </div>
</header>
<main class="wrap" id="main">
  <div id="res"></div>
  <img class="art" id="art" src="promo/hagrala.jpg" width="1024" height="1536" alt="">
  <p class="note" id="note"></p>
  <p class="note" id="illus"></p>
</main>
<script src="data.js"></script>
<script src="testmode.js"></script>
<script src="logo.js"></script>
<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; });
}
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
/* המלל שנערך בניהול — אותן שתי שכבות של שאר העמודים. */
(function () {
  var take = function (map) {
    for (var k in (map || {})) {
      var p = k.split('.');
      if (p.length === 2 && p[0] === 'ui' && typeof map[k] === 'string' && map[k]) UI[p[1]] = map[k];
    }
  };
  try {
    take(JSON.parse(ls('df:textCache') || 'null'));
    take((JSON.parse(ls('df:cfg') || '{}')).texts);
  } catch (e) {}
})();
(function () { var l = $('hdr-mark'); if (l) l.src = LOGO_MARK; })();
$('brand').innerHTML = esc(PROGRAM.short) + '<br>' +
  esc(PROGRAM.name.slice(PROGRAM.short.length).trim());
$('yr').textContent = tp(UI.rstYear, { y: PROGRAM.year });
$('art').alt = UI.hagAlt;
$('note').textContent = UI.hagNote;
$('illus').textContent = UI.hagIllus;

/* ---- מי פותח את העמוד ---- */
var ME = null;
try { ME = JSON.parse(ls('df:me') || 'null'); } catch (e) { ME = null; }
var INST = ME && ME.inst ? String(ME.inst) : '';
function api() {
  var u = ls('dfApi') || (typeof APPS_SCRIPT_URL !== 'undefined' ? APPS_SCRIPT_URL : '');
  return String(u || '').trim();
}
function hide() {
  $('res').innerHTML = '<p class="note">' + esc(UI.hagHidden) + '</p>';
  $('art').style.display = 'none';
  $('note').style.display = 'none';
  $('illus').style.display = 'none';
}
function results(d) {
  var h = '<h2>' + esc(UI.hagWinH) + '</h2>';
  if (d.mine) {
    h += '<div class="win"><small>' + esc(tp(UI.hagMine, { inst: d.mine.inst })) + '</small>' +
         '<b>' + esc(d.mine.name) + '</b>' + (d.me ? '<p>' + esc(UI.hagMe) + '</p>' : '') + '</div>';
  } else {
    h += '<p class="note">' + esc(UI.hagNoMine) + '</p>';
  }
  if (d.others && d.others.length) {
    h += '<div class="oth"><h3>' + esc(UI.hagOthers) + '</h3><ul>' +
      d.others.map(function (o) {
        return '<li>' + esc(o.name) + ' <span>· ' + esc(o.inst) + '</span></li>';
      }).join('') + '</ul></div>';
  }
  h += '<div class="prz">' + esc(UI.hagPrizes) + '</div>';
  $('res').innerHTML = h;
}
/* תצוגה מקדימה מתוך האישור הסופי — רק כשהעמוד שמסביב מאותו מקור
   ומחזיק נתונים. גישה למקור אחר זורקת, ואז אין תצוגה. */
var PV = (location.search.match(/[?&]pv=(w|g)(&|$)/) || [])[1] || '', PVD = null;
if (PV && window.parent !== window) {
  try { PVD = window.parent.rafPvGet ? window.parent.rafPvGet(PV) : null; } catch (e) { PVD = null; }
}
var RT = (location.search.match(/[?&]stk=([0-9a-f]{32})(&|$)/) || [])[1] || '';
var DM = /[?&]dm=1(&|$)/.test(location.search);
function instName(c) {
  for (var i = 0; i < INSTITUTIONS.length; i++) if (INSTITUTIONS[i].code === c) return INSTITUTIONS[i].name;
  return c;
}
/* הדוגמה: "תלמיד לדוגמה" לכל מוסד שנבחר ויש בו זכאים — אותו מבנה של
   raffleRes_, ואותו מסך. מוסד בלי זכאים — בלי זוכה, כמו בהגרלה. */
function demo(d) {
  var nm = UI.rafDmName, out = { mine: null, me: false, others: [] };
  (d.w || []).forEach(function (c) {
    var o = { name: nm, inst: instName(c) };
    if (c === d.c) { out.mine = o; out.me = d.k === 'w'; } else out.others.push(o);
  });
  results(out);
  var w = document.querySelector('#res .win');
  if (w) w.insertAdjacentHTML('beforeend', '<span class="dmt">' + esc(UI.rafDmLbl) + '</span>');
  document.body.insertAdjacentHTML('afterbegin', '<div class="dm" role="status">' + esc(UI.rafDmLbl) + '</div>');
}
(function () {
  if (RT && DM && !PVD) {
    var u1 = api(), main1 = $('main'), done1 = false;
    if (!u1 || !window.fetch) return;
    main1.className = 'wrap wait';
    var show1 = function () { if (!done1) { done1 = true; main1.className = 'wrap'; } };
    setTimeout(show1, 5000);
    fetch(u1 + (u1.indexOf('?') < 0 ? '?' : '&') + 'raffle=demov&stk=' + RT + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!done1 && d && d.status === 'ok' && d.state === 'demo') demo(d);
        show1();
      })['catch'](show1);
    return;
  }
  if (RT && !PVD) {
    var u0 = api(), main0 = $('main'), done0 = false;
    if (!u0 || !window.fetch) return;
    main0.className = 'wrap wait';
    var show0 = function () { if (!done0) { done0 = true; main0.className = 'wrap'; } };
    setTimeout(show0, 5000);
    fetch(u0 + (u0.indexOf('?') < 0 ? '?' : '&') + 'raffle=selfv&stk=' + RT + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!done0 && d && d.status === 'ok' && d.state === 'pub') {
          results(d);
          $('res').insertAdjacentHTML('afterbegin', '<div class="pv">' + esc(UI.rafSelfLbl) + '</div>');
        }
        show0();
      })['catch'](show0);
    return;
  }
  if (PVD) {
    results(PVD);
    $('res').insertAdjacentHTML('afterbegin', '<div class="pv">' + esc(UI.rafPvLbl) + '</div>');
    return;
  }
  if (INST === 'lapid' || INST === 'other') { hide(); return; }
  var u = api();
  if (!ME || !ME.id || !INST || !u || !window.fetch) return;
  /* עד שהשרת עונה — לא מראים את הקידום ואז מחליפים. עד חמש שניות. */
  var main = $('main'), done = false;
  main.className = 'wrap wait';
  var show = function () { if (!done) { done = true; main.className = 'wrap'; } };
  setTimeout(show, 5000);
  /* מצב בדיקה: הסשן המאומת (מזהה + אסימון) — ואז תוצאת הגרלת הבדיקה. */
  var tq = window.TM && TM.q();
  fetch(u + (u.indexOf('?') < 0 ? '?' : '&') + 'raffle=res&id=' + encodeURIComponent(ME.id) +
        '&inst=' + encodeURIComponent(INST) +
        (tq ? '&tsid=' + encodeURIComponent(tq.tsid) + '&ttok=' + encodeURIComponent(tq.ttok) : '') +
        '&t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!done && d && d.status === 'ok' && d.state === 'pub') results(d);
      show();
    })['catch'](show);
})();
</script>
</body>
</html>
