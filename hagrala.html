<!-- ============================================================
     עמוד הקידום של ההגרלה — לפני שיש זוכים.
     ============================================================
     נפתח מהודעת הקידום. תמונה אחת שאושרה (חמשת הפרסים), ברוחב
     המסך ובגובה אוטומטי — בלי חיתוך, בלי בחירה ובלי אנימציה.
     בתוצאות מתחלפת התמונה: "זכית!" לזוכה, "יש זוכים בהגרלה!" לשאר (art).
     מתחתיה שתי ההסתייגויות כמלל חי.

     שלושה מצבים, נפרדים:
       · קידום — מה שלמעלה. לכל מי שאינו מזוהה כתלמיד של מוסד
         שבהגרלה, ולכל אחד לפני הפרסום. בלי זוכים ובלי שעה.
       · תוצאות — "יש זוכים בהגרלה!", הזוכה מהמוסד של הקורא ראשון,
         שאר הזוכים, ואחריהם הפרסים. **רק מה שהשרת החזיר** (raffleRes_
         ב-apps-script.gs): פורסם, והמזהה שבמכשיר שייך לתלמיד של
         המוסד. הסתרה כאן אינה ההגנה — השרת הוא.
       · סגור — מכשיר של לפיד או "אחר": אין הגרלה ואין פרסים.
       · בדיקה אליך בלבד (`?stk=<אסימון>`; לא `rt` — שם שמור ב-Apps Script) — מההתראה שהרכז שלח לעצמו לפני
         הפרסום (rafSelf_): השרת מחזיר את המבט לפי האסימון, בלי זהות
         המכשיר. אסימון שפג — הקידום הרגיל.
       · דוגמה לפני הגרלה (`?stk=<אסימון>&dm=1`) — מההתראה שהרכז שלח לעצמו
         ממסך בחירת המוסדות, לפני כל הגרלה (rafDemo_): השרת מחזיר רק סוג
         הודעה ומוסדות, והעמוד בונה "תלמיד לדוגמה" לכל מוסד — אין כאן שום
         תלמיד אמיתי. התווית "דוגמה" נשארת בראש המסך לאורך כל הגלילה,
         ומופיעה רק בנתיב הזה. אסימון של "בדיקה אליך" אינו נפתח כדוגמה,
         ולהפך (מרחבים נפרדים במטמון). פג — הקידום הרגיל, בלי תוצאה.
       · תצוגה מקדימה (`?pv=w|g`) — רק בתוך מסך האישור בניהול: הנתונים
         נלקחים מהעמוד שמסביב (rafPvGet ב-index.html), לא מהשרת ולא
         מהכתובת. נפתח לבד — אין נתונים, והעמוד מתנהג כרגיל.
     ============================================================ -->

/* שוברי זכייה (8.99.471) — פרס שאזל, האישור הסופי, והשובר עצמו */

  color:var(--ink-2);font-size:.78rem;font-weight:800}
.vask{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(11,37,80,.45)}

.vbt{display:block;width:100%;margin-top:8px;padding:13px 12px;border:0;border-radius:12px;font:inherit;

.vch .pn{font-size:.95rem;font-weight:700;color:var(--ink-2)}

<main class="wrap" id="main">
  <div id="res"></div>
  <img class="art" id="art" src="promo/hagrala.jpg" width="1024" height="1536" alt="">
  <p class="note" id="note"></p>

<script>
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function tp(t, v) {
  return String(t || '').replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; });
}
function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
/* המלל שנערך בניהול — אותן שתי שכבות של שאר העמודים. */
(function () {
  var take = function (map) {
    for (var k in (map || {})) {
      var p = k.split('.');
      if (p.length === 2 && p[0] === 'ui' && typeof map[k] === 'string' && map[k]) UI[p[1]] = map[k];
    }
  };
  try {
    take(JSON.parse(ls('df:textCache') || 'null'));
    take((JSON.parse(ls('df:cfg') || '{}')).texts);
  } catch (e) {}
})();
(function () { var l = $('hdr-mark'); if (l) l.src = LOGO_MARK; })();
$('brand').innerHTML = esc(PROGRAM.short) + '<br>' +
  esc(PROGRAM.name.slice(PROGRAM.short.length).trim());
$('yr').textContent = tp(UI.rstYear, { y: PROGRAM.year });
$('art').alt = UI.hagAlt;
$('note').textContent = UI.hagNote;
$('illus').textContent = UI.hagIllus;

/* ---- מי פותח את העמוד ---- */
var ME = null;
try { ME = JSON.parse(ls('df:me') || 'null'); } catch (e) { ME = null; }
var INST = ME && ME.inst ? String(ME.inst) : '';
function api() {
  var u = ls('dfApi') || (typeof APPS_SCRIPT_URL !== 'undefined' ? APPS_SCRIPT_URL : '');
  return String(u || '').trim();
}
function hide() {
  $('res').innerHTML = '<p class="note">' + esc(UI.hagHidden) + '</p>';
  $('art').style.display = 'none';
  $('note').style.display = 'none';
  $('illus').style.display = 'none';
}
/* הלימוד של השבוע — אותה כתובת שהבאנר במסך התלמיד פותח (stWeek
   ב-join.html): המסכת שנבחרה במכשיר, אחרת זו של הישיבה, אחרת הראשונה. */
function weekUrl() {
  var t = ls('dfHomeTrack'), tr = '', i, code = INST;
  for (i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === t) tr = t;
  if (!tr && code) {
    var m = {};
    try { m = JSON.parse(ls('df:instMas') || '{}') || {}; } catch (e) { m = {}; }
    String(m[code] || '').split(',').forEach(function (x) {
      x = x.trim();
      for (var j = 0; j < TRACKS.length; j++) if (!tr && TRACKS[j].id === x) tr = x;
    });
  }
  if (!tr) tr = TRACKS[0].id;
  tr = LTrackOf(tr);   /* מסלול השלמה — ראו learned.js */
  var wi = LWeek(); if (wi < 0) wi = 0;
  var d = LDaf(tr, wi);
  if (!d) return 'index.html?st=1' + (code ? '&inst=' + encodeURIComponent(code) : '') + '#week=' + tr + '-' + (wi + 1);
  var am = LAm(tr, wi);
  return 'learn.html?' + LLearnQ(tr) + '&daf=' + encodeURIComponent(d) + (am ? '&amud=' + am : '') +
         (code ? '&inst=' + encodeURIComponent(code) : '');
}
/* ============================================================
   התוצאות — אותו סדר בהגרלה האמיתית, בבדיקה אליך, בתצוגה המקדימה ובדוגמה.
   ============================================================
   "תלמיד רוצה לדעת שזכה ובאילו פרסים, ואחר כך כדרך אגב מי עוד
   זכה. ותלמיד שלא זכה: מעניין אותו שחבר מהמוסד שלו זכה, ובמה,
   ורק אחר כך שאר הרשימה. והכי חשוב: כפתור הפנייה ללימוד."
   "במה" עוד לא הוכרע (פרס מוקצה או בחירה) — אין כאן "הפרס שלך
   הוא". dm — הדוגמה: תווית "דוגמה" גם על כרטיס הזוכה. */
function results(d, dm) {
  var go = function (t) {
    return '<a class="go" href="' + esc(weekUrl()) + '">' + esc(t) +
      '<span class="ar" aria-hidden="true">\u2190</span></a>';
  };
  var slot = '<div id="art-slot"></div>';
  var illus = '<p class="note fine">' + esc(UI.hagIllus) + '</p>';
  var list = function (t) {
    return (d.others && d.others.length) ? '<div class="oth"><h3>' + esc(t) + '</h3><ul>' +
      d.others.map(function (o) {
        return '<li>' + esc(o.name) + ' <span>· ' + esc(o.inst) + '</span></li>';
      }).join('') + '</ul></div>' : '';
  };
  /* לא זכה: השורה "לא זכית?..." ומתחתיה הכפתור ללימוד */
  var lose = '<p class="lose">' + esc(UI.rafGoLose) + '</p>' + go(UI.hagGoWeek);
  var h;
  if (d.me) {
    /* זוכה: התמונה, בחירת הפרס (8.99.297), הכפתור, שאר הזוכים.
       הורה — "{שם} זכה בהגרלה!" ותמונת "יש זוכים": הזכייה של הבן. */
    h = (d.kid ? '<h2>' + esc(tp(UI.przKidH, { name: d.kid })) + '</h2>' : '') +
        slot + '<div id="prz"></div><p class="note fine">' + esc(UI.hagNote) + '</p>' +
        go(UI.rafGoWin) + list(UI.hagOthers) + illus;
  } else if (d.mine) {
    /* חבר מהמוסד זכה: הכותרת, הכרטיס, התמונה, "לא זכית?" והכפתור, שאר הזוכים */
    h = '<h2>' + esc(UI.hagWinH) + '</h2><div class="win"><small>' + esc(tp(UI.hagMine, { inst: d.mine.inst })) + '</small>' +
        '<b>' + esc(d.mine.name) + '</b>' + (dm ? '<span class="dmt">' + esc(UI.rafDmLbl) + '</span>' : '') + '</div>' +
        slot + lose + list(UI.hagOthers) + '<p class="note fine">' + esc(UI.hagNote) + '</p>' + illus;
  } else {
    /* אין חבר מהמוסד: התמונה ("יש זוכים" כבר בה), רשימת הזוכים, "לא זכית?" והכפתור */
    h = slot + list(UI.hagAllWin) + lose + '<p class="note fine">' + esc(UI.hagNote) + '</p>' + illus;
  }
  $('res').innerHTML = h;
  $('art-slot').appendChild($('art'));
  art(d.me && !d.kid ? ART_WIN : ART_RES);
  if (d.me) przInit(d);
  document.body.className += ' dm2';
  $('note').style.display = 'none';
  $('illus').style.display = 'none';
}
/* ============================================================
   בחירת הפרס (8.99.297) — לזוכה, ולהורה בשם הבן.
   ============================================================
   המצב מהשרת (?raffle=prize, rafPrize_): עוד לא בחר — חמשת הכרטיסים
   ועד מתי; בחר — הכרטיס שלו ו"יגיע בקרוב"; הגיע — "הפרס הגיע".
   **אין החלפה**: השרת מקבל רק את הבחירה הראשונה. הבחירה נכתבת כשורה
   ב"בחירת פרס" (no-cors), ואז קריאה חוזרת מאמתת שנקלטה.
   בתצוגה המקדימה, בבדיקה ובדוגמה — הכרטיסים לתצוגה בלבד. */
/* ?prz=1 — מהבאנר בבית: גם כשההגרלה שבעמוד אינה זו שבה זכה. */
var PRZQ = /[?&]prz=1(&|$)/.test(location.search);
var PRZ = ['burger', 'maafe', 'pretzel', 'pizza', 'book'], PRZ_LIVE = false, PRZ_Z = null, PRZ_KID = '';
function przName(k) { return UI['przN_' + k] || k; }
function przCard(k, on, sel, out) {
  if (out) on = false;
  return '<button class="pz' + (sel ? ' sel' : '') + (out ? ' out' : '') + '"' + (on ? ' onclick="przPick(\'' + k + '\')"' : ' disabled') + '>' +
    '<img src="promo/prz-' + k + '.jpg" width="612" height="240" alt="">' +
    '<span><b>' + esc(przName(k)) + '</b> <small>· ' + esc(UI['przS_' + k] || '') + '</small>' +
    (out ? ' <i class="so">' + esc(UI.vchSoldOut) + '</i>' : '') + '</span></button>';
}
/* ============================================================
   שוברי זכייה (8.99.471) — כשהמתג בשרת דלוק (`von` מ-?raffle=prize).
